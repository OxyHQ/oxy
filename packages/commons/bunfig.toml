# commons is a JEST package — see jest.config.js.
#
# `bun test` (bun's own runner) is NOT a supported way to run this suite: it
# ignores jest.config.js (jsdom, expo mocks, setupFilesAfterEnv) and reports a
# plausible partial pass/fail count (e.g. 216 pass / 52 fail). This preload
# aborts that run with an explanation instead. `bun run test` — the declared
# script — is unaffected: [test].preload applies only to `bun test`.
[test]
preload = ["../../scripts/refuse-bun-test.ts"]
