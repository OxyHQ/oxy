# `id.oxy.so` — the web identity carrier. A Worker, not a Pages project, for the
# same reason as `accounts.oxy.so` (see its wrangler.toml): a Pages project
# always also serves `<project>.pages.dev`, and a second copy of the page that
# unseals identities, on a hostname nobody reviews, is not acceptable.
# `workers_dev = false` leaves `id.oxy.so` as the only name that reaches it.
name = "oxy-id"
main = "worker/index.js"
compatibility_date = "2026-09-09"

workers_dev = false

# The Worker runs before every asset so each response carries the
# identity-origin headers (`worker/headers.mjs`).
[assets]
binding = "ASSETS"
run_worker_first = true
directory = "./dist"
html_handling = "auto-trailing-slash"
# A single-page app: every route renders from index.html.
not_found_handling = "single-page-application"

[vars]
OXY_API_ORIGIN = "https://api.oxy.so"

# Cloudflare writes the DNS record for a custom domain itself.
[[routes]]
pattern = "id.oxy.so"
custom_domain = true
