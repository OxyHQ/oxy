# @oxyhq/api is a JEST package — see jest.config.js.
#
# `bun test` (bun's own runner) is NOT a supported way to run this suite: it
# ignores jest.config.js, drops the workspace source moduleNameMapper entries,
# and reports a plausible partial pass/fail count (e.g. 329 pass / 214 fail vs
# jest's 2091/2091). This preload aborts that run with an explanation instead.
# `bun run test` — the declared script — is unaffected: [test].preload applies
# only to `bun test`.
[test]
preload = ["../../scripts/refuse-bun-test.ts"]
