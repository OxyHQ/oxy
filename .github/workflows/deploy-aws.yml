# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute oxy-api (ecs service + ecr repo name) and Dockerfile (path).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "packages/protocol/**"
      - "packages/federation/**"
      - "packages/db/**"
      - "Dockerfile"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-aws.yml"
      # The rollout logic now lives in a script. Without this, editing it
      # would change how every deploy behaves and trigger no deploy to
      # exercise the change.
      - ".github/scripts/deploy-ecs-image.sh"
      - ".github/scripts/smoke-inbox-mcp.sh"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Serialize production rollouts. Two overlapping runs each register a task
  # definition revision and then call update-service; interleaved, the older
  # image wins and the newer run still reports success. Never cancel in
  # progress: an interrupted run leaves an unmonitored rollout in ECS.
  group: deploy-oxy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: oxy-api
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  deploy:
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync API deployment secrets -> SSM (GitHub is the source of truth)
        # Synced secrets use a SYNC_ prefix so they never collide with the AWS
        # CLI's reserved credential env vars (AWS_ACCESS_KEY_ID /
        # AWS_SECRET_ACCESS_KEY / AWS_ENDPOINT_URL). secrets.AWS_ACCESS_KEY_ID is
        # the DO Spaces key, not an AWS IAM key; exporting it under its raw name
        # shadows the OIDC role assumed above and makes `aws ssm put-parameter`
        # fail with UnrecognizedClientException.
        #
        # The `SYNC_*` env block below and the SHARED_SECRETS / API_SECRETS lists
        # in the script are TWO hand-maintained allowlists that have to agree —
        # and a name missing from either is silent: the loop simply never writes
        # that parameter, the deploy goes green, and the next task launch dies
        # with `ResourceInitializationError: unable to pull secrets`. CI job
        # "Deploy Secrets Sync" (scripts/check-deploy-secrets-sync.mjs) fails the
        # build on that mismatch and on any env var this API requires at boot
        # that no list carries. Edit the lists only alongside that gate.
        env:
          SYNC_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SYNC_REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SYNC_SSO_INTERNAL_SECRET: ${{ secrets.SSO_INTERNAL_SECRET }}
          SYNC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SYNC_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SYNC_AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SYNC_AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          SYNC_REDIS_URL: ${{ secrets.REDIS_URL }}
          SYNC_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SYNC_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SYNC_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SYNC_SMTP_TLS_KEY: ${{ secrets.SMTP_TLS_KEY }}
          SYNC_SMTP_TLS_CERT: ${{ secrets.SMTP_TLS_CERT }}
          SYNC_SMTP_RELAY_USER: ${{ secrets.SMTP_RELAY_USER }}
          SYNC_SMTP_RELAY_PASS: ${{ secrets.SMTP_RELAY_PASS }}
          SYNC_EMAIL_INBOUND_WEBHOOK_SECRET: ${{ secrets.EMAIL_INBOUND_WEBHOOK_SECRET }}
          SYNC_DKIM_PRIVATE_KEY: ${{ secrets.DKIM_PRIVATE_KEY }}
          SYNC_EMAIL_S3_ACCESS_KEY_ID: ${{ secrets.EMAIL_S3_ACCESS_KEY_ID }}
          SYNC_EMAIL_S3_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_S3_SECRET_ACCESS_KEY }}
          SYNC_DEVICE_ID_SALT: ${{ secrets.DEVICE_ID_SALT }}
          SYNC_OXY_PUBLIC_KEY: ${{ secrets.OXY_PUBLIC_KEY }}
          SYNC_OXY_PRIVATE_KEY: ${{ secrets.OXY_PRIVATE_KEY }}
          SYNC_LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          SYNC_LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SYNC_KAANA_EDGE_SIGNING_PRIVATE_KEY: ${{ secrets.KAANA_EDGE_SIGNING_PRIVATE_KEY }}
          SYNC_CAPABILITY_TICKET_SIGNING_PRIVATE_KEY: ${{ secrets.CAPABILITY_TICKET_SIGNING_PRIVATE_KEY }}
          SYNC_CAPABILITY_TICKET_SIGNING_KEY_ID: ${{ secrets.CAPABILITY_TICKET_SIGNING_KEY_ID }}
        run: |
          # Only sync secrets that the oxy-api ECS task is expected to consume.
          # Do not iterate over the entire GitHub secrets context: this repository also contains
          # credentials for other systems (Cloudflare, legacy droplet deploys,
          # etc.) that must not be copied into the API's SSM namespace.
          SHARED_SECRETS="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET"
          API_SECRETS="ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET SSO_INTERNAL_SECRET DATABASE_URL AWS_S3_BUCKET AWS_ENDPOINT_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET GITHUB_CLIENT_SECRET SMTP_TLS_KEY SMTP_TLS_CERT SMTP_RELAY_USER SMTP_RELAY_PASS EMAIL_INBOUND_WEBHOOK_SECRET DKIM_PRIVATE_KEY EMAIL_S3_ACCESS_KEY_ID EMAIL_S3_SECRET_ACCESS_KEY DEVICE_ID_SALT OXY_PUBLIC_KEY OXY_PRIVATE_KEY KAANA_EDGE_SIGNING_PRIVATE_KEY CAPABILITY_TICKET_SIGNING_PRIVATE_KEY CAPABILITY_TICKET_SIGNING_KEY_ID"

          for k in $SHARED_SECRETS $API_SECRETS; do
            v=$(printenv "SYNC_$k" || true)
            # Defence in depth: a secret left as an empty string or a single
            # dash placeholder is almost always a mistake (forgot to set a
            # value, or scripted with `gh secret set REDIS_URL --body '-'`).
            # Skipping the sync preserves the previous SSM value rather than
            # nuking production with garbage — exactly the failure mode that
            # took the API down in the 2026-06-12 incident.
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k (value=${v:-<empty>}); SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && [ "$AWS_REGION" = "us-west-2" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED_SECRETS " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            printf '%s' "$v" | bash .github/scripts/put-secure-parameter.sh "$path" overwrite
            echo "synced -> $path"
          done

      - name: Verify Inbox service credential bindings
        run: |
          set -euo pipefail
          for parameter in OXY_APPLICATION_KEY OXY_APPLICATION_SECRET; do
            aws ssm get-parameter \
              --name "/oxy/inbox/$parameter" \
              --query 'Parameter.Name' \
              --output text >/dev/null
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # --metadata-file is the only addition to this build: the digest comes
          # out of the build itself. Resolving it afterwards with
          # `aws ecr describe-images` is not an option here: oxy-github-deploy
          # has no ecr:DescribeImages, confirmed with
          # `aws iam simulate-principal-policy` (implicitDeny), so that call
          # fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      # Whether this release contains a migration that must run AFTER the rollout.
      #
      # Answerable from the repository alone, which is the only reason it can be
      # answered here at all: pendingness needs the ledger, and the database is on
      # a private VPC address this runner cannot reach. But a `post` migration can
      # only be PENDING if it EXISTS, so "no post-phase marker anywhere in
      # drizzle/" is a sound reason to skip the second one-shot task, and today
      # that is every release — the common case pays nothing for this.
      #
      # The grep is exact rather than approximate because
      # `scripts/check-migration-phases.mjs` separately proves every migration
      # carries exactly one marker line in exactly this spelling, and asserts this
      # workflow greps for the pattern that module exports. Without that gate a
      # typo'd marker would read as "no post migration in this release" and the
      # drop would never be applied by anything.
      - name: Plan post-rollout reconciliation tasks
        id: post_deploy_tasks
        run: |
          set -euo pipefail
          if grep -lE '^-- oxy:deploy-phase=post$' packages/api/drizzle/*.sql; then
            tasks=$(jq -cn '[
              {
                label: "Post-deploy migration",
                command: ["node", "packages/api/dist/db/migrate.js", "--phase=post"]
              },
              {
                label: "Inbox catalog registration",
                command: ["bun", "run", "packages/api/scripts/register-inbox-capability-catalog.ts"]
              }
            ]')
            echo "This release carries post-rollout migrations."
          else
            tasks=$(jq -cn '[{
              label: "Inbox catalog registration",
              command: ["bun", "run", "packages/api/scripts/register-inbox-capability-catalog.ts"]
            }]')
            echo "No post-rollout migrations in this release."
          fi
          echo "tasks=$tasks" >>"$GITHUB_OUTPUT"

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          # Applies pending additive migrations on the NEW image, inside the VPC,
          # BEFORE the service update — so the schema a rollout needs is never
          # behind the image that reads it. This is the whole fix for the
          # 2026-08-02 outage: 0013_users_account_categories reached production
          # minutes after the code that selects the column it adds, because the
          # ordering lived in a human's head across two manual dispatches.
          #
          # Every deploy pays one one-shot task for this, whether anything is
          # pending or not. There is no sound way to skip it: pendingness needs the
          # ledger, and every cheaper proxy is a silent-skip machine. Concretely,
          # "skip when this push changed no migration file" would have skipped the
          # deploy AFTER the one that stranded 0013 and left production broken.
          RUN_MIGRATIONS: "true"
          POST_DEPLOY_TASKS_JSON: ${{ steps.post_deploy_tasks.outputs.tasks }}
          # Plain operational configuration, never provider credentials. The
          # Kaana hop is fully named here so an image deploy cannot silently
          # discard Terraform's task bindings; execution remains explicitly
          # disabled until the canary, signed probe and settlement gates pass.
          # A scorecard must also outlive at least the next hour before staff may
          # approve its route.
          TASK_ENV_OVERRIDES_JSON: >-
            {"INFERENCE_ROUTING_SCORE_MIN_VALIDITY_SECONDS":"3600","KAANA_BASE_URL":"https://kaana.ai","KAANA_EDGE_SIGNING_KEY_ID":"oxy-edge-2026-08-17","KAANA_CREDENTIAL_CONTROL_SIGNING_KEY_ID":"oxy-credential-control-2026-09","INBOX_INFERENCE_ROUTING_PROFILE_ID":"${{ vars.INBOX_INFERENCE_ROUTING_PROFILE_ID }}","INFERENCE_KAANA_EXECUTION":"disabled"}
          # Exact legacy inference bindings inherited from the previous task
          # definition. The deployer removes only these named entries; ordinary
          # SMTP/device uses of the word relay remain untouched.
          TASK_REMOVE_NAMES_JSON: >-
            ["RELAY_BASE_URL","RELAY_EDGE_SIGNING_KEY_ID","RELAY_EDGE_SIGNING_PRIVATE_KEY","ALIA_API_KEY","AI_LABELING_MODEL"]
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-inbox-mcp.sh
          # The deploy script renders from the task definition the service is
          # currently running, not from Terraform's latest registered revision.
          # Re-assert new bindings here so capability authority cannot disappear
          # on the following image rollout. The credential-control signing key is
          # provisioned directly in SSM; it is intentionally absent from every
          # GitHub-secret sync entry and allow-list above.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"CAPABILITY_TICKET_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/CAPABILITY_TICKET_SIGNING_PRIVATE_KEY","CAPABILITY_TICKET_SIGNING_KEY_ID":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/CAPABILITY_TICKET_SIGNING_KEY_ID","KAANA_EDGE_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/KAANA_EDGE_SIGNING_PRIVATE_KEY","KAANA_CREDENTIAL_CONTROL_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/KAANA_CREDENTIAL_CONTROL_SIGNING_PRIVATE_KEY","INBOX_APPLICATION_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/inbox/OXY_APPLICATION_KEY","INBOX_APPLICATION_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/inbox/OXY_APPLICATION_SECRET"}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi

          bash .github/scripts/deploy-ecs-image.sh
