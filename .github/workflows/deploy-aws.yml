# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute oxy-api (ecs service + ecr repo name) and Dockerfile (path).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - "packages/core/**"
      - "packages/contracts/**"
      - "packages/protocol/**"
      - "packages/federation/**"
      - "packages/db/**"
      - "Dockerfile"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-aws.yml"
      # The rollout logic now lives in a script. Without this, editing it
      # would change how every deploy behaves and trigger no deploy to
      # exercise the change.
      - ".github/scripts/deploy-ecs-image.sh"
      - ".github/scripts/deploy-asset-variant-worker.sh"
      - ".github/scripts/put-secure-parameter.sh"
      - ".github/scripts/smoke-inbox-mcp.sh"
      - ".github/scripts/smoke-oxy-api.sh"
      - ".github/scripts/smoke-service-token-jwks.sh"
      - ".github/scripts/resolve-queue-image.sh"
      - ".github/scripts/tag-ecr-image.sh"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  # resolve-queue-image.sh reads this commit's merge-queue image run.
  actions: read

concurrency:
  # Serialize production rollouts. Two overlapping runs each register a task
  # definition revision and then call update-service; interleaved, the older
  # image wins and the newer run still reports success. Never cancel in
  # progress: an interrupted run leaves an unmonitored rollout in ECS.
  group: deploy-oxy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: oxy-api
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  deploy:
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync API deployment secrets -> SSM (GitHub is the source of truth)
        # Synced secrets use a SYNC_ prefix so they never collide with the AWS
        # CLI's reserved credential env vars (AWS_ACCESS_KEY_ID /
        # AWS_SECRET_ACCESS_KEY / AWS_ENDPOINT_URL). secrets.AWS_ACCESS_KEY_ID is
        # an application object-storage key, not an AWS deploy credential;
        # exporting it under its raw name
        # shadows the OIDC role assumed above and makes `aws ssm put-parameter`
        # fail with UnrecognizedClientException.
        #
        # The `SYNC_*` env block below and the API_SECRETS list
        # in the script are TWO hand-maintained allowlists that have to agree —
        # and a name missing from either is silent: the loop simply never writes
        # that parameter, the deploy goes green, and the next task launch dies
        # with `ResourceInitializationError: unable to pull secrets`. CI job
        # "Deploy Secrets Sync" (scripts/check-deploy-secrets-sync.mjs) fails the
        # build on that mismatch and on any env var this API requires at boot
        # that no list carries. Edit the lists only alongside that gate.
        env:
          SYNC_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SYNC_REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SYNC_SSO_INTERNAL_SECRET: ${{ secrets.SSO_INTERNAL_SECRET }}
          SYNC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          SYNC_AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          SYNC_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SYNC_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SYNC_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          SYNC_SMTP_TLS_KEY: ${{ secrets.SMTP_TLS_KEY }}
          SYNC_SMTP_TLS_CERT: ${{ secrets.SMTP_TLS_CERT }}
          SYNC_SMTP_RELAY_USER: ${{ secrets.SMTP_RELAY_USER }}
          SYNC_SMTP_RELAY_PASS: ${{ secrets.SMTP_RELAY_PASS }}
          SYNC_EMAIL_INBOUND_WEBHOOK_SECRET: ${{ secrets.EMAIL_INBOUND_WEBHOOK_SECRET }}
          SYNC_DKIM_PRIVATE_KEY: ${{ secrets.DKIM_PRIVATE_KEY }}
          SYNC_EMAIL_S3_ACCESS_KEY_ID: ${{ secrets.EMAIL_S3_ACCESS_KEY_ID }}
          SYNC_EMAIL_S3_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_S3_SECRET_ACCESS_KEY }}
          SYNC_DEVICE_ID_SALT: ${{ secrets.DEVICE_ID_SALT }}
          SYNC_OXY_PUBLIC_KEY: ${{ secrets.OXY_PUBLIC_KEY }}
          SYNC_OXY_PRIVATE_KEY: ${{ secrets.OXY_PRIVATE_KEY }}
          SYNC_KAANA_EDGE_SIGNING_PRIVATE_KEY: ${{ secrets.KAANA_EDGE_SIGNING_PRIVATE_KEY }}
          SYNC_CAPABILITY_TICKET_SIGNING_PRIVATE_KEY: ${{ secrets.CAPABILITY_TICKET_SIGNING_PRIVATE_KEY }}
          SYNC_CAPABILITY_TICKET_SIGNING_KEY_ID: ${{ secrets.CAPABILITY_TICKET_SIGNING_KEY_ID }}
          # Instagram Graph (Business Discovery) fallback. Both are BOUND into the
          # oxy-api task definition (TASK_SECRET_OVERRIDES_JSON below), so they are
          # in BOUND_API_SECRETS too: an empty value fails this step instead of
          # being skipped.
          SYNC_META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN }}
          SYNC_META_IG_BUSINESS_ACCOUNT_ID: ${{ secrets.META_IG_BUSINESS_ACCOUNT_ID }}
        run: |
          # Only sync secrets that the oxy-api ECS task is expected to consume.
          # Do not iterate over the entire GitHub secrets context: this repository also contains
          # credentials for other systems (Cloudflare, unrelated deployments,
          # etc.) that must not be copied into the API's SSM namespace.
          #
          # Nothing here writes /oxy/_shared/*. Shared parameters
          # (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, REDIS_URL, QUEUE_REDIS_URL,
          # LIVEKIT_API_KEY, LIVEKIT_API_SECRET) are owned by oxy-infra, not by
          # any app, and are rotated once, centrally
          # (oxy-infra docs/runbooks/45-shared-ssm-parameters.md). When several
          # app deploys each copied their own GitHub secret into
          # /oxy/_shared/REDIS_URL, two held different values and every deploy
          # flipped it between Redis clusters (incident 2026-09-27). The task
          # definition still READS the shared parameters; only the write is
          # gone, and scripts/check-deploy-secrets-sync.mjs refuses its return.
          API_SECRETS="ACCESS_TOKEN_SECRET REFRESH_TOKEN_SECRET SSO_INTERNAL_SECRET DATABASE_URL AWS_S3_BUCKET AWS_ENDPOINT_URL STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET GITHUB_CLIENT_SECRET SMTP_TLS_KEY SMTP_TLS_CERT SMTP_RELAY_USER SMTP_RELAY_PASS EMAIL_INBOUND_WEBHOOK_SECRET DKIM_PRIVATE_KEY EMAIL_S3_ACCESS_KEY_ID EMAIL_S3_SECRET_ACCESS_KEY DEVICE_ID_SALT OXY_PUBLIC_KEY OXY_PRIVATE_KEY KAANA_EDGE_SIGNING_PRIVATE_KEY CAPABILITY_TICKET_SIGNING_PRIVATE_KEY CAPABILITY_TICKET_SIGNING_KEY_ID META_GRAPH_ACCESS_TOKEN META_IG_BUSINESS_ACCOUNT_ID"

          # Secrets the task definition BINDS by exact ARN (TASK_SECRET_OVERRIDES_JSON
          # in the deploy step) whose parameter only this sync ever creates. A task
          # definition naming a parameter that does not exist registers fine and
          # then cannot START (`ResourceInitializationError: unable to pull
          # secrets`), and at desired count 0 nobody sees it until scale-up. So a
          # missing value here is not skipped with a warning like the rest: it
          # fails the job HERE, before any SSM write, image rollout or
          # task-definition registration. A value present here is written by the
          # loop below in this same run, so by the time the deploy step registers
          # a revision naming it, the parameter exists.
          # scripts/check-deploy-secrets-sync.mjs holds each name to both lists.
          BOUND_API_SECRETS="META_GRAPH_ACCESS_TOKEN META_IG_BUSINESS_ACCOUNT_ID"
          for k in $BOUND_API_SECRETS; do
            v=$(printenv "SYNC_$k" || true)
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::error::secrets.$k is empty or a placeholder, but the oxy-api task definition binds /oxy/$APP/$k. Set the real value (never a placeholder) and re-run; nothing was synced or registered."
              exit 1
            fi
          done

          for k in $API_SECRETS; do
            v=$(printenv "SYNC_$k" || true)
            # Defence in depth: a secret left as an empty string or a single
            # dash placeholder is almost always a mistake (forgot to set a
            # value, or scripted with `gh secret set REDIS_URL --body '-'`).
            # Skipping the sync preserves the previous SSM value rather than
            # nuking production with garbage — exactly the failure mode that
            # took the API down in the 2026-06-12 incident.
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k (value=${v:-<empty>}); SSM unchanged"
              continue
            fi
            path="/oxy/$APP/$k"
            printf '%s' "$v" | bash .github/scripts/put-secure-parameter.sh "$path" overwrite
            echo "synced -> $path"
          done

      - name: Verify Inbox service credential bindings
        run: |
          set -euo pipefail
          for parameter in OXY_APPLICATION_KEY OXY_APPLICATION_SECRET; do
            aws ssm get-parameter \
              --name "/oxy/inbox/$parameter" \
              --query 'Parameter.Name' \
              --output text >/dev/null
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The merge queue already built this commit's image (merge-queue-image.yml
      # pushes `oxy/oxy-api:mq-<sha>` in parallel with CI, and the queue's
      # tested commit IS this push's commit). Reuse it by digest when the
      # queue run for exactly this SHA succeeded; wait for that run if it is
      # still going. Anything else — a manual dispatch, a failed or skipped
      # queue build, an API error — comes back empty and the build below runs
      # exactly as before. The script's header has the full contract.
      - name: Find the image the merge queue built
        id: queue_image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: oxy/${{ env.APP }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/resolve-queue-image.sh

      - name: Set up Docker Buildx
        if: steps.queue_image.outputs.digest == ''
        uses: docker/setup-buildx-action@v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps. Without them buildx skips the cache without a word: this
      # workflow's builds show zero CACHED layers and the repository holds no
      # buildkit cache entry at all (`gh cache list`, 2026-09-29), while Clarity,
      # which builds through docker/build-push-action, reuses 22 layers per build.
      - name: Expose the Actions cache to buildx
        if: steps.queue_image.outputs.digest == ''
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and push (linux/arm64)
        id: build
        if: steps.queue_image.outputs.digest == ''
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # --metadata-file: the digest comes out of the build itself.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      # One digest from here on, whichever step produced it, and the tags that
      # say it is released:
      #   `<sha>`           the commit tag, as every release has always had;
      #   `latest`          still moved, but nothing that deploys reads it. It
      #                     exists so a from-scratch `terraform apply` -- whose
      #                     app-service module declares `<repo>:latest` as the
      #                     task definition's bootstrap image -- creates the
      #                     service on a current build rather than an ancient one;
      #   `deployed-<sha>`  what the ECR lifecycle policy keeps (the last ten):
      #                     the running image and its rollback targets. A queue
      #                     image without it expires three days after its push.
      # A re-tag by digest (tag-ecr-image.sh), never a push: ECR refuses the
      # write unless the manifest still hashes to this digest.
      - name: Release the image
        id: image
        env:
          QUEUE_DIGEST: ${{ steps.queue_image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          DIGEST="${QUEUE_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest to release (queue: ${QUEUE_DIGEST:-<none>}, build: ${BUILT_DIGEST:-<none>})"
            exit 1
          fi
          bash .github/scripts/tag-ecr-image.sh "oxy/$APP" "$DIGEST" "$GITHUB_SHA" "deployed-$GITHUB_SHA" latest
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Releasing oxy/$APP@$DIGEST ($([[ -n "$QUEUE_DIGEST" ]] && echo 'built in the merge queue' || echo 'built here'))" | tee -a "$GITHUB_STEP_SUMMARY"

      # Whether this release contains a migration that must run AFTER the rollout.
      #
      # Answerable from the repository alone, which is the only reason it can be
      # answered here at all: pendingness needs the ledger, and the database is on
      # a private VPC address this runner cannot reach. But a `post` migration can
      # only be PENDING if it EXISTS, so "no post-phase marker anywhere in
      # drizzle/" is a sound reason to skip the post-migration one-shot task.
      # (Since 0047 there always is one, so in practice the task always runs —
      # which is why it runs CONCURRENTLY with the catalog registration below.)
      #
      # The two tasks are independent: the migration applies `post` DDL (drops
      # the NEW image no longer reads), and the registration is one HTTP POST
      # of Inbox's capability catalog to api.oxy.so, served by the new image.
      # Neither reads what the other writes, and a DROP's ACCESS EXCLUSIVE lock
      # only queues a concurrent statement on that one table for its duration.
      # Each one-shot is ~80s, ~60s of it Fargate provisioning (run
      # 36505794567: 01:24:19 -> 01:25:39 and 01:25:41 -> 01:27:01), so running
      # them side by side saves one of those.
      #
      # The grep is exact rather than approximate because
      # `scripts/check-migration-phases.mjs` separately proves every migration
      # carries exactly one marker line in exactly this spelling, and asserts this
      # workflow greps for the pattern that module exports. Without that gate a
      # typo'd marker would read as "no post migration in this release" and the
      # drop would never be applied by anything.
      - name: Plan post-rollout reconciliation tasks
        id: post_deploy_tasks
        run: |
          set -euo pipefail
          if grep -lE '^-- oxy:deploy-phase=post$' packages/api/drizzle/*.sql; then
            tasks=$(jq -cn '[
              {
                label: "Post-deploy migration",
                command: ["node", "packages/api/dist/db/migrate.js", "--phase=post"]
              },
              {
                label: "Inbox catalog registration",
                command: ["bun", "run", "packages/api/scripts/register-inbox-capability-catalog.ts"]
              }
            ]')
            echo "This release carries post-rollout migrations."
          else
            tasks=$(jq -cn '[{
              label: "Inbox catalog registration",
              command: ["bun", "run", "packages/api/scripts/register-inbox-capability-catalog.ts"]
            }]')
            echo "No post-rollout migrations in this release."
          fi
          echo "tasks=$tasks" >>"$GITHUB_OUTPUT"

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.image.outputs.digest }}
          # Applies pending additive migrations on the NEW image, inside the VPC,
          # BEFORE the service update — so the schema a rollout needs is never
          # behind the image that reads it. This is the whole fix for the
          # 2026-08-02 outage: 0013_users_account_categories reached production
          # minutes after the code that selects the column it adds, because the
          # ordering lived in a human's head across two manual dispatches.
          #
          # Every deploy pays one one-shot task for this, whether anything is
          # pending or not. There is no sound way to skip it: pendingness needs the
          # ledger, and every cheaper proxy is a silent-skip machine. Concretely,
          # "skip when this push changed no migration file" would have skipped the
          # deploy AFTER the one that stranded 0013 and left production broken.
          RUN_MIGRATIONS: "true"
          POST_DEPLOY_TASKS_JSON: ${{ steps.post_deploy_tasks.outputs.tasks }}
          # See the "Plan post-rollout reconciliation tasks" step for why these
          # two tasks may overlap.
          POST_DEPLOY_TASKS_CONCURRENT: "true"
          # The asset-variant worker (the queue's consumer) moves after the
          # pre-deploy migration and BEFORE the API (its producer): the script
          # returns once every new consumer runs and ECS has scaled the old
          # ones to zero. The old consumers' shutdown and ECS's COMPLETED tail
          # (~2.5 min measured) now overlap the API rollout instead of following
          # it; "Confirm the asset-variant worker rollout" below still requires
          # the exact steady state.
          PRE_ROLLOUT_SCRIPT: .github/scripts/deploy-asset-variant-worker.sh
          WORKER_ROLLOUT_PHASE: start
          # Replace both oxy-api tasks in ONE wave. The one-extra-task default
          # exists because on 2026-09-08 the account's Fargate vCPU quota was 30
          # with ~27.5 in use; the quota is now 100 (service-quotas L-3032A538)
          # and the whole account ran 27.5 vCPU on 2026-09-29. Worst case at
          # oxy-api's autoscaling ceiling of 6 x 1 vCPU is +6, plus +4 for the
          # worker's 200% rollout and +2 for the concurrent one-shots: ~40 of
          # 100. At desired=2 the serial rollout took 416s (run 36505794567:
          # two waves of start, 2 x 30s health checks and a 60s drain).
          ROLLOUT_MAX_PERCENT: "200"
          # Poll ECS every 5 s, not the script's default 15 s. Every wait in this
          # step (pre-migration, worker consumers, API rollout, post tasks) ends
          # on a poll, so each one overshot what it waited for by up to 15 s:
          # the API rollout completed at 12:58:19 and was seen at 12:58:30 (run
          # 36716875305). The wait budgets are in seconds, so they are unchanged.
          POLL_INTERVAL: "5"
          # Plain operational configuration, never provider credentials. The
          # Kaana hop is fully named here so an image deploy cannot silently
          # discard Terraform's task bindings. Kaana is the canonical signed
          # execution path after the reviewed cutover.
          # A scorecard must also outlive at least the next hour before staff may
          # approve its route.
          # The Instagram Graph fallback's flag and API version are repository
          # variables: unset renders "", which the API reads as off / v23.0.
          # CDN_CLOUDFRONT_DISTRIBUTION_ID (cloud.oxy.so, EJGHFASAD3H1W) turns on
          # CloudFront invalidation of deleted public objects. Also a repository
          # variable: unset renders "", which the API reads as off (one warning),
          # so this can merge before oxy-infra grants cloudfront:CreateInvalidation.
          TASK_ENV_OVERRIDES_JSON: >-
            {"INFERENCE_ROUTING_SCORE_MIN_VALIDITY_SECONDS":"3600","KAANA_BASE_URL":"https://kaana.ai","KAANA_EDGE_SIGNING_KEY_ID":"oxy-edge-2026-08-17","KAANA_CREDENTIAL_CONTROL_SIGNING_KEY_ID":"oxy-credential-control-2026-09","CDN_CLOUDFRONT_DISTRIBUTION_ID":"${{ vars.CDN_CLOUDFRONT_DISTRIBUTION_ID }}","OTEL_SERVICE_NAME":"oxy-api","OTEL_EXPORTER_OTLP_ENDPOINT":"http://127.0.0.1:4318","OTEL_EXPORTER_OTLP_PROTOCOL":"http/protobuf","OTEL_RESOURCE_ATTRIBUTES":"deployment.environment.name=production,service.namespace=oxy"}
          # Re-assert the Terraform-declared ADOT sidecar because releases are
          # rendered from the currently-running task revision.
          TASK_EXTRA_CONTAINERS_JSON: >-
            [{"name":"aws-otel-collector","image":"public.ecr.aws/aws-observability/aws-otel-collector:v0.49.0","essential":false,"cpu":128,"memoryReservation":256,"command":["--config=/etc/ecs/ecs-default-config.yaml"],"healthCheck":{"command":["CMD","/healthcheck"],"interval":30,"timeout":5,"retries":3,"startPeriod":10},"logConfiguration":{"logDriver":"awslogs","options":{"awslogs-group":"/oxy/ecs","awslogs-region":"us-west-2","awslogs-stream-prefix":"oxy-api-otel"}}}]
          # Exact legacy bindings inherited from previous task definitions. The
          # deployer removes only these named entries; ordinary SMTP/device uses
          # of the word relay remain untouched. The two Instagram Graph names are
          # the retired fallback switch and version knob (#1253): the fallback now
          # runs whenever its credentials are bound and pins its version in code.
          TASK_REMOVE_NAMES_JSON: >-
            ["RELAY_BASE_URL","RELAY_EDGE_SIGNING_KEY_ID","RELAY_EDGE_SIGNING_PRIVATE_KEY","ALIA_API_KEY","AI_LABELING_MODEL","INSTAGRAM_GRAPH_FALLBACK_ENABLED","META_GRAPH_API_VERSION"]
          # The service-token JWKS (ADR 0012), then the Inbox MCP checks.
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-oxy-api.sh
          # The deploy script renders from the task definition the service is
          # currently running, not from Terraform's latest registered revision.
          # Re-assert new bindings here so capability authority cannot disappear
          # on the following image rollout. The credential-control signing key is
          # provisioned directly in SSM; it is intentionally absent from every
          # GitHub-secret sync entry and allow-list above. So is the Ed25519
          # service-token signing key (ADR 0012): SERVICE_TOKEN_PRIVATE_KEY and
          # SERVICE_TOKEN_SIGNING_KEY_ID live only in SSM, and binding them makes
          # oxy-api mint EdDSA service tokens and publish the key at
          # /.well-known/jwks.json for external verifiers (Alia, Homiio, …).
          # META_GRAPH_ACCESS_TOKEN / META_IG_BUSINESS_ACCOUNT_ID are the Instagram
          # Graph fallback's credentials. Unlike the SSM-only keys above they are
          # GitHub secrets, synced by the first step; BOUND_API_SECRETS there
          # refuses the whole run when either is unset, so this binding can never
          # name a parameter that does not exist. With both bound, the fallback
          # runs; there is no separate switch.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"SERVICE_TOKEN_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/SERVICE_TOKEN_PRIVATE_KEY","SERVICE_TOKEN_SIGNING_KEY_ID":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/SERVICE_TOKEN_SIGNING_KEY_ID","CAPABILITY_TICKET_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/CAPABILITY_TICKET_SIGNING_PRIVATE_KEY","CAPABILITY_TICKET_SIGNING_KEY_ID":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/CAPABILITY_TICKET_SIGNING_KEY_ID","KAANA_EDGE_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/KAANA_EDGE_SIGNING_PRIVATE_KEY","KAANA_CREDENTIAL_CONTROL_SIGNING_PRIVATE_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/KAANA_CREDENTIAL_CONTROL_SIGNING_PRIVATE_KEY","INBOX_APPLICATION_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/inbox/OXY_APPLICATION_KEY","INBOX_APPLICATION_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/inbox/OXY_APPLICATION_SECRET","QUEUE_REDIS_URL":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/_shared/QUEUE_REDIS_URL","META_GRAPH_ACCESS_TOKEN":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/META_GRAPH_ACCESS_TOKEN","META_IG_BUSINESS_ACCOUNT_ID":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/oxy-api/META_IG_BUSINESS_ACCOUNT_ID"}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi

          bash .github/scripts/deploy-ecs-image.sh

      # The worker's rollout started inside the step above (PRE_ROLLOUT_SCRIPT).
      # This requires its exact steady state on this build's image: one
      # COMPLETED deployment, every autoscaled task running.
      #
      # There used to be a one-time "asset queue cutover" path here: detect a
      # worker without QUEUE_REDIS_URL, deploy the API first, run a "Legacy
      # asset queue drain gate" task, then roll the worker. The cutover finished
      # on 2026-09-12 (every worker revision from oxy-oxy-asset-variant-worker:10
      # binds QUEUE_REDIS_URL, :169 included), but the detector's query
      # `containerDefinitions[?...].secrets[?name==...] | length(@)` evaluates
      # to 0 even when the binding exists, so every deploy since took the
      # one-time path: +128s drain gate, +370s serial worker rollout. The gate's
      # own logs showed the legacy queue empty on its first check (waiting=0,
      # active=0, delayed=0, 2026-09-29T01:27Z), and nothing produces to it:
      # every producer and consumer of `asset-variants` connects through
      # getAssetVariantQueueConnectionOptions (QUEUE_REDIS_URL).
      - name: Confirm the asset-variant worker rollout
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.image.outputs.digest }}
        run: bash .github/scripts/deploy-asset-variant-worker.sh wait
