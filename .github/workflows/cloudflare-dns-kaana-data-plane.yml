# The DNS `kaana.oxy.so` needs, in the oxy.so zone.
#
# WHY THIS LIVES IN A PUBLIC REPOSITORY AND NOT IN oxy-infra, WHERE IT BELONGS.
# The OxyHQ org is on the GitHub Free plan, where an organisation Actions
# secret cannot reach a PRIVATE repository — it arrives as an empty string
# with no error. oxy-infra is private, so the identical workflow there read
# CLOUDFLARE_API_TOKEN as "" and exited. Measured, not assumed: the run failed
# on `CLOUDFLARE_API_TOKEN is empty` while `gh secret list --org OxyHQ` shows
# the secret present with visibility ALL. Both local token files are dead
# (documented 2026-08-08, both answer 9109), so the org secret is the only
# working credential and a public repository is the only place it resolves.
#
# Move this back to oxy-infra the day that repo can read the secret — either a
# paid plan or a repository-level copy of the token.
#
# Two records, and they are not the same kind of thing:
#
#   - the ACM validation CNAME, which MUST be DNS-only. Cloudflare's proxy
#     answers with its own addresses, so a proxied validation record breaks
#     issuance outright. This is the same reason the Allo Matrix workflow
#     states beside its four.
#   - `kaana.oxy.so` itself, pointing at Kaana's OWN load balancer — not the
#     shared one. Kaana has a dedicated ALB because its listener carries only
#     its certificate and its idle timeout is chosen for streaming.
#
# `check` reads and writes nothing, and is also how you find out whether the
# token can edit this zone at all: CLOUDFLARE_API_TOKEN is shared with the
# Pages deployments and may be scoped to them.
name: Cloudflare DNS (Kaana)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check reads only. apply reconciles DNS and the Kaana rate limit.'
        type: choice
        options: [check, apply]
        default: check
        required: true
      validation_name:
        description: 'ACM validation CNAME name (from describe-certificate).'
        type: string
        required: false
      validation_value:
        description: 'ACM validation CNAME value.'
        type: string
        required: false
      alb_dns:
        description: "Kaana ALB DNS name. Empty skips the kaana.oxy.so record."
        type: string
        required: false

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          VAL_NAME: ${{ inputs.validation_name }}
          VAL_VALUE: ${{ inputs.validation_value }}
          ALB_DNS: ${{ inputs.alb_dns }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          # A secret pasted with a trailing newline produces code 6111, which
          # reads like a scope problem and is not one.
          TOKEN = os.environ["CF_TOKEN"].strip()
          if not TOKEN:
              sys.exit("CLOUDFLARE_API_TOKEN is empty")
          # Length only. The Allo workflow this is modelled on prints the
          # first four characters, which is harmless in a private repository
          # and is not here: this file lives in a PUBLIC repo, so its Actions
          # logs are world-readable and a prefix of a live token is a real if
          # small disclosure. The length alone still separates "empty secret"
          # from "wrong secret", which is the only thing this line was for.
          print(f"token: {len(TOKEN)} chars")
          APPLY = os.environ["ACTION"] == "apply"
          ZONE_NAME = "oxy.so"

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4{path}",
                  method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      payload = json.load(r)
                      payload["_http_status"] = r.status
                      return payload
              except urllib.error.HTTPError as e:
                  payload = json.load(e)
                  payload["_http_status"] = e.code
                  return payload

          z = call("GET", f"/zones?name={ZONE_NAME}")
          if not z.get("success") or not z["result"]:
              sys.exit(f"cannot read zone {ZONE_NAME}: {z.get('errors')}")
          zid = z["result"][0]["id"]
          print(f"zone {ZONE_NAME} -> {zid}")

          wanted = []
          if os.environ.get("VAL_NAME") and os.environ.get("VAL_VALUE"):
              wanted.append((os.environ["VAL_NAME"].rstrip("."),
                             os.environ["VAL_VALUE"].rstrip("."), False))
          if os.environ.get("ALB_DNS"):
              # PROXIED, deliberately, and this is the one record here that is.
              #
              # Kaana verifies an Ed25519 signature only AFTER reading the whole
              # body — up to 16 MiB — so by the time it can refuse, it has
              # already paid the memory and the bandwidth. A rate limit inside
              # Kaana arrives too late by construction, which makes Cloudflare
              # the only place one can work at all. DNS-only here resolves fine,
              # terminates TLS at the ALB and looks entirely correct while
              # silently having no rate limit, no DDoS absorption and a public
              # ALB hostname.
              #
              # The cost is real and was accepted with its trigger written down:
              # the proxy abandons a request whose origin has not responded in
              # 125s below Enterprise. Kaana serves Cerebras, which sells fast
              # inference, so that ceiling does not bite today. BEFORE ADDING A
              # PROVIDER WITH A LONG TIME-TO-FIRST-TOKEN THIS IS DECIDED AGAIN.
              #
              # Requires the zone's SSL mode to be Full (strict): the ALB holds
              # a real certificate for this name, and Flexible would re-originate
              # in the clear.
              wanted.append(("kaana.oxy.so", os.environ["ALB_DNS"].rstrip("."), True))
          failed = False
          for name, value, proxied in wanted:
              got = call("GET", f"/zones/{zid}/dns_records?name={name}")
              existing = got.get("result") or []
              if existing:
                  cur = existing[0]
                  content_matches = cur["content"].rstrip(".") == value
                  proxy_matches = cur.get("proxied") is proxied
                  if len(existing) == 1 and content_matches and proxy_matches:
                      print(f"OK      {name} already correct")
                  elif not APPLY:
                      print(
                          f"DRIFT   {name} is content={cur['content']!r} "
                          f"proxied={cur.get('proxied')!r}, wanted "
                          f"content={value!r} proxied={proxied!r}"
                      )
                      failed = True
                  elif len(existing) != 1:
                      print(f"FAILED  {name}: found {len(existing)} records; refusing an ambiguous update")
                      failed = True
                  else:
                      res = call(
                          "PATCH",
                          f"/zones/{zid}/dns_records/{cur['id']}",
                          {"type": "CNAME", "name": name, "content": value,
                           "ttl": 120, "proxied": proxied},
                      )
                      if res.get("success"):
                          print(f"UPDATED {name} -> {value} proxied={proxied}")
                      else:
                          print(f"FAILED  {name}: {res.get('errors')}")
                          failed = True
                  continue
              if not APPLY:
                  print(f"MISSING {name} -> {value} (check only)")
                  continue
              res = call("POST", f"/zones/{zid}/dns_records",
                         {"type": "CNAME", "name": name, "content": value,
                          "ttl": 120, "proxied": proxied})
              if res.get("success"):
                  print(f"CREATED {name} -> {value}")
              else:
                  print(f"FAILED  {name}: {res.get('errors')}")
                  failed = True

          # Read every record back, so a silent no-op cannot pass as success.
          print("--- read-back ---")
          for name, value, proxied in wanted:
              got = call("GET", f"/zones/{zid}/dns_records?name={name}")
              rows = got.get("result") or []
              observed = [
                  {"content": row["content"].rstrip("."),
                   "proxied": row.get("proxied")}
                  for row in rows
              ]
              print(f"{name}: {observed or 'ABSENT'}")
              exact = (
                  len(rows) == 1
                  and rows[0]["content"].rstrip(".") == value
                  and rows[0].get("proxied") is proxied
              )
              if APPLY and not exact:
                  print(
                      f"FAILED  {name} read-back does not equal "
                      f"content={value!r} proxied={proxied!r}"
                  )
                  failed = True

          # The origin only admits Cloudflare IPs, and this rule is the matching
          # application-layer bound. Oxy's own edge reaches the ALB through the
          # split-horizon VPC record, so this public rule cannot throttle normal
          # platform traffic. On Cloudflare Free the only supported counting
          # period is 10 seconds and the counter is per source IP; 30 requests in
          # that window leaves room for diagnostics while bounding repeated
          # maximum-body reads from one source.
          rate_ref = "kaana-signed-envelope-rate-limit-v1"
          rate_rule = {
              "ref": rate_ref,
              "description": "Kaana signed inference envelope per-IP limit",
              "expression": '(http.request.uri.path eq "/internal/v1/inference")',
              "action": "block",
              "ratelimit": {
                  "characteristics": ["cf.colo.id", "ip.src"],
                  "period": 10,
                  "requests_per_period": 30,
                  "mitigation_timeout": 10,
                  "requests_to_origin": False,
              },
              "enabled": True,
          }

          def rate_rule_matches(rule):
              return (
                  all(
                      rule.get(key) == rate_rule[key]
                      for key in ("ref", "description", "expression", "action", "enabled")
                  )
                  and rule.get("ratelimit") == rate_rule["ratelimit"]
              )

          entry = call("GET", f"/zones/{zid}/rulesets/phases/http_ratelimit/entrypoint")
          entry_exists = entry.get("success") and isinstance(entry.get("result"), dict)
          rules = entry.get("result", {}).get("rules", []) if entry_exists else []
          current = next((rule for rule in rules if rule.get("ref") == rate_ref), None)

          if current is None:
              print("MISSING Kaana signed-envelope rate limit")
              if APPLY:
                  if entry_exists:
                      result = call(
                          "POST",
                          f"/zones/{zid}/rulesets/{entry['result']['id']}/rules",
                          rate_rule,
                      )
                  else:
                      result = call(
                          "POST",
                          f"/zones/{zid}/rulesets",
                          {
                              "name": "Zone rate limiting",
                              "description": "Zone-level rate limiting entry point",
                              "kind": "zone",
                              "phase": "http_ratelimit",
                              "rules": [rate_rule],
                          },
                      )
                  if not result.get("success"):
                      print(f"FAILED rate limit create: {result.get('errors')}")
                      failed = True
                  else:
                      print("CREATED Kaana signed-envelope rate limit")
          else:
              comparable = {
                  key: current.get(key)
                  for key in ("ref", "description", "expression", "action", "ratelimit", "enabled")
              }
              rate_matches = rate_rule_matches(current)
              if rate_matches:
                  print("OK      Kaana signed-envelope rate limit already correct")
              elif not APPLY:
                  print(f"DRIFT   Kaana rate limit is {comparable!r}")
                  failed = True
              else:
                  result = call(
                      "PUT",
                      f"/zones/{zid}/rulesets/{entry['result']['id']}/rules/{current['id']}",
                      rate_rule,
                  )
                  if not result.get("success"):
                      print(f"FAILED rate limit update: {result.get('errors')}")
                      failed = True
                  else:
                      print("UPDATED Kaana signed-envelope rate limit")

          verify = call("GET", f"/zones/{zid}/rulesets/phases/http_ratelimit/entrypoint")
          verified_rules = verify.get("result", {}).get("rules", []) if verify.get("success") else []
          verified = next((rule for rule in verified_rules if rule.get("ref") == rate_ref), None)
          print(f"rate limit read-back: {verified or 'ABSENT'}")
          verified_matches = verified is not None and rate_rule_matches(verified)
          if verified_matches:
              print("OK      Kaana signed-envelope rate limit read-back is exact")
          elif verified is not None:
              print(
                  "DRIFT   Kaana rate limit read-back does not match its exact "
                  "expression, action and ratelimit"
              )
              failed = True
          if APPLY and not verified_matches:
              failed = True

          sys.exit(1 if failed else 0)
          PY
