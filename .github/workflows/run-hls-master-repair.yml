name: Repair stored HLS master playlists

# Runs `packages/api/src/scripts/rewrite-hls-master-playlists.ts` against
# production.
#
# WHY THIS EXISTS AS A WORKFLOW RATHER THAN A COMMAND SOMEBODY TYPES:
# `file_variants` and the S3 objects live behind the VPC, so the repair has to
# run as an ECS task inside it ("Fargate one-shot", the shape
# `seed-oxy-applications.yml` and `run-postgres-migrations.yml` already use).
# It reuses the LIVE service's task definition — same secrets, role, subnets and
# security groups — and overrides only the command, so nothing about the running
# API is touched and nothing drifts when it is redeployed.
#
# WHAT IT REPAIRS: `generateMasterPlaylist` listed each rendition by its S3
# STORAGE KEY, and a master's URIs resolve against the MASTER's own URL
# (RFC 8216 §4.3.4.2) — so every ladder we ever produced points at a path that
# 403s. #1200 fixed the generator, which only helps ladders built afterwards;
# masters already in S3 are rewritten only when a variant set is rebuilt, and
# nothing triggers that on its own. This is the repair for what is stored.
#
# The pass is idempotent: a master whose URIs are already basenames is counted
# `alreadyCorrect` and left alone, so a second run is free and is also how you
# re-read the numbers.
#
# READ `empty` IN THE RESULT. A master with no URI lines at all is reported, not
# "fixed" — it is a ladder whose renditions never made it into the playlist, and
# its count is the number that decides whether the master-GENERATION race (a
# last rendition that fails leaves no usable master) needs its own fix. That
# question is open on purpose until this run answers it with a figure.
#
# ALWAYS run dry FIRST (the default). The dry pass writes nothing and prints the
# same five counters.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD be rewritten, write nothing'
        required: true
        type: boolean
        default: true
      batch_size:
        description: 'Rows scanned per batch (default 200)'
        required: false
        type: string

concurrency:
  # Two passes rewriting the same objects would race on the same S3 keys.
  group: hls-master-repair
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: oxy-api
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  DOCKERFILE: Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  repair:
    # This job receives production credentials. Only the protected main branch
    # may select the code that runs in the production VPC.
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Reject a batch size that is not a plain positive integer
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          if [ -n "${BATCH_SIZE// /}" ] && ! [[ "$BATCH_SIZE" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "::error::batch_size must be a positive integer (1-99999); got '$BATCH_SIZE'."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the repair image (its own tag; never `latest`)
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="hls-repair-$(git rev-parse --short HEAD)"
          IMG="$ECR_REGISTRY/oxy/$APP:$TAG"
          docker build -f "$DOCKERFILE" -t "$IMG" .
          docker push "$IMG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "Built $IMG"

      - name: Run the repair as an ECS one-shot task
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail

          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot even
          # pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # A throwaway revision differing from the live one ONLY by the image.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > repair-taskdef.json

          REPAIR_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://repair-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "repair task definition: $REPAIR_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            --arg batch "$BATCH_SIZE" \
            '{containerOverrides:[{
               name: $name,
               command: ["bun","run","packages/api/src/scripts/rewrite-hls-master-playlists.ts"],
               environment: ([{name:"DRY_RUN", value:$dry}] +
                 (if $batch != "" then [{name:"BATCH_SIZE", value:$batch}] else [] end))
             }]}')

          # The cluster runs at the edge of its Fargate on-demand vCPU quota, so a
          # one-shot competing with a rollout is refused outright (`RESOURCE:CPU`).
          # That is a queue, not a failure — `deploy-ecs-image.sh` waits it out for
          # its own one-shots, and an ops task nobody is watching needs it more.
          # Bounded: after START_MAX_WAIT_SECS the run fails loudly rather than
          # hanging on a quota that is not coming back.
          START_MAX_WAIT_SECS=600
          POLL_INTERVAL=20
          start_waited=0
          while :; do
            RUN_JSON=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$REPAIR_TASK_DEF" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
              --overrides "$OVERRIDES" \
              --started-by "gh-hls-repair")
            if [ "$(jq '.failures | length' <<<"$RUN_JSON")" = "0" ]; then
              break
            fi
            if ! jq -e '
              all(
                .failures[];
                (.reason // "") == "RESOURCE:CPU"
                or ((.reason // "") | ascii_downcase | contains("limit on the number of vcpus you can run concurrently"))
              )
            ' <<<"$RUN_JSON" >/dev/null; then
              echo "::error::ECS refused to start the repair task."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            if [ "$start_waited" -ge "$START_MAX_WAIT_SECS" ]; then
              echo "::error::Fargate vCPU capacity never freed up within ${START_MAX_WAIT_SECS}s."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            echo "::warning::Fargate vCPU capacity refused the repair task; retrying in ${POLL_INTERVAL}s."
            sleep "$POLL_INTERVAL"
            start_waited=$((start_waited + POLL_INTERVAL))
          done

          TASK_ARN=$(jq -r '.tasks[0].taskArn' <<<"$RUN_JSON")

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── repair output ────────"
          # The five counters (scanned / rewritten / alreadyCorrect / empty /
          # failed) are printed by the script. They are the answer this workflow
          # exists to produce, `empty` most of all.
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "───────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # 75 is the script's own "some masters could not be repaired" exit — a
          # partial pass is a red run, not a quiet success.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Repair task exited with $EXIT_CODE"
            exit 1
          fi
