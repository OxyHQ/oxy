# The end of a Seldon race (docs/engineering/build-and-deploy.md#ci-on-seldon):
# `finish` waits until every raced pair has a started lane, then `reap` queues
# one no-op job into each loser's concurrency group with cancel-in-progress,
# which cancels that lane alone (queued or sleeping in its guard) at queue
# time. Call it after the start, when it raced. The caller's `CI complete`
# must not need this job: the reapers' no-op only follows the cancellation.
name: Seldon race finish

on:
  workflow_call:
    inputs:
      interval:
        description: Seconds between polls of the jobs API.
        type: number
        default: 15
      deadline:
        description: Seconds after which a pair with no started lane keeps both lanes.
        type: number
        default: 3600
      names:
        description: The display names this race covers, one per line (X also covers a matrix's X (...)); empty covers every Seldon lane. Give each wave of raced jobs (some needing others) its own start and finish.
        type: string
        default: ''
      label:
        description: The runs-on label of the Seldon lanes.
        type: string
        default: seldon-ci

permissions:
  actions: read

jobs:
  finish:
    name: Seldon race finish
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      reap: ${{ steps.finish.outputs.reap }}
    steps:
      - id: finish
        uses: OxyHQ/oxy/.github/actions/seldon-race@907bba7c08eb81d0327446de3f08807e0305e769 # main
        with:
          mode: finish
          interval: ${{ inputs.interval }}
          deadline: ${{ inputs.deadline }}
          names: ${{ inputs.names }}
          label: ${{ inputs.label }}

  # On Seldon's light slots, not hosted: the loser is cancelled when this job
  # QUEUES into its concurrency group, not when it runs, so the reaper's runner
  # does not matter to the race, and a hosted slot (20 across the org) is not
  # spent on an echo. The light VMs are mostly idle, so it runs in seconds. If
  # Seldon is down it waits: the losers are already cancelled and the caller's
  # CI complete does not need this job, but the run stays in_progress until
  # Seldon is back and the reaper runs.
  reap:
    # "Seldon race " marks a control job, which the verdict never judges (race.mjs isControl).
    name: Seldon race reap ${{ matrix.group }}
    needs: finish
    if: needs.finish.outputs.reap != '' && needs.finish.outputs.reap != '[]'
    runs-on: seldon-ci-light
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: true
    strategy:
      matrix:
        group: ${{ fromJSON(needs.finish.outputs.reap) }}
    steps:
      - run: echo "Queued into the loser's group, which cancelled it."
