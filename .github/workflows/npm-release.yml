name: npm release

# THE release of every public npm package OxyHQ owns, called by each
# repository's own `.github/workflows/release-packages.yml` on every push to
# its default branch (OxyHQ/oxy calls it locally). A run releases whatever the
# pushed commit holds that the registry does not: every public package whose
# version is not on npm yet, dependencies first, from exactly that commit, with
# npm trusted publishing (OIDC) and provenance. A version bump merged to the
# default branch IS the release; there is no typed commit and no rehearsal. A
# caller's input-less `workflow_dispatch` runs the same release for the default
# branch's current head. There is no NPM_TOKEN anywhere. docs/engineering/package-rules.md#publishing.
#
# npm checks the trusted publisher against the CALLING workflow, so every
# package's trusted publisher on npmjs.com is: organization `OxyHQ`, its
# repository, workflow `release-packages.yml`, environment `npm`. The caller
# grants `actions: read`, `id-token: write` and `contents: write` on its
# calling job; only the plan job keeps the first, only the publish job the
# second and only the tag job the third.
#
#   plan     reads every package.json of the commit and asks the registry
#            which public versions are missing (`release-package.mjs plan`).
#            Nothing missing, nothing else runs: most pushes end here. Else it
#            waits for the caller's CI (`ci_workflow`) to have passed on this
#            exact commit, from the merge queue (`merge_group`) or a `push` run,
#            and fails closed when it did not, never ran, or GitHub cannot say.
#            The release does not test: CI already tested this very tree.
#   build    the commit's tree: frozen install, then ONE build of each package
#            released and of each workspace it links (its `build` script, with
#            whatever its `prebuild`/`postbuild` hooks check), then each
#            package's one tarball, packed without lifecycle scripts:
#            `bun pm pack --ignore-scripts`, which rewrites `workspace:`/
#            `catalog:` ranges, or the package's own `release:pack` when it
#            publishes a staged manifest it packs and tests itself.
#            `release-package.mjs inspect` checks each tarball. Uploads the
#            tarballs, their SHA-512 and the plan as the trusted bytes. No
#            credential of any kind, and no `id-token`.
#   publish  environment `npm`, `id-token: write`, and none of the
#            repository's code: it checks the trusted bytes against their
#            sums and publishes them in dependency order. A version already on
#            the registry with identical SHA-512 bytes is skipped; a different
#            tarball at that version fails. npm exchanges
#            this job's OIDC token for a one-use publish credential.
#   tag      `contents: write`, nothing else. Tags the released commit
#            `<name>@<version>` (annotated) for each package it published — the
#            docs sync and every consumer that pins a release by tag reads it —
#            and, when the package's CHANGELOG.md has a section for the
#            version, publishes it as a GitHub release. Idempotent: an existing
#            tag must already name this commit, or the job fails.
#
# The caller queues its runs (`concurrency` with `queue: max`), so none is ever
# cancelled; and since each run releases whatever is missing at its own
# commit, a run that finds its versions already published by an earlier one
# simply has nothing to do.
#
# The checks run from this workflow's own commit of OxyHQ/oxy
# (`job.workflow_repository`@`job.workflow_sha`), checked out beside the
# caller's tree, never from the caller's.

on:
  workflow_call:
    inputs:
      ci_workflow:
        description: The caller's CI workflow file, whose passing run on the commit vouches for it
        required: false
        type: string
        default: ci.yml

permissions:
  contents: read

env:
  RELEASE_PACKAGE: ${{ github.workspace }}/release-tools/.github/scripts/release-package.mjs

jobs:
  plan:
    name: what this commit releases
    # Only the protected default branch releases.
    if: github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Bounds the wait for CI on push in a repository without a merge queue.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          # The plan reads manifests only.
          sparse-checkout: '**/package.json'
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          sparse-checkout: .github/scripts/release-package.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: the public versions the registry does not have yet
        id: plan
        working-directory: source
        run: |
          node "$RELEASE_PACKAGE" plan > "$RUNNER_TEMP/plan.json"
          jq . "$RUNNER_TEMP/plan.json"
          echo "release=$(jq -c .release "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -c .build "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.release | length' "$RUNNER_TEMP/plan.json")" = 0 ]; then
            echo "::notice::every public package of $GITHUB_SHA is on the registry already; nothing to release"
          fi

      - name: CI passed on this exact commit
        if: steps.plan.outputs.release != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
        run: node "$RELEASE_PACKAGE" ci "$GITHUB_SHA" "$CI_WORKFLOW"

  build:
    name: build the trusted bytes
    needs: plan
    if: needs.plan.outputs.release != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE: ${{ needs.plan.outputs.release }}
      BUILD: ${{ needs.plan.outputs.build }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          sparse-checkout: |
            .github/scripts/release-package.mjs
            .github/scripts/release-runtime/package.json
            .github/scripts/release-runtime/package-lock.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: install the inspector's own locked runtime
        run: npm ci --prefix "$(dirname "$RELEASE_PACKAGE")/release-runtime" --ignore-scripts --no-audit --fund=false --userconfig /dev/null

      - name: install the exact reviewed dependencies
        run: bun install --frozen-lockfile --minimum-release-age=0

      - name: build each released package and each workspace it links, once
        run: |
          for directory in $(jq -r '.[]' <<<"$BUILD"); do
            echo "::group::build $directory"
            (cd "$directory" && bun run --if-present build)
            echo "::endgroup::"
          done

      - name: pack and inspect each tarball
        run: |
          out="$RUNNER_TEMP/release"
          rm -rf "$out" && mkdir "$out"
          mapfile -t releasing < <(jq -r '.[].name' <<<"$RELEASE")
          while read -r package; do
            directory="$(jq -r .directory <<<"$package")"
            # A directory of its own: `pack` wants exactly one tarball where it writes.
            staging="$(mktemp -d)"
            tarball="$(node "$RELEASE_PACKAGE" pack "$directory" "$staging")"
            node "$RELEASE_PACKAGE" inspect "$tarball" "$directory" "${releasing[@]}"
            mv "$tarball" "$out/"
            jq -c --arg tarball "$(basename "$tarball")" '. + {tarball: $tarball}' <<<"$package" >> "$out/release.jsonl"
          done < <(jq -c '.[]' <<<"$RELEASE")
          # Summed from inside the directory, so the file names each tarball by
          # its bare name: the artifact is downloaded flat into trusted/.
          (cd "$out" && sha512sum *.tgz release.jsonl | tee SHA512SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish with provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          sparse-checkout: .github/scripts/release-package.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: npm can exchange OIDC for a publish credential
        # Trusted publishing needs npm 11.5.1 or newer.
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $npm_version cannot publish with trusted publishing; it needs 11.5.1 or newer"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted

      - name: publish the trusted tarballs, dependencies first
        working-directory: ${{ runner.temp }}/trusted
        run: |
          sha512sum --check SHA512SUMS
          while read -r package; do
            name="$(jq -r .name <<<"$package")"
            version="$(jq -r .version <<<"$package")"
            tarball="$PWD/$(jq -r .tarball <<<"$package")"
            # Fresh read immediately before publish: 0 identical bytes, 1 absent.
            # Different bytes or registry failures must stop the release.
            if node "$RELEASE_PACKAGE" publish-status "$name" "$version" "$tarball"; then
              echo "::notice::$name@$version has identical registry bytes; not published again"
              continue
            elif [ $? -ne 1 ]; then
              exit 1
            fi
            # An absolute path: npm reads a bare `dir/<file>.tgz` as the GitHub
            # shorthand `user/repo` and tries to clone it (Kaana's 5.0.0
            # release failed exactly so).
            npm publish "$tarball" \
              --provenance --access public --tag "$(jq -r .tag <<<"$package")"
            echo "$package" >> "$RUNNER_TEMP/published.jsonl"
          done < release.jsonl

      # Also when a later package failed: what did go out gets its tag.
      - name: what went out
        id: published
        if: ${{ !cancelled() }}
        run: |
          touch "$RUNNER_TEMP/published.jsonl"
          echo "published=$(jq -sc . "$RUNNER_TEMP/published.jsonl")" >> "$GITHUB_OUTPUT"

  tag:
    name: tag the released commit
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.published != '' && needs.publish.outputs.published != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLISHED: ${{ needs.publish.outputs.published }}
    steps:
      - name: tag <name>@<version> at the released commit, with its changelog as a GitHub release
        run: |
          # The commit refs/tags/$1 names, peeled through annotated tags;
          # nothing when the tag does not exist. Any other API error fails
          # (explicitly: a command substitution does not inherit `-e`).
          tagged_commit() {
            local object
            if ! object="$(gh api "repos/$GH_REPO/git/ref/tags/$1" --jq '.object.type + " " + .object.sha' 2>"$RUNNER_TEMP/ref-error")"; then
              grep -q 'HTTP 404' "$RUNNER_TEMP/ref-error" && return 0
              cat "$RUNNER_TEMP/ref-error" >&2
              return 1
            fi
            while [ "${object%% *}" = tag ]; do
              object="$(gh api "repos/$GH_REPO/git/tags/${object#* }" --jq '.object.type + " " + .object.sha')" || return 1
            done
            echo "${object#* }"
          }

          # Already tagged (a re-run, or a lost race): fine only at this commit.
          check_existing() {
            if [ "$2" != "$GITHUB_SHA" ]; then
              echo "::error::$1 already exists at $2, not at the released commit $GITHUB_SHA"
              exit 1
            fi
            echo "$1 already names $GITHUB_SHA"
          }

          tag() {
            local tag="$1" existing tag_object
            existing="$(tagged_commit "$tag")"
            if [ -n "$existing" ]; then
              check_existing "$tag" "$existing"
              return 0
            fi
            tag_object="$(gh api "repos/$GH_REPO/git/tags" \
              -f tag="$tag" \
              -f object="$GITHUB_SHA" \
              -f type=commit \
              -f message="$tag

          Published to npm with provenance by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq .sha)"
            if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_object" --silent; then
              # Lost a race with another writer: the tag it made must agree.
              existing="$(tagged_commit "$tag")"
              [ -n "$existing" ] || exit 1
              check_existing "$tag" "$existing"
              return 0
            fi
            echo "tagged $tag at $GITHUB_SHA"
          }

          # The package's CHANGELOG.md section `## <version>` or
          # `## [<version>] …`, up to the next `## ` heading, as a GitHub release.
          release_notes() {
            local tag="$1" name="$2" version="$3" directory="$4" dist_tag="$5" changelog
            if gh api "repos/$GH_REPO/releases/tags/$tag" --silent 2>/dev/null; then
              echo "$tag already has a GitHub release"
              return 0
            fi
            changelog="${directory#./}/CHANGELOG.md"
            [ "$directory" = . ] && changelog=CHANGELOG.md
            if ! gh api "repos/$GH_REPO/contents/$changelog?ref=$GITHUB_SHA" \
              -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/CHANGELOG.md" 2>/dev/null; then
              echo "$changelog does not exist at $GITHUB_SHA; no GitHub release"
              return 0
            fi
            node -e '
              const [file, version] = process.argv.slice(1);
              const lines = require("fs").readFileSync(file, "utf8").split("\n");
              const heading = (line) => line.match(/^## \[?([^\]\s]+)/)?.[1];
              const start = lines.findIndex((line) => heading(line) === version);
              if (start === -1) process.exit(0);
              let end = lines.findIndex((line, i) => i > start && line.startsWith("## "));
              if (end === -1) end = lines.length;
              process.stdout.write(lines.slice(start + 1, end).join("\n").trim());
            ' "$RUNNER_TEMP/CHANGELOG.md" "$version" > "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              echo "$changelog has no section for $version; no GitHub release"
              return 0
            fi
            local prerelease=false make_latest=false
            case "$version" in *-*) prerelease=true ;; esac
            [ "$dist_tag" = latest ] && make_latest=true
            gh api "repos/$GH_REPO/releases" \
              -f tag_name="$tag" \
              -f name="$name $version" \
              -F body=@"$RUNNER_TEMP/notes.md" \
              -F prerelease="$prerelease" \
              -f make_latest="$make_latest" \
              --jq .html_url
          }

          while read -r package; do
            name="$(jq -r .name <<<"$package")"
            version="$(jq -r .version <<<"$package")"
            tag "$name@$version"
            release_notes "$name@$version" "$name" "$version" \
              "$(jq -r .directory <<<"$package")" "$(jq -r .tag <<<"$package")"
          done < <(jq -c '.[]' <<<"$PUBLISHED")
