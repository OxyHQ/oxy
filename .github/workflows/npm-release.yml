name: npm release

# THE release of every public npm package OxyHQ owns, called by each
# repository's own `.github/workflows/release-packages.yml` (OxyHQ/oxy calls it
# locally). One package per run, from one exact protected commit, published with
# npm trusted publishing (OIDC) and provenance. There is no NPM_TOKEN anywhere.
# docs/engineering/package-rules.md#publishing.
#
# npm checks the trusted publisher against the CALLING workflow, so every
# package's trusted publisher on npmjs.com is: organization `OxyHQ`, its
# repository, workflow `release-packages.yml`, environment `npm`. The caller
# grants `id-token: write` and `contents: write` on its calling job; only the
# publish job keeps the first and only the tag job the second.
#
#   build    the caller's tree at the exact reviewed commit: frozen install, the
#            builds of the workspace packages it links, the package's own
#            `prepublishOnly` (its typecheck, tests and build), then its one
#            tarball: `bun pm pack`, which rewrites `workspace:`/`catalog:`
#            ranges, or the package's own `release:pack` when it publishes a
#            staged manifest it packs and tests itself.
#            `release-package.mjs inspect` checks the tarball (including that
#            every `workspace:` dependency is pinned to the version its
#            workspace has in this commit, never a stale `bun.lock` one); the
#            version must be absent from the registry and the dist-tag sane. Uploads the
#            tarball and its SHA-512 as the trusted bytes. No credential of any
#            kind, and no `id-token`.
#   publish  environment `npm`, `id-token: write`. A fresh checkout rebuilds and
#            repacks; the result must equal the trusted bytes, the version must
#            still be absent, and only then `npm publish`. npm exchanges this
#            job's OIDC token for a one-use publish credential.
#   tag      `contents: write`, nothing else. Tags the released commit
#            `<name>@<version>` (annotated) — the docs sync and every
#            consumer that pins a release by tag reads it — and, when the
#            package's CHANGELOG.md has a section for the version, publishes
#            it as a GitHub release. Idempotent: an existing tag must already
#            name `expected_source_sha`, or the job fails.
#
# The checks run from this workflow's own commit of OxyHQ/oxy
# (`job.workflow_repository`@`job.workflow_sha`), checked out beside the
# caller's tree, never from the caller's.

on:
  workflow_call:
    inputs:
      package:
        description: Package name to release, e.g. @oxy.so/core
        required: true
        type: string
      expected_source_sha:
        description: Exact protected commit to build and publish
        required: true
        type: string
      dry_run:
        description: Build, verify and preflight the registry without publishing
        required: true
        type: boolean
      dist_tag:
        description: npm dist-tag; latest only moves forward and never names a prerelease
        required: false
        type: string
        default: latest

permissions:
  contents: read

env:
  PACKAGE_NAME: ${{ inputs.package }}
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  DIST_TAG: ${{ inputs.dist_tag }}
  RELEASE_PACKAGE: ${{ github.workspace }}/release-tools/.github/scripts/release-package.mjs

jobs:
  build:
    name: build the trusted bytes
    # The default branch, or a maintained `release/*` line; protected either way.
    if: >-
      github.ref_protected && (
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
        startsWith(github.ref, 'refs/heads/release/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      package_dir: ${{ steps.registry.outputs.package_dir }}
      version: ${{ steps.registry.outputs.version }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          sparse-checkout: .github/scripts/release-package.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: the run is the exact commit that was reviewed
        run: |
          if [ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "$GITHUB_REF is at $GITHUB_SHA, not the expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: install the exact reviewed dependencies
        run: bun install --frozen-lockfile --minimum-release-age=0

      - name: the package is a public package of this repository
        run: echo "PACKAGE_DIR=$(node "$RELEASE_PACKAGE" resolve "$PACKAGE_NAME")" >> "$GITHUB_ENV"

      - name: the package's own pre-flight
        run: |
          for dependency in $(node "$RELEASE_PACKAGE" dependencies "$PACKAGE_NAME"); do
            (cd "$dependency" && bun run --if-present build)
          done
          (cd "$PACKAGE_DIR" && bun run prepublishOnly)

      - name: pack
        run: |
          rm -rf "$RUNNER_TEMP/release" && mkdir "$RUNNER_TEMP/release"
          tarball="$(node "$RELEASE_PACKAGE" pack "$PACKAGE_DIR" "$RUNNER_TEMP/release")"
          node "$RELEASE_PACKAGE" inspect "$tarball" "$PACKAGE_DIR"
          # Summed from inside the directory, so the file names the tarball by its
          # bare name: the artifact is downloaded flat into trusted/.
          (cd "$RUNNER_TEMP/release" && sha512sum "$(basename "$tarball")" | tee SHA512SUMS)

      - name: the version is not on the registry yet, and the dist-tag is sane
        id: registry
        run: |
          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          if npm view "$PACKAGE_NAME@$version" version --userconfig /dev/null >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$version is already published; bump the version"
            exit 1
          fi
          node "$RELEASE_PACKAGE" dist-tag "$PACKAGE_NAME" "$version" "$DIST_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish with provenance
    needs: build
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-tools
          sparse-checkout: .github/scripts/release-package.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: npm can exchange OIDC for a publish credential
        # Trusted publishing needs npm 11.5.1 or newer.
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $npm_version cannot publish with trusted publishing; it needs 11.5.1 or newer"
            exit 1
          fi

      - name: rebuild from the exact source
        run: |
          bun install --frozen-lockfile --minimum-release-age=0
          PACKAGE_DIR="$(node "$RELEASE_PACKAGE" resolve "$PACKAGE_NAME")"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          for dependency in $(node "$RELEASE_PACKAGE" dependencies "$PACKAGE_NAME"); do
            (cd "$dependency" && bun run --if-present build)
          done
          mkdir "$RUNNER_TEMP/rebuilt"
          node "$RELEASE_PACKAGE" pack "$PACKAGE_DIR" "$RUNNER_TEMP/rebuilt"

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.run_id }}
          path: ${{ runner.temp }}/trusted

      - name: the rebuilt bytes are the trusted bytes
        run: |
          (cd "$RUNNER_TEMP/trusted" && sha512sum --check SHA512SUMS)
          trusted=("$RUNNER_TEMP"/trusted/*.tgz)
          rebuilt=("$RUNNER_TEMP"/rebuilt/*.tgz)
          cmp "${trusted[0]}" "${rebuilt[0]}"

      - name: the version is not on the registry yet (anonymous preflight)
        run: |
          version="$(node -p "require('./$PACKAGE_DIR/package.json').version")"
          if npm view "$PACKAGE_NAME@$version" version --userconfig /dev/null >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$version is already published; bump the version"
            exit 1
          fi

      - name: publish the trusted tarball
        run: |
          trusted=("$RUNNER_TEMP"/trusted/*.tgz)
          # An absolute path: npm reads a bare `dir/<file>.tgz` as the GitHub
          # shorthand `user/repo` and tries to clone it (Kaana's 5.0.0 release
          # failed exactly so).
          npm publish "${trusted[0]}" --provenance --access public --tag "$DIST_TAG"

  tag:
    name: tag the released commit
    needs: [build, publish]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_DIR: ${{ needs.build.outputs.package_dir }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: tag <name>@<version> at the released commit
        run: |
          tag="$PACKAGE_NAME@$VERSION"
          echo "TAG=$tag" >> "$GITHUB_ENV"

          # The commit refs/tags/$tag names, peeled through annotated tags;
          # nothing when the tag does not exist. Any other API error fails
          # (explicitly: a command substitution does not inherit `-e`).
          tagged_commit() {
            local object
            if ! object="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>"$RUNNER_TEMP/ref-error")"; then
              grep -q 'HTTP 404' "$RUNNER_TEMP/ref-error" && return 0
              cat "$RUNNER_TEMP/ref-error" >&2
              return 1
            fi
            while [ "${object%% *}" = tag ]; do
              object="$(gh api "repos/$GH_REPO/git/tags/${object#* }" --jq '.object.type + " " + .object.sha')" || return 1
            done
            echo "${object#* }"
          }

          # Already tagged (a re-run, or a hand tag): fine only at this commit.
          check_existing() {
            if [ "$1" != "$EXPECTED_SOURCE_SHA" ]; then
              echo "::error::$tag already exists at $1, not at the released commit $EXPECTED_SOURCE_SHA"
              exit 1
            fi
            echo "$tag already names $EXPECTED_SOURCE_SHA"
          }

          existing="$(tagged_commit)"
          if [ -n "$existing" ]; then
            check_existing "$existing"
            exit 0
          fi

          tag_object="$(gh api "repos/$GH_REPO/git/tags" \
            -f tag="$tag" \
            -f object="$EXPECTED_SOURCE_SHA" \
            -f type=commit \
            -f message="$tag

          Published to npm with provenance by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq .sha)"
          if ! gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_object" --silent; then
            # Lost a race with another writer: the tag it made must agree.
            existing="$(tagged_commit)"
            [ -n "$existing" ] || exit 1
            check_existing "$existing"
            exit 0
          fi
          echo "tagged $tag at $EXPECTED_SOURCE_SHA"

      - name: publish the changelog section as a GitHub release
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already has a GitHub release"
            exit 0
          fi
          changelog="${PACKAGE_DIR#./}/CHANGELOG.md"
          [ "$PACKAGE_DIR" = . ] && changelog=CHANGELOG.md
          if ! gh api "repos/$GH_REPO/contents/$changelog?ref=$EXPECTED_SOURCE_SHA" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/CHANGELOG.md" 2>/dev/null; then
            echo "$changelog does not exist at $EXPECTED_SOURCE_SHA; no GitHub release"
            exit 0
          fi
          # The section whose heading is `## <version>` or `## [<version>] …`,
          # up to the next `## ` heading.
          node -e '
            const [file, version] = process.argv.slice(1);
            const lines = require("fs").readFileSync(file, "utf8").split("\n");
            const heading = (line) => line.match(/^## \[?([^\]\s]+)/)?.[1];
            const start = lines.findIndex((line) => heading(line) === version);
            if (start === -1) process.exit(0);
            let end = lines.findIndex((line, i) => i > start && line.startsWith("## "));
            if (end === -1) end = lines.length;
            process.stdout.write(lines.slice(start + 1, end).join("\n").trim());
          ' "$RUNNER_TEMP/CHANGELOG.md" "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "$changelog has no section for $VERSION; no GitHub release"
            exit 0
          fi
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          make_latest=false
          [ "$DIST_TAG" = latest ] && make_latest=true
          gh api "repos/$GH_REPO/releases" \
            -f tag_name="$TAG" \
            -f name="$PACKAGE_NAME $VERSION" \
            -F body=@"$RUNNER_TEMP/notes.md" \
            -F prerelease="$prerelease" \
            -f make_latest="$make_latest" \
            --jq .html_url
