# `accounts` and `console` deploy as WORKERS; `auth` is still a Pages project.
#
# A Pages project ALWAYS serves `<project>.pages.dev` and Cloudflare offers no
# way to switch it off — `wrangler pages project` has only `list`, `create` and
# `delete`. So every Pages app here has a second, unchosen copy of itself on a
# hostname that is in no CORS allowlist: it renders the shell and fails every
# call it makes. A Worker declines its default hostname outright with
# `workers_dev = false`, which is why the two static apps have moved.
#
# `auth` HAS NOT MOVED yet. It is now fully static too (its only Pages
# Function, an unused edge-activity middleware, was retired), so that move is a
# plain assets-only Worker, and still its own change.
name: Deploy Frontends to Cloudflare

on:
  push:
    branches: [main]
    # Exactly the union of the `detect-changes` filters below (keep the two in
    # step): a push outside it would only run `detect-changes` to deploy
    # nothing, and that runner is one of the org's 20. Not a required check,
    # so a skipped run blocks nothing; `workflow_dispatch` is unfiltered.
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'turbo.json'
      - 'patches/**'
      - 'vendor/expo-native/**'
      - 'tooling/expo-code-signing-native/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'packages/accounts/**'
      - 'packages/auth/**'
      - 'packages/console/**'
      - 'packages/app-preset/**'
      - 'packages/bloom/**'
      - 'packages/expo-splash/**'
      - 'packages/core/**'
      - 'packages/protocol/**'
      - 'packages/telemetry/**'
      - 'packages/services/**'
      - 'packages/contracts/**'
  workflow_dispatch:

# Checkout only. Secrets reach the deploy steps through `secrets.*`, which the
# token's permissions do not gate.
permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      auth: ${{ steps.filter.outputs.auth }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            accounts:
              # Shared install/build inputs also change the deployed bundle.
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'patches/**'
              - 'vendor/expo-native/**'
              - 'tooling/expo-code-signing-native/**'
              - '.github/workflows/deploy-cloudflare.yml'
              - 'packages/accounts/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/expo-splash/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              # core's own dependency: every app here bundles it through core.
              - 'packages/telemetry/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            auth:
              # Shared install/build inputs also change the deployed bundle.
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'patches/**'
              - 'vendor/expo-native/**'
              - 'tooling/expo-code-signing-native/**'
              - '.github/workflows/deploy-cloudflare.yml'
              - 'packages/auth/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              # core's own dependency: every app here bundles it through core.
              - 'packages/telemetry/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            console:
              # Shared install/build inputs also change the deployed bundle.
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - 'patches/**'
              - 'vendor/expo-native/**'
              - 'tooling/expo-code-signing-native/**'
              - '.github/workflows/deploy-cloudflare.yml'
              - 'packages/console/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              # core's own dependency: every app here bundles it through core.
              - 'packages/telemetry/**'
              - 'packages/services/**'
              - 'packages/contracts/**'

  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 ~2m (16 runs to 2026-10-15)
    # One auth deploy at a time, never cancelled mid-deploy. Per app, not per
    # workflow: GitHub keeps one PENDING run per group and cancels the older,
    # which is harmless only when the newer run deploys the same app (it checks
    # out `main`, a superset); a workflow-wide group would let a push that
    # touches only another app cancel this one's pending deploy.
    concurrency:
      group: deploy-cloudflare-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # CI installs the reviewed lock verbatim. The age override applies only to
      # resolution and is safe here because frozen mode rejects lockfile drift;
      # without it Bun re-applies the seven-day quarantine to already-locked
      # fresh releases and blocks a deterministic deploy.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      # Build the Vite SPA into packages/auth/dist. The IdP is fully static: it
      # has no Pages Functions (the retired edge-activity middleware was the
      # only one) and no advanced-mode `dist/_worker.js`.
      - run: bun x turbo run build --filter=auth
        env:
          # Auth IdP's OWN registered Oxy client id. `packages/auth/lib/oxy-client.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.AUTH_OXY_CLIENT_ID }}
          # No analytics variables: auth.oxy.so runs no product analytics
          # (ADR 0024 D1).
      # Deploy the static `dist`. Invoke `bunx wrangler` DIRECTLY rather than
      # cloudflare/wrangler-action: that action's `npx --no-install wrangler`
      # path runs npm's Arborist from packages/auth, which rejects the repo-root
      # `overrides["@oxy.so/bloom"]` against this package's newer direct bloom dep
      # (`npm error code EOVERRIDE`). The whole monorepo installs with bun, and
      # bun's resolver does not perform that npm-only override validation.
      - name: Deploy to Cloudflare Pages
        working-directory: packages/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy dist --project-name=oxy-auth --branch=main
      # Post-deploy smoke gate: hit the LIVE host and assert the device-first IdP
      # contract on PUBLIC, unauthenticated endpoints only (no secrets). A broken
      # deploy (blank SPA, or a re-added FedCM manifest / oxy_device cookie lane)
      # turns this job RED immediately. Retries briefly to let the Pages deploy
      # propagate.
      - name: Post-deploy IdP smoke gate
        working-directory: packages/auth
        env:
          SMOKE_TARGET: https://auth.oxy.so
        run: >
          "$GITHUB_WORKSPACE/.github/scripts/retry-smoke.sh"
          smoke:idp
          'IdP smoke'
          'IdP post-deploy smoke gate failed — auth.oxy.so is serving a broken build'

  deploy-accounts:
    needs: detect-changes
    if: needs.detect-changes.outputs.accounts == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # p95 ~4.5m
    # One accounts deploy at a time, never cancelled mid-deploy. Per app, not per
    # workflow: GitHub keeps one PENDING run per group and cancels the older,
    # which is harmless only when the newer run deploys the same app (it checks
    # out `main`, a superset); a workflow-wide group would let a push that
    # touches only another app cancel this one's pending deploy.
    concurrency:
      group: deploy-cloudflare-accounts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # CI installs the reviewed lock verbatim. The age override applies only to
      # resolution and is safe here because frozen mode rejects lockfile drift;
      # without it Bun re-applies the seven-day quarantine to already-locked
      # fresh releases and blocks a deterministic deploy.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun x turbo run build --filter=accounts
        env:
          # Accounts' PRODUCTION Oxy client id. `packages/accounts/constants/oxy.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # accounts and commons share `EXPO_PUBLIC_OXY_CLIENT_ID`, so one
          # variable per var NAME could not serve them.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.ACCOUNTS_OXY_CLIENT_ID }}
          EXPO_PUBLIC_POSTHOG_ENABLED: ${{ vars.POSTHOG_ENABLED }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` and Cloudflare offers no way to switch it off, so
      # `oxy-accounts.pages.dev` was a second copy of the account surface on a
      # hostname that is in no CORS allowlist. `workers_dev = false` in
      # `packages/accounts/wrangler.toml` leaves `accounts.oxy.so` as the only
      # way in. Everything else — the assets directory, the HTML handling, the
      # fallback, the custom domain — is declared in that file rather than
      # passed here, so a deploy cannot disagree with the config.
      #
      # `bunx wrangler` DIRECTLY, never `cloudflare/wrangler-action`. The action
      # installs its own wrangler and picks the package manager by looking for a
      # lockfile beside `workingDirectory`; `packages/accounts` has none — the
      # lock is at the repository root — so it falls back to npm, and npm cannot
      # even parse this tree, because the root `overrides` pin `@oxy.so/bloom` to
      # `catalog:`, a bun-only protocol. That is the same `npm error code
      # EOVERRIDE` already recorded on the auth job above.
      #
      # It is not a local quirk. Homiio took a PRODUCTION OUTAGE from exactly
      # this on 2026-08-09 (run 31292337344: `Fail extracting tarball for
      # "wrangler"` — published nothing, left a stale bundle running against a
      # changed API) and moved off the action in #291; Mercaria's AGENTS.md
      # forbids it outright; Alia's Canvas deploy failed on five consecutive
      # runs before moving off it. Do not "modernise" this back.
      #
      # `wrangler@4` is PINNED: an unpinned `bunx wrangler` re-resolves the
      # latest major on every deploy, changing the deploy path with no diff.
      - name: Deploy the Worker
        working-directory: packages/accounts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy
      # Post-deploy CSP gate. The static Expo export emits an inline hydration
      # script, and `writePagesHeaders` derives its hash into `dist/_headers`
      # during the build above. Derivation only makes those two agree INSIDE
      # `dist`: a deploy that drops `_headers`, a build that runs the generator
      # before the export again, or an edge rule that replaces the header all
      # put them back out of sync. None of those break the app visibly — Expo
      # falls back from `hydrateRoot` to a full client render and the only
      # symptom is a console error — so assert it against the LIVE host.
      # Retries briefly to let the deploy propagate.
      #
      # It is also the gate on the `_headers` file surviving the move off Pages:
      # Workers static assets honour `_headers`, and if that ever stopped being
      # true this job is what says so.
      - name: Post-deploy CSP smoke gate
        working-directory: packages/accounts
        env:
          SMOKE_TARGET: https://accounts.oxy.so
        run: >
          "$GITHUB_WORKSPACE/.github/scripts/retry-smoke.sh"
          smoke:csp
          'CSP smoke'
          'accounts.oxy.so is serving a CSP that blocks its own inline script'

  deploy-console:
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10 # p95 ~2m
    # One console deploy at a time, never cancelled mid-deploy. Per app, not per
    # workflow: GitHub keeps one PENDING run per group and cancels the older,
    # which is harmless only when the newer run deploys the same app (it checks
    # out `main`, a superset); a workflow-wide group would let a push that
    # touches only another app cancel this one's pending deploy.
    concurrency:
      group: deploy-cloudflare-console
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # CI installs the reviewed lock verbatim. The age override applies only to
      # resolution and is safe here because frozen mode rejects lockfile drift;
      # without it Bun re-applies the seven-day quarantine to already-locked
      # fresh releases and blocks a deterministic deploy.
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun x turbo run build --filter=oxy-console
        env:
          # Console's PRODUCTION Oxy client id. `packages/console/src/lib/config.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.CONSOLE_OXY_CLIENT_ID }}
      # A WORKER, not a Pages project — same reason as accounts above.
      # `oxy-console.pages.dev` served a second copy of the application registry
      # on a hostname that is in no CORS allowlist and in no registered
      # `redirectUris`; `workers_dev = false` in `packages/console/wrangler.toml`
      # leaves `console.oxy.so` as the only way in.
      #
      # The `Resolve build output directory` step that used to sit here is gone
      # with the Pages deploy that needed it. It chose between `dist` and
      # `.output/public` at run time; `packages/console/wrangler.toml` names
      # `./dist`, which is the only thing `vite build` has ever emitted, and a
      # missing assets directory fails `wrangler deploy` by itself.
      #
      # `bunx wrangler` DIRECTLY and PINNED, never `cloudflare/wrangler-action`
      # — see the accounts job above for the measurements.
      - name: Deploy the Worker
        working-directory: packages/console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy
