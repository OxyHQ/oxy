name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.filter.outputs.accounts }}
      auth: ${{ steps.filter.outputs.auth }}
      console: ${{ steps.filter.outputs.console }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            accounts:
              - 'packages/accounts/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/expo-splash/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            auth:
              - 'packages/auth/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'
            console:
              - 'packages/console/**'
              - 'packages/app-preset/**'
              - 'packages/bloom/**'
              - 'packages/core/**'
              - 'packages/protocol/**'
              - 'packages/services/**'
              - 'packages/contracts/**'

  deploy-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      # Build the Vite SPA into packages/auth/dist. The IdP is static apart from
      # ONE Pages Functions directory: `packages/auth/functions/hub/*`, the
      # browser DeviceSession hub (issue #937 Phase 5, ADR 0003). The former
      # `/api/device-accounts` function deleted in the 2c cutover stays deleted —
      # the chooser is served by the device-first SDK.
      #
      # `wrangler pages deploy` compiles `./functions` from the WORKING DIRECTORY,
      # which the deploy step below sets to `packages/auth`. It must stay a
      # Functions DIRECTORY: CF Pages did not detect an advanced-mode
      # `dist/_worker.js` on this project at all.
      - run: bun x turbo run build --filter=auth
        env:
          # Auth IdP's OWN registered Oxy client id. `packages/auth/lib/oxy-client.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.AUTH_OXY_CLIENT_ID }}
      # Deploy the static `dist`. Invoke `bunx wrangler` DIRECTLY rather than
      # cloudflare/wrangler-action: that action's `npx --no-install wrangler`
      # path runs npm's Arborist from packages/auth, which rejects the repo-root
      # `overrides["@oxyhq/bloom"]` against this package's newer direct bloom dep
      # (`npm error code EOVERRIDE`). The whole monorepo installs with bun, and
      # bun's resolver does not perform that npm-only override validation.
      - name: Deploy to Cloudflare Pages
        working-directory: packages/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy dist --project-name=oxy-auth --branch=main
      # Post-deploy smoke gate: hit the LIVE host and assert the device-first IdP
      # contract on PUBLIC, unauthenticated endpoints only (no secrets). A broken
      # deploy (blank SPA, or a re-added FedCM manifest / oxy_device cookie lane)
      # turns this job RED immediately. Retries briefly to let the Pages deploy
      # propagate.
      - name: Post-deploy IdP smoke gate
        working-directory: packages/auth
        env:
          SMOKE_TARGET: https://auth.oxy.so
        run: >
          "$GITHUB_WORKSPACE/.github/scripts/retry-smoke.sh"
          smoke:idp
          'IdP smoke'
          'IdP post-deploy smoke gate failed — auth.oxy.so is serving a broken build'

  deploy-accounts:
    needs: detect-changes
    if: needs.detect-changes.outputs.accounts == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      - run: bun x turbo run build --filter=accounts
        env:
          # Accounts' PRODUCTION Oxy client id. `packages/accounts/constants/oxy.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # accounts and commons share `EXPO_PUBLIC_OXY_CLIENT_ID` (inbox did too,
          # until it moved to OxyHQ/Inbox), so one variable per var NAME could not
          # serve them.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.ACCOUNTS_OXY_CLIENT_ID }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy packages/accounts/dist --project-name=oxy-accounts --branch=main
      # Post-deploy CSP gate. The static Expo export emits an inline hydration
      # script, and `writePagesHeaders` derives its hash into `dist/_headers`
      # during the build above. Derivation only makes those two agree INSIDE
      # `dist`: a deploy that drops `_headers`, a build that runs the generator
      # before the export again, or an edge rule that replaces the header all
      # put them back out of sync. None of those break the app visibly — Expo
      # falls back from `hydrateRoot` to a full client render and the only
      # symptom is a console error — so assert it against the LIVE host.
      # Retries briefly to let the Pages deploy propagate.
      - name: Post-deploy CSP smoke gate
        working-directory: packages/accounts
        env:
          SMOKE_TARGET: https://accounts.oxy.so
        run: >
          "$GITHUB_WORKSPACE/.github/scripts/retry-smoke.sh"
          smoke:csp
          'CSP smoke'
          'accounts.oxy.so is serving a CSP that blocks its own inline script'

  # deploy-inbox is GONE: the app moved to OxyHQ/Inbox, which now owns the
  # `oxy-inbox` Pages project and inbox.oxy.so.
  #
  # This job had to go BEFORE packages/inbox is deleted, not with it, because
  # its paths-filter fired on packages/{app-preset,bloom,expo-splash,core,
  # protocol,services,contracts}/** as well as on packages/inbox/** — packages
  # that change weekly. Left in place, any routine SDK commit here would rebuild
  # the old copy of the app and overwrite whatever OxyHQ/Inbox had deployed. Two
  # writers, both green, and the symptom is "inbox.oxy.so reverted itself" with
  # nothing to point at.
  #
  # packages/inbox itself is removed separately, once the new repo has served a
  # deploy. Until then the code here is still built and tested by ci.yml's
  # inbox-test — it just cannot deploy.

  deploy-console:
    needs: detect-changes
    if: needs.detect-changes.outputs.console == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      # bun 1.3.14 `--frozen-lockfile` false-positives on a perfectly-synced
      # lock (non-deterministic configVersion churn), failing deploys. Lockfile
      # sync is already gated pre-push (test-build) and in PR CI, so the deploy
      # installs without the buggy frozen flag.
      - run: bun install
      - run: bun x turbo run build --filter=oxy-console
        env:
          # Console's PRODUCTION Oxy client id. `packages/console/src/lib/config.ts`
          # falls back to a committed id when this is unset. A repo VARIABLE rather
          # than a secret — the id ships inside the bundle. Named per APP because
          # auth and console share `VITE_OXY_CLIENT_ID`.
          VITE_OXY_CLIENT_ID: ${{ vars.CONSOLE_OXY_CLIENT_ID }}
      - name: Resolve build output directory
        run: |
          if [ -d packages/console/dist ]; then
            echo "DEPLOY_DIR=packages/console/dist" >> $GITHUB_ENV
          elif [ -d packages/console/.output/public ]; then
            echo "DEPLOY_DIR=packages/console/.output/public" >> $GITHUB_ENV
          else
            echo "No build output found" && exit 1
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 pages deploy ${{ env.DEPLOY_DIR }} --project-name=oxy-console --branch=main
