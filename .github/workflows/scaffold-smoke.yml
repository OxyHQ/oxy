# Nightly (and on scaffolder/preset changes) end-to-end smoke of create-oxy-app:
# generate a full app, install, typecheck, build the backend, export web, and
# prebuild native — catching drift against the live Oxy SDK + Expo SDK.
name: scaffold-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    paths:
      - 'packages/create-oxy-app/**'
      - 'packages/app-preset/**'

# Least privilege: this workflow only reads the repo (no writes, no packages).
permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04-arm

    # Postgres for the generated backend's migration steps. The generated app
    # ships its own docker-compose.postgres.yml for developers; CI cannot use it
    # (a compose file inside a service container is one layer too many), so the
    # image is pinned to the SAME major the template's compose file names — a
    # developer's database and CI's must not disagree about what they are testing.
    #
    # The migrator applies the template's own drizzle/ journal to this database
    # from zero, which is the only check that the shipped migrations are actually
    # applicable rather than merely present.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install monorepo deps
        run: bun install

      - name: Build the create-oxy-app CLI
        run: bun run --cwd packages/create-oxy-app build

      - name: Run the CLI unit tests
        run: bun run --cwd packages/create-oxy-app test

      - name: Pack + install the scaffolder from its tarball
        run: |
          # Run the scaffolder from its PACKED tarball, not the repo tree, so the
          # template file set exercised here is exactly what `bun publish` ships.
          # This catches template files the packer silently strips (e.g. a literal
          # `templates/base/bunfig.toml` — bun/npm exclude that exact name, which
          # once shipped a scaffold whose `bun install` failed).
          bun pm pack --cwd packages/create-oxy-app --destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          echo '{"name":"coa-runner","private":true}' > package.json
          bun add "$RUNNER_TEMP"/create-oxy-app-*.tgz

      - name: Pack @oxyhq/app-preset from the monorepo
        run: |
          # @oxyhq/app-preset may be unpublished at HEAD, so the generated app has
          # to take it from this checkout. Install it from a PACKED TARBALL rather
          # than pointing a `file:` override at the source directory: bun
          # materializes a `file:` DIRECTORY dependency as a tree of symlinks back
          # to that directory, and node resolves a symlinked module to its realpath.
          # Every `require` inside the preset (expo/metro-config, metro-config,
          # nativewind/metro) would then resolve from THIS checkout's node_modules
          # instead of the generated app's. A tarball is extracted as real files,
          # which is exactly what a `bun add @oxyhq/app-preset` from the registry
          # produces, and it also exercises the package's `files` list.
          bun pm pack --cwd packages/app-preset --destination "$RUNNER_TEMP"

      - name: Scaffold a test app (from the packed tarball)
        run: |
          node "$RUNNER_TEMP/cli/node_modules/create-oxy-app/dist/index.js" "$RUNNER_TEMP/smoke-app" \
            --yes --no-register --no-git --no-install \
            --name "Smoke App" --slug smoke-app --scheme smokeapp \
            --bundle-id com.example.smokeapp --domain api.smoke.example.com

      - name: Assert the scaffold ships a hoisted-linker bunfig.toml
        run: |
          # Isolated linker (bun's default) does not hoist @oxyhq/app-preset to
          # the root node_modules, so shared-types' tsconfig extends fail. The
          # generated app MUST carry bunfig.toml with the hoisted linker.
          grep -q 'linker = "hoisted"' "$RUNNER_TEMP/smoke-app/bunfig.toml"

      - name: Assert the scaffold ships its Postgres layer
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          set -euo pipefail

          # Pure file checks, so they run BEFORE the install and fail in seconds.
          # These are the packed-tarball counterpart of the CLI unit tests: the
          # tests read the template tree, this reads what the tarball RENDERED.
          missing=0
          for f in docker-compose.postgres.yml \
                   packages/backend/drizzle.config.ts \
                   packages/backend/drizzle/meta/_journal.json \
                   packages/backend/src/db/postgres.ts \
                   packages/backend/src/db/migrate.ts \
                   packages/backend/src/db/migrationsFolder.ts \
                   packages/backend/src/db/schema/index.ts; do
            if [ ! -f "$f" ]; then echo "::error::scaffold is missing $f"; missing=1; fi
          done
          [ "$missing" = 0 ]

          if [ -e packages/backend/src/config/database.ts ]; then
            echo "::error::the Mongoose connector is still shipped"; exit 1
          fi

          # No unrendered template tokens anywhere in the Postgres layer. The
          # scaffolder throws on an UNKNOWN token, but a token inside a file the
          # renderer never visited would survive silently.
          if grep -rn '{{' docker-compose.postgres.yml packages/backend/drizzle.config.ts packages/backend/src/db/; then
            echo "::error::unrendered template token in the generated Postgres layer"; exit 1
          fi

          # Nothing in the generated app may still talk about Mongo.
          if grep -rniI mongo . --exclude-dir=node_modules --exclude=bun.lock; then
            echo "::error::generated app still mentions Mongo"; exit 1
          fi

          # The runtime image must carry the migrations next to the compiled
          # migrator, or the migration step fails on a missing journal at deploy
          # time — long after this workflow went green.
          if ! grep -q 'packages/backend/drizzle/' packages/backend/Dockerfile; then
            echo "::error::the Dockerfile runtime stage does not COPY packages/backend/drizzle/"; exit 1
          fi

          # Every migration declares exactly one recognised deploy phase. Without
          # this the migrator refuses at deploy time rather than here.
          for sql in packages/backend/drizzle/*.sql; do
            n=$(grep -cE '^-- oxy:deploy-phase=(pre|post)$' "$sql" || true)
            if [ "$n" != 1 ]; then
              echo "::error::$sql has $n deploy-phase markers, expected exactly 1"; exit 1
            fi
          done

      - name: Assert the generated backend pins the Postgres stack
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./packages/backend/package.json");
            const problems = [];
            for (const dep of ["@oxyhq/db", "drizzle-orm", "postgres"]) {
              if (!pkg.dependencies?.[dep]) problems.push(`missing dependency ${dep}`);
            }
            if (!pkg.devDependencies?.["drizzle-kit"]) problems.push("missing devDependency drizzle-kit");
            for (const script of ["db:generate", "db:migrate"]) {
              if (!pkg.scripts?.[script]) problems.push(`missing script ${script}`);
            }
            if (pkg.dependencies?.mongoose) problems.push("mongoose is still a dependency");
            if (problems.length) {
              for (const p of problems) console.error(`::error::${p}`);
              process.exit(1);
            }
          '

      - name: Install the generated app (+ local @oxyhq/app-preset)
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          # Override @oxyhq/app-preset with the tarball packed above, so the app
          # installs the HEAD preset the same way a real consumer installs the
          # published one. See the pack step for why a tarball and not a dir.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = process.env.RUNNER_TEMP;
            const tarball = fs.readdirSync(dir).find((f) => /^oxyhq-app-preset-.*\.tgz$/.test(f));
            if (!tarball) throw new Error("packed @oxyhq/app-preset tarball not found in " + dir);
            const local = "file:" + path.join(dir, tarball);
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.overrides["@oxyhq/app-preset"] = local;
            p.resolutions["@oxyhq/app-preset"] = local;
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          bun install --ignore-scripts
          bun run build:shared-types

      - name: Assert the app's Metro config stays inside the generated app
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          # Every absolute path the preset bakes into the Metro config must point
          # inside the generated app. Metro can only resolve files under
          # projectRoot + watchFolders, so a path that escapes to this checkout
          # fails the bundle 30s in with an opaque "Unable to resolve module
          # <abs path>". emptyModulePath is the canonical victim: metro-config
          # computes it with require.resolve at config-build time, so it lands
          # wherever the preset's own require chain was rooted.
          node -e '
            const path = require("path");
            const appRoot = path.resolve("../..") + path.sep;
            const assertInsideApp = (label, target) => {
              if (!target.startsWith(appRoot)) {
                throw new Error(label + " escaped the generated app: " + target);
              }
            };
            assertInsideApp("@oxyhq/app-preset", require.resolve("@oxyhq/app-preset/metro"));
            assertInsideApp("resolver.emptyModulePath", require("./metro.config.js").resolver.emptyModulePath);
          '

      - name: Lockfile is stable (no churn on re-install)
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          cp bun.lock bun.lock.before
          bun install --ignore-scripts
          diff -q bun.lock.before bun.lock

      - name: Typecheck the frontend
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run --cwd packages/frontend typecheck

      - name: Build the backend
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run --cwd packages/backend build

      - name: Migrate the generated app from zero
        working-directory: ${{ runner.temp }}/smoke-app/packages/backend
        env:
          DATABASE_URL: postgres://smoke:smoke@127.0.0.1:5432/smoke_app_ci
        run: |
          set -euo pipefail

          # The COMPILED migrator (dist/src/db/migrate.js), deliberately, not the
          # `db:migrate` script that runs the TypeScript. `tsconfig.json` compiles
          # with rootDir "./", so src/db sits two levels below the package root and
          # dist/src/db sits three — a migrations path computed with a fixed number
          # of `..` segments therefore WORKS from source and resolves to
          # dist/drizzle in the image. Exercising only the source path would pass
          # against exactly that bug. This is also what a deploy actually runs.
          # Written into the backend package so `require("postgres")` resolves
          # from the generated app's own node_modules — this deliberately uses the
          # driver the app already depends on rather than `psql`, since a runner
          # image is not guaranteed to ship the PostgreSQL client and a missing
          # binary here would read as a failed migration.
          cat > assert-db.cjs <<'ASSERT'
          const postgres = require('postgres');
          const expectedLedgerRows = Number(process.argv[2]);

          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          const problems = [];

          (async () => {
            const [{ notes }] = await sql`select to_regclass('public.notes')::text as notes`;
            const [{ applied }] = await sql`select count(*)::int as applied from drizzle.__drizzle_migrations`;
            await sql.end();

            if (notes !== 'notes') problems.push(`notes table absent after migrating (to_regclass => ${notes})`);
            if (applied !== expectedLedgerRows) {
              problems.push(`expected ${expectedLedgerRows} ledger row(s), found ${applied}`);
            }
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(problems.length === 0 ? 0 : 1);
          })().catch((error) => {
            console.error(`::error::${error.message}`);
            process.exit(1);
          });
          ASSERT

          node dist/src/db/migrate.js --target-database=smoke_app_ci
          node assert-db.cjs 1

          # Re-running is a clean no-op, not a second apply.
          node dist/src/db/migrate.js --target-database=smoke_app_ci
          node assert-db.cjs 1

          # And the guard that does not fail loudly on its own: pointed at the
          # wrong database a migrator finds an empty ledger, applies everything,
          # prints "Applied N" and exits 0. It must REFUSE instead.
          if node dist/src/db/migrate.js --target-database=some_other_database; then
            echo "::error::the migrator accepted a target that is not the connected database"; exit 1
          fi

      - name: db:generate reports no drift on a fresh scaffold
        working-directory: ${{ runner.temp }}/smoke-app/packages/backend
        env:
          DATABASE_URL: postgres://smoke:smoke@127.0.0.1:5432/smoke_app_ci
        run: |
          set -euo pipefail
          # If the shipped snapshot disagreed with the shipped schema, every app
          # generated from this template would start life with a phantom migration
          # its first `db:generate` invents. Compare the whole drizzle/ tree by
          # checksum rather than trusting drizzle-kit's summary line.
          before=$(find drizzle -type f | sort | xargs md5sum | md5sum)
          bun run db:generate
          after=$(find drizzle -type f | sort | xargs md5sum | md5sum)
          if [ "$before" != "$after" ]; then
            echo "::error::db:generate changed drizzle/ on a fresh scaffold — the shipped snapshot does not match the shipped schema"
            exit 1
          fi

      - name: Export web
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: bunx expo export --platform web

      - name: Prebuild android + assert shared identity wiring
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          bunx expo prebuild --platform android --no-install
          grep -q 'android:sharedUserId="so.oxy.shared"' android/app/src/main/AndroidManifest.xml
          grep -q 'so.oxy.shared.permission.READ_IDENTITY' android/app/src/main/AndroidManifest.xml
          grep -q 'android.compileSdkVersion=36' android/gradle.properties

      - name: Prebuild ios + assert keychain group
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          bunx expo prebuild --platform ios --no-install
          grep -q 'group.so.oxy.shared' ios/*/*.entitlements
