# Nightly (and on scaffolder/preset changes) end-to-end smoke of create-oxy-app:
# generate a full app, install, typecheck, build the backend, apply its
# migrations to a real PostgreSQL server, export web, and prebuild native —
# catching drift against the live Oxy SDK + Expo SDK.
name: scaffold-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
  pull_request:
    paths:
      - 'packages/create-oxy-app/**'
      - 'packages/app-preset/**'
      - 'packages/contracts/**'
      - 'packages/core/**'
      - 'packages/services/**'

# Least privilege: this workflow only reads the repo (no writes, no packages).
permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04-arm

    services:
      # The database the generated backend migrates against. Pinned to the SAME
      # image and mapped to the SAME port as the docker-compose.postgres.yml the
      # scaffold ships, and seeded with the user/database that template's
      # .env.example points at — so the migration steps below use the generated
      # .env verbatim instead of a CI-only connection string that could pass
      # while the shipped default is wrong.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smokeapp
          POSTGRES_PASSWORD: smokeapp
          POSTGRES_DB: smokeapp_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U smokeapp -d smokeapp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install monorepo deps
        run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Build the create-oxy-app CLI
        run: bun run --cwd packages/create-oxy-app build

      - name: Run the CLI unit tests
        run: bun run --cwd packages/create-oxy-app test

      - name: Pack + install the scaffolder from its tarball
        run: |
          # Run the scaffolder from its PACKED tarball, not the repo tree, so the
          # template file set exercised here is exactly what `bun publish` ships.
          # This catches template files the packer silently strips (e.g. a literal
          # `templates/base/bunfig.toml` — bun/npm exclude that exact name, which
          # once shipped a scaffold whose `bun install` failed).
          bun pm pack --cwd packages/create-oxy-app --destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/cli" && cd "$RUNNER_TEMP/cli"
          echo '{"name":"coa-runner","private":true}' > package.json
          bun add "$RUNNER_TEMP"/create-oxy-app-*.tgz

      - name: Build + pack the generated app's Oxy dependencies from HEAD
        run: |
          # A workspace release may be unpublished at HEAD, so the generated app
          # must take every Oxy package it names from this checkout. This also
          # breaks the release chicken-and-egg: smoke must pass before merge, and
          # publication is allowed only from the exact green main commit.
          #
          # Install from PACKED TARBALLS rather than `file:` source directories: bun
          # materializes a `file:` DIRECTORY dependency as a tree of symlinks back
          # to that directory, and node resolves a symlinked module to its realpath.
          # A tarball is extracted as real files, exactly like a registry install,
          # and exercises each package's publish-time workspace-range rewriting and
          # `files` list. create-oxy-app's build already built contracts/core;
          # services needs its publishable lib output before packing.
          bun run --cwd packages/services build
          for package in contracts core services app-preset; do
            bun pm pack --cwd "packages/$package" --destination "$RUNNER_TEMP"
          done

      - name: Scaffold a test app (from the packed tarball)
        run: |
          node "$RUNNER_TEMP/cli/node_modules/create-oxy-app/dist/index.js" "$RUNNER_TEMP/smoke-app" \
            --yes --no-register --no-git --no-install \
            --name "Smoke App" --slug smoke-app --scheme smokeapp \
            --bundle-id com.example.smokeapp --domain api.smoke.example.com

      - name: Assert the scaffold ships a hoisted-linker bunfig.toml
        run: |
          # Isolated linker (bun's default) does not hoist @oxyhq/app-preset to
          # the root node_modules, so shared-types' tsconfig extends fail. The
          # generated app MUST carry bunfig.toml with the hoisted linker.
          grep -q 'linker = "hoisted"' "$RUNNER_TEMP/smoke-app/bunfig.toml"

      - name: Assert the Postgres pieces rendered
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          # The file set a Postgres backend cannot start without. Checked against
          # the scaffold produced by the PACKED tarball, so a template file the
          # packer strips (or one nobody added to `files`) fails here rather than
          # in somebody's first `bun run db:migrate`.
          for f in docker-compose.postgres.yml \
                   packages/backend/drizzle.config.ts \
                   packages/backend/drizzle/meta/_journal.json \
                   packages/backend/src/db/postgres.ts \
                   packages/backend/src/db/migrate.ts \
                   packages/backend/src/db/migrationsFolder.ts \
                   packages/backend/src/db/schema/index.ts; do
            test -f "$f" || { echo "::error::scaffold is missing $f"; exit 1; }
          done
          test ! -e packages/backend/src/config/database.ts
          ! grep -rniE 'mongo' . --exclude-dir=node_modules
          docker compose -f docker-compose.postgres.yml config -q

      - name: Install the generated app with packed Oxy HEAD dependencies
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          # Override direct and transitive Oxy dependencies with the tarballs
          # packed above. This tests HEAD as a registry consumer without publishing
          # an unmerged package merely to make the pre-merge smoke resolvable.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = process.env.RUNNER_TEMP;
            const packed = [
              ["@oxyhq/contracts", /^oxyhq-contracts-.*\.tgz$/],
              ["@oxyhq/core", /^oxyhq-core-.*\.tgz$/],
              ["@oxyhq/services", /^oxyhq-services-.*\.tgz$/],
              ["@oxyhq/app-preset", /^oxyhq-app-preset-.*\.tgz$/],
            ];
            const files = fs.readdirSync(dir);
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const [name, pattern] of packed) {
              const matches = files.filter((file) => pattern.test(file));
              if (matches.length !== 1) {
                throw new Error(`expected exactly one packed ${name} tarball in ${dir}, found ${matches.length}`);
              }
              const local = "file:" + path.join(dir, matches[0]);
              p.overrides[name] = local;
              p.resolutions[name] = local;
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          bun install --ignore-scripts
          bun run build:shared-types

      - name: Assert the app's Metro config stays inside the generated app
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          # Every absolute path the preset bakes into the Metro config must point
          # inside the generated app. Metro can only resolve files under
          # projectRoot + watchFolders, so a path that escapes to this checkout
          # fails the bundle 30s in with an opaque "Unable to resolve module
          # <abs path>". emptyModulePath is the canonical victim: metro-config
          # computes it with require.resolve at config-build time, so it lands
          # wherever the preset's own require chain was rooted.
          node -e '
            const path = require("path");
            const appRoot = path.resolve("../..") + path.sep;
            const assertInsideApp = (label, target) => {
              if (!target.startsWith(appRoot)) {
                throw new Error(label + " escaped the generated app: " + target);
              }
            };
            assertInsideApp("@oxyhq/app-preset", require.resolve("@oxyhq/app-preset/metro"));
            assertInsideApp("resolver.emptyModulePath", require("./metro.config.js").resolver.emptyModulePath);
          '

      - name: Lockfile is stable (no churn on re-install)
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          cp bun.lock bun.lock.before
          bun install --ignore-scripts
          diff -q bun.lock.before bun.lock

      - name: Typecheck the frontend
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run --cwd packages/frontend typecheck

      - name: Build the backend
        working-directory: ${{ runner.temp }}/smoke-app
        run: bun run --cwd packages/backend build

      - name: Migrations apply to a real Postgres from zero
        working-directory: ${{ runner.temp }}/smoke-app
        run: |
          set -euo pipefail
          # The generated .env verbatim — the shipped DATABASE_URL is what the
          # service container above was configured to match.
          cp packages/backend/.env.example packages/backend/.env

          # The whole point: a freshly scaffolded app has a schema that applies
          # to an empty database with no hand-editing first.
          bun run db:migrate --target-database=smokeapp_dev

          # Re-running must be a no-op, not a second apply.
          bun run db:migrate --target-database=smokeapp_dev 2>&1 | tee /tmp/second.log
          grep -q 'No migrations to apply' /tmp/second.log

          # The shipped snapshot must agree with the shipped schema, or the first
          # `db:generate` a developer runs re-emits a migration for the table
          # that already exists.
          bun run db:generate 2>&1 | tee /tmp/generate.log
          grep -q 'No schema changes' /tmp/generate.log
          # Independent of that message: drizzle-kit must not have written a
          # second migration file.
          test "$(find packages/backend/drizzle -maxdepth 1 -name '*.sql' | wc -l)" -eq 1

          # The DDL really landed — `Applied 1` above is the migrator's own
          # report, so ask the server instead.
          cd packages/backend && bun -e '
            const { default: postgres } = await import("postgres");
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            const rows = await sql`select column_name from information_schema.columns where table_name = ${"notes"} order by column_name`;
            await sql.end();
            const names = rows.map((r) => r.column_name);
            console.log("notes columns:", names.join(", "));
            // Casing is the invariant: the column is declared `oxyUserId` in TS
            // and must exist as `oxy_user_id`, or queries reference columns the
            // migrations never created.
            if (!names.includes("oxy_user_id")) throw new Error("DATABASE_CASING did not reach the DDL");
          '
        env:
          DATABASE_URL: postgres://smokeapp:smokeapp@127.0.0.1:5437/smokeapp_dev

      - name: The migration guards actually refuse
        working-directory: ${{ runner.temp }}/smoke-app/packages/backend
        run: |
          set -uo pipefail
          # A gate that cannot fail is worse than no gate. `--target-database` is
          # the guard whose ABSENCE is silent: pointed at the wrong database a
          # migrator finds an empty ledger, applies everything and exits 0.
          if bun run src/db/migrate.ts --phase=all > /tmp/noflag.log 2>&1; then
            echo "::error::db:migrate accepted a run with no --target-database"; exit 1
          fi
          # And the compiled bundle must resolve its migrations folder too — the
          # source and dist entrypoints sit at different depths, so a fixed
          # relative path is right for one and silently wrong for the other.
          node -e '
            const fs = require("fs");
            const { MIGRATIONS_FOLDER } = require("./dist/src/db/migrationsFolder.js");
            if (!fs.existsSync(MIGRATIONS_FOLDER + "/meta/_journal.json")) {
              throw new Error("dist resolved a migrations folder with no journal: " + MIGRATIONS_FOLDER);
            }
          '
        env:
          DATABASE_URL: postgres://smokeapp:smokeapp@127.0.0.1:5437/smokeapp_dev

      - name: Export web
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: bunx expo export --platform web

      - name: Prebuild android + assert shared identity wiring
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          bunx expo prebuild --platform android --no-install
          grep -q 'android:sharedUserId="so.oxy.shared"' android/app/src/main/AndroidManifest.xml
          grep -q 'so.oxy.shared.permission.READ_IDENTITY' android/app/src/main/AndroidManifest.xml
          grep -q 'android.compileSdkVersion=36' android/gradle.properties

      - name: Prebuild ios + assert keychain group
        working-directory: ${{ runner.temp }}/smoke-app/packages/frontend
        run: |
          bunx expo prebuild --platform ios --no-install
          grep -q 'group.so.oxy.shared' ios/*/*.entitlements
