name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Gates the rollout logic that deploy-aws.yml runs against production. Mirrors
  # Mention's "Verify deployment transaction safeguards" step -- the two repos
  # share this script, so they share its test.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-verify-reused-service-credential.sh
          bash .github/scripts/test-put-secure-parameter.sh
          bash .github/scripts/test-run-native-product-agent-bootstrap.sh
          node scripts/test-check-kaana-dns-boundary.mjs
          node scripts/check-kaana-dns-boundary.mjs
          node scripts/test-service-credential-workflow-ids.mjs
          node scripts/test-native-product-agent-bootstrap-workflow.mjs
          node scripts/test-check-kaana-request-v2-rollout.mjs
          node scripts/check-kaana-request-v2-rollout.mjs

  # API Package Tests
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A BACKSTOP, not a budget: the two steps that can actually run long carry
    # their own caps (16m for the ffmpeg install, 45m for the serial shards),
    # and this is their sum plus the ~5m the fixed steps cost at their observed maxima
    # (containers 35s, checkout/bun/node/node-gyp 19s, install 30s, guards 10s,
    # build 50s, lint 20s, coverage merge/artifact 8s). So a step cap always fires
    # first, and this can only catch a runner wedged OUTSIDE a step.
    #
    # That ordering is the point. A job-level timeout reports `cancelled`,
    # indistinguishable from a genuine supersession without comparing
    # `completed_at - started_at` against the cap. Three runs hit the old cap on
    # 2026-08-17 — two cut mid-suite, one that never reached a test at all — and
    # all three read as "superseded, ignore". A step-level timeout instead
    # reports `failure` against a named step.
    #
    # Measured over 118 recent runs (109 passing): p50 20m57s, p95 23m44s, max
    # on a passing run 26m29s, sd 2m23s. The old 30m cap sat 1.13x that max, so
    # the ffmpeg step's heavy tail alone was enough to blow it.
    timeout-minutes: 66

    services:
      # Postgres target of the Mongo->Postgres port. Mirrors
      # docker-compose.dev.yml so a developer's local database and CI's agree.
      #
      # PostGIS, not plain Postgres: `user_locations.geo` is a generated
      # `geography` column, so `CREATE EXTENSION postgis` must succeed before the
      # migration that names the type — `bun run db:migrate` runs it first
      # (packages/api/src/db/extensions.ts). Pinned on BOTH versions: Postgres 17
      # to match RDS, PostGIS 3.5 because the schema depends on `ST_MakePoint`
      # and the `geography` cast being IMMUTABLE.
      #
      # NOTE: the image seeds PostGIS into POSTGRES_DB and a `template_postgis`
      # template, NOT into `template1` — and the jest harness creates each
      # throwaway database from `template1`. The image is necessary; the
      # migrate-time `CREATE EXTENSION` is what actually makes each database
      # usable.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: oxy
          POSTGRES_PASSWORD: oxy
          POSTGRES_DB: oxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxy -d oxy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # ONE test file decodes a real clip and therefore needs a real ffmpeg on
      # PATH: `routes/__tests__/cdnVideoImageVariant.test.ts`, whose fixture
      # builder shells out to a bare `ffmpeg` to synthesise the H.264 sample. The
      # API image installs it explicitly (`apk add ffmpeg` in the Dockerfile) and
      # that test depends on it just as explicitly.
      #
      # `ffmpeg-static` is a dependency of packages/api and does NOT make this
      # redundant: it fetches its binary from a postinstall script, bun runs no
      # postinstall for a package outside `trustedDependencies`, and it is not in
      # that list — so `node_modules/ffmpeg-static` holds no binary and
      # `variantService`'s `which ffmpeg` fallback is the path taken here.
      #
      # The runner image does NOT ship ffmpeg — it is absent from the
      # ubuntu-24.04 apt manifest — so this genuinely installs it every run, and
      # that install is the job's single most volatile step. Over 54 recent
      # successful runs: p50 24s, p90 2m01s, p95 5m22s, max 6m54s. On run
      # 32072687979 it hung for 29m44s and the job's own timeout cancelled it
      # with every later step skipped — 6,000+ tests never ran, and the job
      # reported `cancelled`, which reads as "superseded, ignore".
      #
      # `sudo timeout`, NOT `timeout sudo`, and that ordering is the whole fix for
      # run 32302745954, which took main red and blocked every open PR. Attempt 1
      # held /var/lib/apt/lists/lock and stalled mid-download; `timeout` then
      # killed the unprivileged half of the pipeline — `sudo` and `bash` — and
      # could not touch `apt-get`, because an unprivileged process may not signal
      # a root one and sudo does not relay a signal raised inside the command's
      # own process group. The orphaned root apt-get kept the lock, so the retry
      # five seconds later failed instantly against its OWN predecessor:
      # `Could not get lock /var/lib/apt/lists/lock. It is held by process 2659
      # (apt-get)`. Measured in an ubuntu:24.04 container against a forked child:
      # with `timeout` outside `sudo` the root child is still running after the
      # timeout fires; with `sudo timeout` nothing survives — so the lock is free
      # by the time the retry runs, whoever held it.
      #
      # `DPkg::Lock::Timeout` is on the install and deliberately NOT on the
      # update. Measured on apt 2.8.3 (noble, the runner's own version) and on
      # 3.0.3: it makes apt wait for /var/lib/dpkg/lock-frontend, and it is inert
      # for /var/lib/apt/lists/lock and /var/cache/apt/archives/lock, which both
      # still fail in under a second with the option set. It is not the fix for
      # the lock this step actually lost — the retry is — and putting it on the
      # update would read as protection it does not provide.
      #
      # Four nested bounds, innermost first:
      #   * apt's own per-connection timeout and retries. This is the surgical
      #     one: it abandons a DEAD mirror connection after 15s while leaving a
      #     slow-but-progressing transfer alone, which is exactly the difference
      #     between the 29m44s hang and the legitimate 6m54s run.
      #   * `DPkg::Lock::Timeout` for the one lock apt will wait on.
      #   * an outer `timeout` per attempt, retried once. 420s covers the slowest
      #     install observed on a passing run, so the retry only ever fires for
      #     something already anomalous, and `-k 15s` guarantees the locks are
      #     released rather than merely asked for.
      #   * `timeout-minutes` as the backstop. 2 x (420s + 15s) + 30s backoff =
      #     15m00s, so the 16m cap below can only fire if the loop itself wedges.
      #
      # The point of all four is that a bad mirror costs one bounded retry that
      # can actually succeed, and the suite still runs — and if it does fail, it
      # fails as `failure` on a named step rather than as an ambiguous job-level
      # `cancelled`.
      - name: Install ffmpeg (video variant tests)
        timeout-minutes: 16
        run: |
          set -eu
          apt_opts='-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15'
          for attempt in 1 2; do
            if sudo timeout -k 15s 420s bash -c \
              "apt-get update $apt_opts && apt-get install -y --no-install-recommends $apt_opts -o DPkg::Lock::Timeout=120 ffmpeg"; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::apt-get could not install ffmpeg after 2 attempts"
              exit 1
            fi
            # Names the lock holder in the log, so the next failure of this step
            # says whether it was our own attempt or something the runner boots.
            echo "apt-get attempt $attempt failed or timed out; retrying once. apt/dpkg processes still alive:"
            ps -eo pid,user,etimes,stat,args | grep -E '[a]pt-get|[d]pkg|[u]nattended' || echo "  (none)"
            sleep 30
          done
          ffmpeg -version | head -1
          ffprobe -version | head -1
          # The positive control, and the reason the two lines above are not one:
          # without `pipefail` a pipeline reports `head`'s status, so `ffmpeg
          # -version | head -1` exits 0 even when the binary is missing entirely —
          # this step could go green having installed nothing. Encoding one frame
          # the way the fixture builder does (`-f lavfi testsrc`, `-c:v libx264`)
          # is the cheapest assertion that what apt installed can do the one thing
          # the suite needs, and it fails loudly if it cannot.
          probe_dir=$(mktemp -d)
          ffmpeg -hide_banner -loglevel error -f lavfi \
            -i testsrc=size=64x64:rate=10:duration=1 \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart -y "$probe_dir/probe.mp4"
          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$probe_dir/probe.mp4")
          rm -rf "$probe_dir"
          if [ "$codec" != h264 ]; then
            echo "::error::ffmpeg is on PATH but encoded '$codec', not h264 — the video variant fixture cannot be built"
            exit 1
          fi
          echo "ffmpeg encodes h264 via lavfi: the video variant fixture can be built"

      - name: Install dependencies
        run: bun install --frozen-lockfile --minimum-release-age=0
      # Before the builds and the suite, and needing neither: it reads the tracked
      # file listing. The backfill, 82 Mongoose models and the mongoose dependency
      # were removed on 2026-08-08 and `oxy-prod` is gone, so a Mongo reference is
      # now always a mistake — and it would arrive as a hoisted transitive or a
      # stray env name, neither of which breaks a build.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo

      # Same shape, same reason, one layer up. The switcher's flat account list
      # was replaced by the server's device directory (ADR 0002, issue #937), and
      # it would come back the way the Mongo references would: one surface
      # reaching for `listAccounts()` because it is right there, one hook
      # flattening the grouped rows. None of that fails a build on its own.
      - name: Guard against the flat account list returning
        run: bun run validate:no-flat-account-list

      # AGENTS.md is prepended to EVERY agent session, so its bytes are paid on
      # every task forever. It reached 152 KB here by accretion — a mechanism
      # write-up appended by the branch that shipped it, none wrong on its own
      # and none visible except in the sum. Same family as the two guards above:
      # nothing breaks, which is why it survives. Reads the tracked file listing
      # and nothing else, and covers the create-oxy-app template too, so every
      # scaffolded app is born bounded.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md

      # api tests resolve `@oxyhq/core` (e.g. `registrableApex` in federation
      # helpers) from its published `dist`, like any normal dependency.
      # This job does not build workspace deps, so core's `dist` is absent on a
      # fresh checkout → `Cannot find module '@oxyhq/core'`. Build core (and its
      # own deps `@oxyhq/contracts` and `@oxyhq/protocol`, which core's tsc build
      # needs) in topological order so the import resolves.
      # `@oxyhq/contracts`/`@oxyhq/core/server` are still mapped to source in
      # jest.config.js; this only provides the bare `@oxyhq/core` dist.
      #
      # `@oxyhq/db` is here for a DIFFERENT reason, and a mapper entry cannot
      # replace it. `jest.globalSetup.ts` provisions each worker's database by
      # SPAWNING `bun run db:migrate` — a separate process, which jest's
      # `moduleNameMapper` does not reach — and `src/db/migrate.ts` imports
      # `@oxyhq/db/migrate`. Every entry point in that package resolves into
      # `dist/`, which is gitignored and produced by no install hook, so
      # without this build the job dies in global setup with
      # `Cannot find module '@oxyhq/db/migrate'` before a single test file
      # loads. Verified by deleting `packages/db/dist` and running the suite.
      - name: Build core SDK, MCP + db (for resolution in api tests)
        run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
          bun run --filter @oxyhq/mcp build
          bun run --filter @oxyhq/db build

      - name: Run linter
        run: bun run lint
        working-directory: ./packages/api

      - name: Test native coverage gate
        run: bun run test:coverage-merge
        working-directory: ./packages/api

      # `jest.config.js` sizes its worker pool from this machine's cores and RAM,
      # because a fixed count that fits a 32-core workstation exhausts a
      # 4-vCPU/16-GiB runner: the kernel takes the runner down mid-run and the
      # job ends in exit 143 having printed no test results at all, which reads
      # like a hung test rather than an exhausted machine. Print what it decided
      # and what it decided it from, so the next time that shape changes the
      # evidence is already in the log.
      - name: Report test parallelism
        run: |
          node -e "const os=require('node:os');console.log('cpus=%d totalmem=%s GiB maxWorkers=%d',os.cpus().length,(os.totalmem()/1073741824).toFixed(1),require('./jest.config.js').maxWorkers)"
        working-directory: ./packages/api

      # Keep three shards SERIAL. Run 33581098336 proved that the one stable
      # Jest process can reach Node's default 4-GiB old-space limit after 202
      # suites (4065.5 MiB before the fatal GC) while the runner still has 15.6
      # GiB. Raising maxWorkers is not available: two Node 24.20.0 measurements
      # crashed a worker inside V8, which is why jest.workerCount.cjs pins one.
      # `workerIdleMemoryLimit` cannot recycle that in-band process either.
      #
      # Jest's native sharder partitions the current 415 files 139/138/138 with
      # no overlap or omission. Running those partitions in separate processes
      # bounds retained transform/coverage state without hiding a test, changing
      # instrumentation, or allowing three 4-GiB heaps to coexist. Each shard
      # writes its own JSON and lcov report; the following native gate validates
      # and merges all three. The historical unsharded suite max was 20m57s; two extra
      # global setups do not fit the historical unsharded 30-minute cap: run
      # 33584690054 reached the third shard with every completed test passing,
      # then GitHub stopped the step at exactly 30 minutes. Forty-five minutes
      # keeps a finite hang backstop while giving the measured serial process a
      # 1.5x margin; it does not increase a heap or run heaps concurrently.
      - name: Run tests with coverage
        timeout-minutes: 45
        run: |
          for shard_index in 1 2 3; do
            echo "Running API coverage shard ${shard_index}/3"
            bun run test:coverage -- \
              --shard="${shard_index}/3" \
              --coverageDirectory="coverage/shard-${shard_index}" \
              --coverageReporters=json \
              --coverageReporters=lcovonly \
              --coverageReporters=text-summary
          done
        working-directory: ./packages/api
        env:
          DATABASE_URL: postgres://oxy:oxy@127.0.0.1:5432/oxy_test
          ACCESS_TOKEN_SECRET: test_access_token_secret_minimum_32_characters
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_minimum_32_characters
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test_aws_access_key
          AWS_SECRET_ACCESS_KEY: test_aws_secret_key
          AWS_S3_BUCKET: test-bucket
          NODE_ENV: test

      - name: Merge coverage and enforce global floors
        run: |
          for shard_index in 1 2 3; do
            for report in coverage-final.json lcov.info; do
              report_path="coverage/shard-${shard_index}/${report}"
              if [ ! -s "$report_path" ]; then
                echo "::error file=${report_path}::Expected non-empty coverage report"
                exit 1
              fi
            done
          done
          bun run coverage:merge
        working-directory: ./packages/api

      - name: Upload merged coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: ./packages/api/coverage/merged
          if-no-files-found: error
          retention-days: 14

  # Build check
  api-build:
    name: API Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Build TypeScript
        run: bun run build
        working-directory: ./packages/api

      # `packages/api/scripts/**` (the seed / credential / codegen one-shots) is
      # NOT part of the build program: `tsconfig.json` pins `rootDir` to `src` so
      # `dist/` mirrors `src/`, which leaves those files with zero type
      # coverage. `tsconfig.scripts.json` typechecks them (noEmit) against the
      # same settings. It runs here, after `bun run build`, because that script
      # already builds every workspace dep the program needs — @oxyhq/contracts,
      # @oxyhq/protocol, @oxyhq/core, @oxyhq/federation, @oxyhq/db and @oxyhq/mcp
      # (src/services/
      # federation.service.ts imports it; without its dist this fails TS2307).
      - name: Typecheck one-shot scripts
        run: bun run typecheck:scripts
        working-directory: ./packages/api

      # The TypeScript schema and the migration snapshot chain must describe the
      # same database.
      #
      # 0018 and 0019 were hand-written with no `meta/*_snapshot.json`, so the
      # chain stopped describing the database two migrations early. Nothing
      # failed then; the NEXT generate emitted `CREATE TABLE follow_namespaces`
      # and five already-applied constraints, which would have failed the
      # pre-deploy migration one-shot in production — the one place a failure
      # stops a release rather than degrading it. A human caught it by reading
      # the generated file instead of trusting it, which is not a control.
      #
      # Here rather than in `migration-phases` because this needs `drizzle-kit`,
      # and that job deliberately runs with NO install at all — a property its
      # own fixture test asserts. DATABASE_URL is only for drizzle-kit's config;
      # the generate never connects.
      - name: Schema and snapshots agree
        run: bun scripts/check-drizzle-snapshot-sync.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  # bun.lock must match the package.json files (see scripts/check-lockfile-sync.mjs).
  #
  # Deliberately NOT `bun install --frozen-lockfile --minimum-release-age=0`: measured on bun 1.3.14
  # against this repo, that flag exits 0 on both shapes of desync we actually
  # shipped (a workspace `version` bump, and a widened-but-satisfiable dependency
  # range). It would have caught none of the three incidents while reading like
  # enforcement. The script regenerates the lockfile and asks git whether the
  # file moved, which is the same question without bun's judgement in the middle.
  lockfile-sync:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The gate's own fixture tests. Offline (every fixture dependency resolves
      # through the workspace protocol) and the reason the manifest-comparison
      # layer cannot be dropped without something going red.
      - run: bun scripts/test-check-lockfile-sync.mjs
      - run: bun scripts/check-lockfile-sync.mjs

  # Every secret the API needs at boot must actually reach SSM
  # (see scripts/check-deploy-secrets-sync.mjs).
  #
  # deploy-aws.yml syncs GitHub secrets through two hand-maintained allowlists,
  # and a name missing from either is silent: nothing is written, the deploy is
  # green, and the ECS task later fails to start with
  # `ResourceInitializationError: unable to pull secrets`. DATABASE_URL was in
  # neither. Runs here rather than in the deploy workflow so the mismatch is
  # caught on the pull request, before anything is pushed to main.
  deploy-secrets-sync:
    name: Deploy Secrets Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The gate's own fixture tests — mutated copies of the real workflow and
      # env module. No install: the gate reads files and shells out to nothing.
      - run: bun scripts/test-check-deploy-secrets-sync.mjs
      - run: bun scripts/check-deploy-secrets-sync.mjs

  # No issued credential material in tracked source (see scripts/check-secret-scan.mjs).
  #
  # Nothing scanned source for secrets before #972 workstream 12: no gitleaks, no
  # trufflehog, no detect-secrets, no CodeQL config, no pre-commit hook — while
  # `packages/api/.env` was once committed with live JWT secrets in it.
  #
  # Deliberately not gitleaks: the maintained action is licensed per organisation
  # for private repositories, a pinned release binary adds a network dependency and
  # a checksum to a job whose value is determinism, and a `.gitleaks.toml`
  # allow-list cannot carry the exact-count assertion this repository's gate
  # convention requires. The scanner's own header states what it therefore does NOT
  # cover, measured on this tree.
  #
  # No install: the gate reads `git ls-files` and file bytes and shells out to
  # nothing, which its fixture test asserts by running against trees that have no
  # node_modules at any level.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Only reads the checkout. CodeQL's `actions/missing-workflow-permissions`
    # flagged the absent default; scoped here rather than at workflow level,
    # because a workflow-wide block would silently re-scope the token of every
    # other job in this file, including the coverage artifact upload.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The gate's own fixture tests, run before the gate — one planted-secret case
      # per rule, built from the rule set the gate itself emits, plus the cases
      # proving it does NOT fire on this tree's deliberate placeholder credentials.
      - run: bun scripts/test-check-secret-scan.mjs
      - run: bun scripts/check-secret-scan.mjs

  # No column in the persisted schema can hold a prompt, a completion, a chat
  # message body or a tool argument (see scripts/check-no-payload-persistence.mjs
  # and docs/adr/0016-no-inference-payload-persistence.md).
  #
  # ADR 0016's decision is a REFUSAL, and a refusal with nothing enforcing it is a
  # sentence in a document. The census reads the drizzle schema barrel — the same
  # module `drizzle.config.ts` generates migrations from, so a table it misses gets
  # no migration — and requires every open-shaped column to declare what it holds.
  #
  # Its own job rather than a step inside `api-test` so the check has a NAME in the
  # required set: `check-ci-complete.mjs` then refuses a run where it is not a
  # dependency of `CI complete`. It needs `@oxyhq/contracts` and `@oxyhq/db` built
  # because the schema modules import them; nothing else.
  schema-policy:
    name: Schema Payload Policy
    runs-on: ubuntu-latest
    # Only reads the checkout. CodeQL's `actions/missing-workflow-permissions`
    # flagged the absent default; scoped here rather than at workflow level,
    # because a workflow-wide block would silently re-scope the token of every
    # other job in this file, including the coverage artifact upload.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/db build
      # The guard's own fixture schemas — a planted payload column per banned
      # pattern, and the narrowness cases proving it does not fire on the boolean
      # capability flags or on the product's own free-text columns.
      - run: bun scripts/test-check-no-payload-persistence.mjs
      - run: bun scripts/check-no-payload-persistence.mjs

  # `packages/console` hand-duplicates the API's two permission vocabularies, and
  # NOTHING can make that drift a compile error: `@oxyhq/core` types the wire field
  # `AccountMember.permissions` as `string[]`, so no API type ever flows into
  # Console's unions, which are consumed only as parameter types whose call sites
  # pass literals Console itself wrote. #1032 added eleven `inference:*` strings
  # Console never learned, and `tsc --noEmit` stayed green over all of it.
  #
  # Its own job rather than a step inside `console-test` so the check has a NAME in
  # the required set: `check-ci-complete.mjs` then refuses a run where it is not a
  # dependency of `CI complete`. `bun install` is for `typescript`, which reads the
  # Console type aliases with the real compiler instead of a regex; the API module
  # the gate imports has no dependencies of its own, so nothing needs building.
  permission-vocabulary:
    name: Permission Vocabulary
    runs-on: ubuntu-latest
    # Only reads the checkout. CodeQL's `actions/missing-workflow-permissions`
    # flagged the absent default; scoped here rather than at workflow level,
    # because a workflow-wide block would silently re-scope the token of every
    # other job in this file, including the coverage artifact upload.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      # The gate's own fixture cases, run before the gate — both directions of
      # drift, the vacuity floor on a pair of sets that agree perfectly, and a
      # permission named only in an apostrophe-heavy doc comment, which is what a
      # regex census reads as a match that does not exist.
      - run: bun scripts/test-check-permission-vocabulary.mjs
      - run: bun scripts/check-permission-vocabulary.mjs

  # No source in this monorepo reads a raw client IP, and nothing reads one inside
  # a rate limiter's options at all (see scripts/check-no-raw-ip-keys.mjs).
  #
  # Oxy persists no user IP in any form; anonymous rate-limit keys are the one
  # transient exception and must go through `hashedIpKey`. `packages/api/src/routes/store.ts`
  # broke that without touching the invariant's own code: an account-keyed
  # limiter mounted BEFORE `authMiddleware`, so its `?? req.ip` fallback was the
  # only branch that ever ran and every store write minted a Redis key holding a
  # raw address. Nothing in the limiter's own source says so — the bug is the
  # order of two arguments two hundred lines away — which is why this is a census
  # of the flat fact (is there a raw IP anywhere?) rather than a review.
  #
  # Its own job rather than a step inside `api-test` so the check has a NAME in the
  # required set: `check-ci-complete.mjs` then refuses a run where it is not a
  # dependency of `CI complete`. `bun install` is for `typescript`, which reads the
  # source with the real parser instead of a regex — necessary because most textual
  # `req.ip` hits on this tree are comments. Nothing needs building.
  raw-ip-keys:
    name: Raw Client IP Guard
    runs-on: ubuntu-latest
    # Only reads the checkout. CodeQL's `actions/missing-workflow-permissions`
    # flagged the absent default; scoped here rather than at workflow level,
    # because a workflow-wide block would silently re-scope the token of every
    # other job in this file, including the coverage artifact upload.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      # The gate's own fixture cases, run before the gate — the original store.ts
      # keyGenerator verbatim, every banned member and header, both directions of
      # allow-list drift, the vacuity floors, and a file naming every banned
      # spelling only in comments, which is what a regex census cannot survive.
      - run: bun scripts/test-check-no-raw-ip-keys.mjs
      - run: bun scripts/check-no-raw-ip-keys.mjs

  # Two questions about the same journal, both answerable with no database:
  # whether each migration says which side of a deploy it belongs on, and whether
  # the order it is listed in can apply at all.
  #
  # 0013_users_account_categories reached production ahead of the column it adds,
  # because deploy-aws.yml had no migration step and the ordering lived in a
  # human's head across two manual dispatches. The deploy now applies migrations
  # itself; this job is what stops that from being silently disarmed — deleting
  # one `RUN_MIGRATIONS: 'true'` line reproduces the outage exactly, with a green
  # deploy and no other symptom.
  #
  # `check-migration-journal-order.mjs` covers the other half. A migration is
  # applied only when its journal `when` is strictly newer than the newest already
  # recorded, and `drizzle-kit generate` stamps that from the local wall clock, so
  # a regenerate-after-rebase can land below a sibling that already merged. Twice
  # in one day (`ce0eccc8`, then PR #997) that produced a migration nothing would
  # ever run. `@oxyhq/db`'s `planLedgerRun` does refuse it — but only in the
  # production one-shot, after the pull request has merged, where the cost is a
  # blocked release. Both gates here were mutation-tested against the real journal
  # and this one goes RED on a swap that leaves `check-migration-phases.mjs` green.
  #
  # Runs on the pull request, before anything is pushed to main, and needs no
  # install: both gates and the marker reader touch only node builtins, which each
  # gate's fixture test asserts with a tree that has no node_modules at any level.
  migration-phases:
    name: Migration Journal and Deploy Phases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Each gate's own fixture tests — mutated copies of the real journal,
      # migrations, deploy workflow and deploy script.
      - run: bun scripts/test-check-migration-phases.mjs
      - run: bun scripts/check-migration-phases.mjs
      - run: bun scripts/test-check-migration-journal-order.mjs
      - run: bun scripts/check-migration-journal-order.mjs

  # DB package tests (Jest — Postgres service for the live suites that are
  # always-skipped without one: liveDatabase.test.ts, schemaInvariants.live.test.ts,
  # expiryIndexes.live.test.ts).
  db-test:
    name: DB Tests
    runs-on: ubuntu-latest
    # The other Postgres job, and by far the smaller one: p50 1m37s, max 1m57s,
    # sd 6s over the same 118 runs. It had no cap at all, so a wedge here would
    # have burned GitHub's 6-hour default. 15m is ~7.7x its worst observed run.
    timeout-minutes: 15
    services:
      # PostGIS, matching api-test: this package's live suites build their own
      # throwaway schemas (never PostGIS types), but the image is pinned the
      # same way everywhere else in this repo so no job disagrees about what a
      # "Postgres service" means here.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: oxy
          POSTGRES_PASSWORD: oxy
          POSTGRES_DB: oxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxy -d oxy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun run lint && bun run typescript && bun run build
        working-directory: ./packages/db
      - run: bun run test
        working-directory: ./packages/db
        env:
          # The admin connection the live suites create/drop throwaway
          # databases through — see liveDatabase.test.ts's own doc comment.
          # Without this every live suite is `describe.skip`, indistinguishable
          # from passing; this is what makes them actually run in CI.
          OXYDB_TEST_ADMIN_URL: postgres://oxy:oxy@127.0.0.1:5432/postgres

  # Contracts package tests (Jest — no MongoDB)
  contracts-test:
    name: Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun run test
        working-directory: ./packages/contracts

  # Protocol package tests (Jest — build contracts first)
  protocol-test:
    name: Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun run --filter @oxyhq/contracts build
      - run: bun run test
        working-directory: ./packages/protocol

  # Federation substrate tests (Jest — build + lint + typecheck)
  federation-test:
    name: Federation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: bun run build && bun run lint && bun run typescript && bun run test
        working-directory: ./packages/federation

  # Core SDK tests (Jest — build contracts + protocol first)
  core-test:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
      - run: bun run test
        working-directory: ./packages/core

  # Ship CLI tests (bun test — build workspace deps first)
  ship-test:
    name: Ship Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
      - run: bun run test
        working-directory: ./packages/ship

  # Node package tests (Jest — build workspace deps first)
  node-test:
    name: Node Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
      - run: bun run test
        working-directory: ./packages/node

  # Services SDK tests (Jest — build workspace deps first)
  services-test:
    name: Services Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
      - run: bun run test
        working-directory: ./packages/services
      # `postbuild` runs scripts/verify-package.mjs, which packs the tarball and
      # asserts every `exports` target is really in it. The auth, commons and
      # accounts jobs happen to build services too, but a packaging gate that
      # only runs as a side effect of an unrelated job is one edit away from
      # running nowhere, and no job name would say so.
      - name: Build and verify the publishable package
        run: bun run build
        working-directory: ./packages/services

  # Auth IdP tests (bun test — NOT jest)
  auth-test:
    name: Auth Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
          bun run --filter @oxyhq/services build
      - run: bun run test
        working-directory: ./packages/auth
      - run: bunx tsc --noEmit
        working-directory: ./packages/auth

  # Commons app tests (Jest — native identity vault)
  commons-test:
    name: Commons Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
          bun run --filter @oxyhq/services build
          bun run --filter @oxyhq/expo-splash build
      - run: bun run test
        working-directory: ./packages/commons


  # Accounts app tests (Jest — keyless account management)
  accounts-test:
    name: Accounts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
          bun run --filter @oxyhq/services build
          bun run --filter @oxyhq/expo-splash build
      - run: bun run test
        working-directory: ./packages/accounts

  # Console developer portal (Vitest — Vite + RN Web)
  #
  # Console had no CI job at all until #972, while `deploy-cloudflare.yml` ships
  # it to production from `main` on every merge that touches `packages/console`.
  # Nothing ran between a pull request and that deploy.
  #
  # `tsc --noEmit` is the specific hole. Console's `build` script is
  # `writePagesHeaders && vite build`, and Vite ERASES types rather than checking
  # them — so a type error builds cleanly, deploys cleanly, and is found by a
  # user. It lives here rather than in the `build` script because `build` is what
  # the production deploy runs: moving the check there would turn a type error
  # into "Console cannot deploy at all" — a failure discovered AFTER merge, with
  # no way to ship an unrelated urgent fix around it. The gap being closed is
  # that nothing gates the pull request, so the check belongs on the pull
  # request. `auth-test` above already places its typecheck this way.
  #
  # `--filter=oxy-console...` (with the ellipsis) builds the workspace
  # dependencies too. Without them the build fails on an unresolvable
  # `@oxyhq/services` and the error names the wrong package entirely.
  #
  # The test step's own vacuity floor is in `packages/console/package.json`:
  # `test` dropped `--passWithNoTests`, which would have reported a green step
  # over a broken glob matching zero files. Console has 4 test files, so the
  # floor is satisfied today and a run finding none is a real failure.
  #
  # Lint is deliberately NOT a step here: `bun run lint` reports 45 pre-existing
  # problems on `main` (42 errors), so adding it would make this gate red on
  # arrival, which gates nothing. Most are `no-unnecessary-condition` — removing
  # a defensive `?.` on the strength of a type claim is a semantic change, not a
  # CI change, and does not belong in the same pull request as the gate. See the
  # pull request body for what including it would take.
  console-test:
    name: Console Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Build Console and its workspace dependencies
        run: bunx turbo run build --filter=oxy-console...
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: ./packages/console
      - name: Run tests
        run: bun run test
        working-directory: ./packages/console

  # packages/api/openapi.json must describe the API it claims to
  # (see scripts/check-openapi-fresh.mjs).
  #
  # The generator walks only route files present in a hand-maintained MOUNT_MAP
  # and silently skips any file absent from it — a clean exit with the routes
  # simply not in the document. Measured before this job existed: the entire
  # inference surface was missing while the deprecated Alia proxy was described,
  # `/models/stats` was described from a route file deleted a fortnight earlier,
  # and 128 authenticated operations were published as needing no credential.
  # Nothing failed.
  #
  # Deliberately NOT a diff alone: the committed document matched what the map
  # produced through all of it, and a diff stays green forever when a map entry
  # is dropped and the artifact regenerated in the same commit. The check asserts
  # the surface by NAME and the credential requirement by rule as well.
  openapi-contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --minimum-release-age=0
      # The generator imports src/schemas/**, which reach @oxyhq/contracts, and it
      # REFUSES to write a partial document when a schema module cannot be
      # imported — it names this sequence itself when they are missing.
      #
      # @oxyhq/protocol is here even though nothing in packages/api imports it
      # directly: core's BUILT esm output (`dist/esm/crypto/polyfill.js`) imports
      # it at RUNTIME. Measured on a cold tree — `@oxyhq/core build` SUCCEEDS
      # without protocol's dist, and the generator then dies importing
      # auth.schemas.ts. A build-order list derived from what compiles is not the
      # same list as what runs.
      #
      # packages/api's own `tsc` is deliberately not run: the generator executes
      # the route TypeScript through bun rather than from dist/, so `api-build`
      # already owns that check and this job does not repeat it.
      - name: Build the workspace deps the generator reads
        run: |
          bun run --filter @oxyhq/contracts build
          bun run --filter @oxyhq/protocol build
          bun run --filter @oxyhq/core build
          bun run --filter @oxyhq/mcp build
          bun run --filter @oxyhq/db build

      # The gate's own fixture tests, including the positive control: an entry
      # removed from a fixture MOUNT_MAP with the artifact regenerated in the same
      # commit, so the freshness layer is green and only the by-name layer fails.
      - run: bun scripts/test-check-openapi-fresh.mjs
      - run: bun scripts/check-openapi-fresh.mjs

  # Dependency advisories (see scripts/check-dependency-audit.mjs).
  #
  # This job used to run `npm audit --audit-level=high || true`. Ask the standard
  # question — what would that report if a high-severity advisory were present?
  # Exactly what it reported with none, because `|| true` made it unconditionally
  # green, and `ci-complete` counted it as satisfied whatever it found. It also ran
  # `npm` against a repository that has no package-lock.json.
  #
  # A hard fail is not the replacement, and the number says why: `bun audit` reports
  # 152 advisories here, 76 of them high or critical, essentially all transitive
  # through eslint, expo, metro, vite and release-it, whose version floors cannot be
  # raised from this repository. That gate is red on arrival and blocks every
  # unrelated pull request, which is how `|| true` came to be appended in the first
  # place.
  #
  # So: a ratchet. An advisory in a package nobody has acknowledged fails, every
  # CRITICAL must be named individually, and an acknowledgement that no longer
  # matches fails too — which is also the positive control, since a non-empty list
  # plus an audit that returned nothing is red rather than green.
  #
  # No install: verified that `bun audit` needs only bun.lock and the workspace
  # manifests by running it against a tree holding exactly those.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Only reads the checkout. CodeQL's `actions/missing-workflow-permissions`
    # flagged the absent default; scoped here rather than at workflow level,
    # because a workflow-wide block would silently re-scope the token of every
    # other job in this file, including the coverage artifact upload.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The gate's own fixture tests, offline: every failing branch is driven from a
      # synthesised audit payload, because the live audit on this tree only ever
      # exercises the passing path.
      - run: bun scripts/test-check-dependency-audit.mjs
      - run: bun scripts/check-dependency-audit.mjs

  # THE one status check `main` requires. Everything above it reports here.
  #
  # Requiring the test jobs by name cannot work: a required check that never
  # reports blocks the pull request forever, so every required name has to be a
  # job that runs on every pull request for all time — and the list would live in
  # a repository setting nothing in this tree can see, so a job added later would
  # be required by nothing with no signal in the diff.
  #
  # `if: always()` is what makes this reachable when something above it failed,
  # was cancelled, or skipped. Without it this job inherits their skip and — as a
  # required check reporting `skipped` — never becomes satisfied.
  #
  # The verdict logic, the coverage check that catches a job added later, and
  # every guard against this passing vacuously live in scripts/check-ci-complete.mjs.
  ci-complete:
    name: CI complete
    needs:
      - deploy-script-test
      - api-test
      - api-build
      - lockfile-sync
      - deploy-secrets-sync
      - secret-scan
      - schema-policy
      - permission-vocabulary
      - raw-ip-keys
      - migration-phases
      - db-test
      - contracts-test
      - protocol-test
      - federation-test
      - core-test
      - ship-test
      - node-test
      - services-test
      - auth-test
      - commons-test
      - accounts-test
      - console-test
      - openapi-contract
      - security-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The gate's own fixture tests, run before the gate itself — same shape as
      # lockfile-sync, deploy-secrets-sync and migration-phases beside it. No
      # install: both files read YAML through Bun's built-in parser and shell out
      # to nothing.
      - run: bun scripts/test-check-ci-complete.mjs
      - name: Require every CI job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bun scripts/check-ci-complete.mjs
