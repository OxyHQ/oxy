name: Reconcile deployed external identities
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed operation (inspection never discovers or writes)
        required: true
        type: choice
        options: [reconcile, inspect_cache, inspect_meta]
        default: reconcile
      actor_uri:
        description: inspect_cache only - exact HTTPS source actor URI
        required: false
        type: string
      canonical_acct:
        description: Inspection canonical account; inspect_meta accepts Instagram or Threads only
        required: false
        type: string
      transport_acct:
        description: inspect_cache only - transport user@host account
        required: false
        type: string
      expected_source_sha:
        description: Full source SHA of the healthy deployed image
        required: true
        type: string
      dry_run:
        description: Report only (run this before applying)
        required: true
        type: boolean
        default: true
      after:
        description: Optional actor URI cursor from a previous report
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: external-identity-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.triggering_actor == github.actor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
      - name: Launch fixed reconciler from the verified deployed digest
        timeout-minutes: 15
        env:
          LAUNCH_ONLY: true
          OPERATION_MODE: ${{ inputs.mode }}
          ACTOR_URI: ${{ inputs.actor_uri }}
          CANONICAL_ACCT: ${{ inputs.canonical_acct }}
          TRANSPORT_ACCT: ${{ inputs.transport_acct }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          AFTER_CURSOR: ${{ inputs.after }}
        run: bash .github/scripts/run-external-identity-reconciliation.sh
      - name: Read immutable selectors from launch report
        id: task
        run: |
          set -euo pipefail
          jq -er '"digest=" + .imageDigest' identity-reconciliation-report/run.json >> "$GITHUB_OUTPUT"
      - name: Refresh AWS credentials for polling phase 1
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
      - name: Observe existing task for at most 35 minutes (phase 1)
        id: poll1
        timeout-minutes: 40
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.task.outputs.digest }}
        run: bash .github/scripts/collect-external-identity-task.sh
      - name: Refresh AWS credentials for polling phase 2
        if: steps.poll1.outputs.stopped != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
      - name: Observe existing task for at most 35 minutes (phase 2)
        if: steps.poll1.outputs.stopped != 'true'
        id: poll2
        timeout-minutes: 40
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.task.outputs.digest }}
        run: bash .github/scripts/collect-external-identity-task.sh
      - name: Refresh AWS credentials for polling phase 3
        if: steps.poll1.outputs.stopped != 'true' && steps.poll2.outputs.stopped != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
      - name: Observe existing task for at most 35 minutes (phase 3)
        if: steps.poll1.outputs.stopped != 'true' && steps.poll2.outputs.stopped != 'true'
        id: poll3
        timeout-minutes: 40
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.task.outputs.digest }}
        run: bash .github/scripts/collect-external-identity-task.sh
      - name: Require observed completion
        run: jq -e '.tasks | length == 1 and .[0].lastStatus == "STOPPED"' identity-reconciliation-report/result.json
      - name: Refresh AWS credentials for final evidence and cleanup
        if: always() && steps.task.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
      - name: Always collect final status and logs with fresh credentials
        if: always() && steps.task.outcome == 'success'
        timeout-minutes: 5
        env:
          COLLECTION_MODE: snapshot
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.task.outputs.digest }}
        run: bash .github/scripts/collect-external-identity-task.sh
      - name: Clean up only this workflow's transient task
        if: always() && steps.task.outcome == 'success'
        run: |
          set -euo pipefail
          task=$(jq -er '.taskArn | select(test("^arn:aws:ecs:us-west-2:237343248947:task/oxy-cluster/[0-9a-f]{32}$"))' identity-reconciliation-report/run.json)
          definition=$(jq -er '.taskDefinitionArn | select(test("^arn:aws:ecs:us-west-2:237343248947:task-definition/[A-Za-z0-9_-]+:[0-9]+$"))' identity-reconciliation-report/run.json)
          aws ecs stop-task --cluster oxy-cluster --task "$task" --reason 'Identity reconciliation workflow cleanup' >/dev/null || echo '::warning::StopTask failed; container timeout still bounds the task.'
          aws ecs deregister-task-definition --task-definition "$definition" >/dev/null || echo '::warning::Transient definition could not be deregistered.'
      - name: Retain reconciliation report and task logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-identity-reconciliation-${{ github.run_id }}
          path: identity-reconciliation-report/
          retention-days: 14
          if-no-files-found: warn
