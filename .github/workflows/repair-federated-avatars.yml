name: Repair federated remote avatars

# Runs `packages/api/src/scripts/repair-federated-remote-avatars.ts` against
# production, as an ECS one-shot on the LIVE service's task definition (same
# secrets, role, subnets and security groups; only the image and command
# differ) — the shape `run-hls-master-repair.yml` uses.
#
# WHAT IT REPAIRS: federated users whose `users.avatar` is a raw remote URL
# rather than an Oxy Cloud file id. The registry used to seed the source picture
# URL and rely on a background download to replace it; when the download failed
# the URL was served forever. Signed Meta CDN URLs expire (`oe=`) into 403s —
# measured on ibaillanos@instagram.com — so Mention rendered a broken avatar.
# Apply mirrors each picture (Graph fallback for instagram.com when enabled) or
# clears it to NULL so clients show the default; the next resolve re-mirrors the
# current source picture.
#
# Idempotent: every write is conditional on the row still holding the URL it
# read, and a second pass finds nothing. ALWAYS run dry FIRST (the default): it
# writes nothing and prints the count, the per-host split and how many URLs are
# already past their signed expiry.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD be repaired, write nothing'
        required: true
        type: boolean
        default: true
      batch_size:
        description: 'Rows scanned per batch (default 200)'
        required: false
        type: string
      after:
        description: 'Resume after this user id (the `after` of a previous summary)'
        required: false
        type: string

concurrency:
  # Two passes would mirror the same pictures twice.
  group: federated-avatar-repair
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: oxy-api
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  DOCKERFILE: Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  repair:
    # This job receives production credentials. Only the protected main branch
    # may select the code that runs in the production VPC.
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Reject a batch size or cursor that is malformed
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail
          if [ -n "${BATCH_SIZE// /}" ] && ! [[ "$BATCH_SIZE" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "::error::batch_size must be a positive integer (1-99999); got '$BATCH_SIZE'."
            exit 1
          fi
          if [ -n "$AFTER" ] && ! [[ "$AFTER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::after must be a user id (uuid); got '$AFTER'."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the repair image (its own tag; never `latest`)
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="avatar-repair-$(git rev-parse --short HEAD)"
          IMG="$ECR_REGISTRY/oxy/$APP:$TAG"
          docker build -f "$DOCKERFILE" -t "$IMG" .
          docker push "$IMG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "Built $IMG"

      - name: Run the repair as an ECS one-shot task
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail

          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot even
          # pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # A throwaway revision differing from the live one ONLY by the image.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > repair-taskdef.json

          REPAIR_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://repair-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "repair task definition: $REPAIR_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            --arg batch "$BATCH_SIZE" \
            --arg after "$AFTER" \
            '{containerOverrides:[{
               name: $name,
               command: ["bun","run","packages/api/src/scripts/repair-federated-remote-avatars.ts"],
               environment: ([{name:"DRY_RUN", value:$dry}] +
                 (if $batch != "" then [{name:"BATCH_SIZE", value:$batch}] else [] end) +
                 (if $after != "" then [{name:"AFTER", value:$after}] else [] end))
             }]}')

          # The cluster runs at the edge of its Fargate on-demand vCPU quota, so a
          # one-shot competing with a rollout is refused outright (`RESOURCE:CPU`).
          # That is a queue, not a failure — `deploy-ecs-image.sh` waits it out for
          # its own one-shots, and an ops task nobody is watching needs it more.
          # Bounded: after START_MAX_WAIT_SECS the run fails loudly rather than
          # hanging on a quota that is not coming back.
          START_MAX_WAIT_SECS=600
          POLL_INTERVAL=20
          start_waited=0
          while :; do
            RUN_JSON=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$REPAIR_TASK_DEF" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
              --overrides "$OVERRIDES" \
              --started-by "gh-avatar-repair")
            if [ "$(jq '.failures | length' <<<"$RUN_JSON")" = "0" ]; then
              break
            fi
            if ! jq -e '
              all(
                .failures[];
                (.reason // "") == "RESOURCE:CPU"
                or ((.reason // "") | ascii_downcase | contains("limit on the number of vcpus you can run concurrently"))
              )
            ' <<<"$RUN_JSON" >/dev/null; then
              echo "::error::ECS refused to start the repair task."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            if [ "$start_waited" -ge "$START_MAX_WAIT_SECS" ]; then
              echo "::error::Fargate vCPU capacity never freed up within ${START_MAX_WAIT_SECS}s."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            echo "::warning::Fargate vCPU capacity refused the repair task; retrying in ${POLL_INTERVAL}s."
            sleep "$POLL_INTERVAL"
            start_waited=$((start_waited + POLL_INTERVAL))
          done

          TASK_ARN=$(jq -r '.tasks[0].taskArn' <<<"$RUN_JSON")

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── repair output ────────"
          # One JSON line per row, then `{"summary":{...}}`: scanned, expiredSigned,
          # byHost, mirrored, mirroredFromGraph, cleared, changedConcurrently and
          # the `after` resume cursor.
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "───────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # Non-zero means the pass itself failed (connection, crash), not a row.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Repair task exited with $EXIT_CODE"
            exit 1
          fi
