name: Repair video renditions

# Encode a bounded sample from originals in the production VPC; never deploys.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect candidates without encoding or writing'
        required: true
        type: boolean
        default: true
      file_id:
        description: 'Optional exact file ID for a single sample'
        required: false
        type: string
      after:
        description: 'Resume cursor from previous result (including failed groups)'
        required: false
        type: string
      limit:
        description: 'Content groups to repair (1–1000; default 100)'
        required: false
        type: string

concurrency:
  # Bound production encoding work to one repair pass at a time.
  group: video-rendition-repair
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: oxy-api
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  DOCKERFILE: Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  repair:
    # This job receives production credentials. Only the protected main branch
    # may select the code that runs in the production VPC.
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Reject a limit that is not a plain positive integer
        env:
          LIMIT: ${{ inputs.limit }}
          FILE_ID: ${{ inputs.file_id }}
          AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail
          if [ -n "$LIMIT" ] && { ! [[ "$LIMIT" =~ ^[1-9][0-9]{0,3}$ ]] || [ "$LIMIT" -gt 1000 ]; }; then
            echo "::error::limit must be a positive integer (1-1000); got '$LIMIT'."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the repair image (its own tag; never `latest`)
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="video-rendition-repair-$(git rev-parse --short HEAD)"
          IMG="$ECR_REGISTRY/oxy/$APP:$TAG"
          docker build -f "$DOCKERFILE" -t "$IMG" .
          docker push "$IMG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "Built $IMG"

      - name: Run the repair as an ECS one-shot task
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          FILE_ID: ${{ inputs.file_id }}
          AFTER: ${{ inputs.after }}
        run: |
          set -euo pipefail

          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot even
          # pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # A throwaway revision differing from the live one ONLY by the image.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > repair-taskdef.json

          REPAIR_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://repair-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "repair task definition: $REPAIR_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg file "$FILE_ID" \
            --arg after "$AFTER" \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            --arg batch "$LIMIT" \
            '{containerOverrides:[{
               name: $name,
               command: ["bun","run","packages/api/src/scripts/repair-video-renditions.ts"],
               environment: ([{name:"DRY_RUN", value:$dry}] +
                 (if $batch != "" then [{name:"LIMIT", value:$batch}] else [] end) +
                 (if $file != "" then [{name:"FILE_ID", value:$file}] else [] end) +
                 (if $after != "" then [{name:"AFTER", value:$after}] else [] end))
             }]}')

          # The cluster runs at the edge of its Fargate on-demand vCPU quota, so a
          # one-shot competing with a rollout is refused outright (`RESOURCE:CPU`).
          # That is a queue, not a failure — `deploy-ecs-image.sh` waits it out for
          # its own one-shots, and an ops task nobody is watching needs it more.
          # Bounded: after START_MAX_WAIT_SECS the run fails loudly rather than
          # hanging on a quota that is not coming back.
          START_MAX_WAIT_SECS=600
          POLL_INTERVAL=20
          start_waited=0
          while :; do
            # Where SERVICE runs: its capacity provider strategy when it has one (the
            # oxy-ec2 capacity, whose revisions are EC2-only), otherwise its launch
            # type. This revision is derived from its live one, so a hard-coded
            # FARGATE would be refused once the service is on EC2.
            placement_service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0]' --output json)
            placement_strategy=$(jq -c '.capacityProviderStrategy // []' <<<"$placement_service_json")
            if [[ "$placement_strategy" != "[]" ]]; then
              placement=(--capacity-provider-strategy "$placement_strategy")
            else
              placement=(--launch-type "$(jq -r '.launchType // "FARGATE"' <<<"$placement_service_json")")
            fi
            RUN_JSON=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$REPAIR_TASK_DEF" \
              "${placement[@]}" \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
              --overrides "$OVERRIDES" \
              --started-by "gh-video-rendition-repair")
            if [ "$(jq '.failures | length' <<<"$RUN_JSON")" = "0" ]; then
              break
            fi
            if ! jq -e '
              all(
                .failures[];
                (.reason // "") == "RESOURCE:CPU"
                or ((.reason // "") | ascii_downcase | contains("limit on the number of vcpus you can run concurrently"))
              )
            ' <<<"$RUN_JSON" >/dev/null; then
              echo "::error::ECS refused to start the repair task."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            if [ "$start_waited" -ge "$START_MAX_WAIT_SECS" ]; then
              echo "::error::Fargate vCPU capacity never freed up within ${START_MAX_WAIT_SECS}s."
              jq '.failures' <<<"$RUN_JSON"
              exit 1
            fi
            echo "::warning::Fargate vCPU capacity refused the repair task; retrying in ${POLL_INTERVAL}s."
            sleep "$POLL_INTERVAL"
            start_waited=$((start_waited + POLL_INTERVAL))
          done

          TASK_ARN=$(jq -r '.tasks[0].taskArn' <<<"$RUN_JSON")

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          # Always stop the task we own if this step is cancelled or times out.
          stop_owned_task() {
            aws ecs stop-task --cluster "$CLUSTER" --task "$TASK_ARN" \
              --reason "Video repair workflow ended" >/dev/null || true
          }
          finish_repair() {
            stop_owned_task
            aws logs get-log-events --log-group-name "$LOG_GROUP" \
              --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" --start-from-head \
              --query 'events[].message' --output text || true
          }
          trap finish_repair EXIT
          trap 'exit 130' INT TERM
          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          # The AWS waiter stops after ten minutes; a bounded encode pass can take longer.
          deadline=$((SECONDS + 5400))
          while [ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].lastStatus' --output text)" != "STOPPED" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              stop_owned_task
              echo "::error::Repair exceeded 90 minutes; resume from the last logged cursor."
              break
            fi
            sleep 15
          done


          echo "──────── repair output ────────"
          # Read candidates, failures and the resume cursor even after a partial pass.
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "───────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # 75 is the script's own "some videos could not be repaired" exit — a
          # partial pass is a red run, not a quiet success.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Repair task exited with $EXIT_CODE"
            exit 1
          fi
