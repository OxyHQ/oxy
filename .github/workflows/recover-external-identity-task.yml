name: Recover external identity task evidence
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read evidence, or stop only a verified completed standalone task
        type: choice
        default: snapshot
        options: [snapshot, stop_completed]
      prior_run_id:
        description: Completed reconciliation workflow whose exact task will be read
        required: true
        type: string
      expected_source_sha:
        description: Reviewed source SHA in the prior run artifact
        required: true
        type: string
      expected_image_digest:
        description: Reviewed sha256 digest in the prior run artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: external-identity-recovery-${{ inputs.prior_run_id }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.triggering_actor == github.actor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.expected_image_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate exact prior workflow and artifact
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          RECOVERY_RUN_ID: ${{ inputs.prior_run_id }}
        run: bash .github/scripts/prepare-external-identity-recovery.sh
      - name: Obtain read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecs:DescribeTasks","ecs:DescribeTaskDefinition","logs:GetLogEvents"],"Resource":"*"}]}
      - name: Obtain permission to stop only the authenticated completed task
        if: inputs.operation == 'stop_completed'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: us-west-2
          unset-current-credentials: true
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecs:DescribeTasks","ecs:DescribeTaskDefinition","ecs:DescribeServices","logs:GetLogEvents"],"Resource":"*"},{"Effect":"Allow","Action":"ecs:StopTask","Resource":"${{ steps.prior.outputs.task_arn }}"}]}
      - name: Read exact task status and all CloudWatch pages
        env:
          COLLECTION_MODE: ${{ inputs.operation }}
        run: bash .github/scripts/collect-external-identity-task.sh
      - name: Retain recovered evidence even for failed or incomplete tasks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-identity-recovery-${{ inputs.prior_run_id }}-${{ github.run_id }}
          path: identity-reconciliation-report/
          retention-days: 14
          if-no-files-found: warn
