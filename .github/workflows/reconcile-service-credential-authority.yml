name: Reconcile service credential authority

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Existing canonical Oxy application name
        required: true
        type: string
      app_slug:
        description: SSM namespace containing OXY_SERVICE_API_KEY
        required: true
        type: string
      owner_username:
        description: Existing Oxy application owner username
        required: true
        default: oxy
        type: string
      add_scopes:
        description: Exact comma-separated scopes to add
        required: true
        type: string
      environment:
        description: Credential environment
        required: true
        default: production
        type: choice
        options:
          - development
          - staging
          - production
      dry_run:
        description: Validate and report without writing
        required: true
        default: true
        type: boolean

concurrency:
  group: reconcile-service-authority-${{ inputs.app_slug }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  CONTAINER: oxy-api

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate bounded inputs
        env:
          APP_SLUG: ${{ inputs.app_slug }}
          ADD_SCOPES: ${{ inputs.add_scopes }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::app_slug must be lowercase kebab-case"
            exit 1
          fi
          if [[ ! "$ADD_SCOPES" =~ ^[a-z0-9:_-]+(,[a-z0-9:_-]+)*$ ]]; then
            echo "::error::add_scopes must be a comma-separated capability list"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile the exact deployed credential
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_SLUG: ${{ inputs.app_slug }}
          OWNER_USERNAME: ${{ inputs.owner_username }}
          ADD_SCOPES: ${{ inputs.add_scopes }}
          CREDENTIAL_ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          public_key=$(aws ssm get-parameter \
            --name "/oxy/$APP_SLUG/OXY_SERVICE_API_KEY" \
            --with-decryption --query 'Parameter.Value' --output text)
          if [[ ! "$public_key" =~ ^oxy_dk_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::SSM did not contain a valid Oxy service public key"
            exit 1
          fi
          echo "::add-mask::$public_key"
          public_key_sha256=$(printf '%s' "$public_key" | sha256sum | awk '{print $1}')
          unset public_key

          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [ "$(jq -r '.status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::Oxy API service is not active"
            exit 1
          fi
          task_definition=$(jq -r '.taskDefinition' <<<"$service_json")
          network=$(jq -c '.networkConfiguration' <<<"$service_json")
          task_json=$(aws ecs describe-task-definition \
            --task-definition "$task_definition" --query taskDefinition --output json)
          log_group=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-group"]
          ' <<<"$task_json")
          log_prefix=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-stream-prefix"]
          ' <<<"$task_json")

          overrides=$(jq -nc \
            --arg container "$CONTAINER" \
            --arg app "$APP_NAME" \
            --arg owner "$OWNER_USERNAME" \
            --arg scopes "$ADD_SCOPES" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg fingerprint "$public_key_sha256" \
            --arg dry "$DRY_RUN" '
              {containerOverrides:[{
                name:$container,
                command:["bun","run","packages/api/scripts/reconcile-service-credential-authority.ts"],
                environment:[
                  {name:"APP_NAME",value:$app},
                  {name:"OWNER_USERNAME",value:$owner},
                  {name:"ADD_SCOPES",value:$scopes},
                  {name:"ENVIRONMENT",value:$environment},
                  {name:"PUBLIC_KEY_SHA256",value:$fingerprint},
                  {name:"DRY_RUN",value:$dry}
                ]
              }]}
            ')
          unset public_key_sha256

          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "gh-service-authority-${GITHUB_RUN_ID}")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start reconciliation: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "reconciliation task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_state=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn")
          exit_code=$(jq -r --arg container "$CONTAINER" '
            .tasks[0].containers[] | select(.name == $container) | .exitCode
          ' <<<"$task_state")
          task_id=${task_arn##*/}
          log_json=$(aws logs get-log-events \
            --log-group-name "$log_group" \
            --log-stream-name "$log_prefix/$CONTAINER/$task_id" \
            --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
          jq -r '.events[].message' <<<"$log_json"
          result=$(jq -r '.events[].message' <<<"$log_json" |
            grep '^SERVICE_AUTHORITY_JSON=' | tail -1 || true)
          if [ "$exit_code" != "0" ] || [ -z "$result" ]; then
            echo "::error::Credential authority reconciliation failed (exit=$exit_code)"
            exit 1
          fi
          echo "$result"
