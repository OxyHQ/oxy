name: Reconcile service credential authority

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Exact existing Oxy application ID
        required: true
        type: string
      credential_id:
        description: Exact deployed Oxy service credential ID
        required: true
        type: string
      dry_run:
        description: Validate and report without writing
        required: true
        default: true
        type: boolean

concurrency:
  group: reconcile-service-authority-${{ inputs.app_id }}-${{ inputs.credential_id }}-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  CONTAINER: oxy-api

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile the exact deployed credential
        env:
          APP_ID: ${{ inputs.app_id }}
          CREDENTIAL_ID: ${{ inputs.credential_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Exact-ID registry. Human names, caller-selected scopes and a
          # caller-selected environment never decide this credential's
          # authority. Adding another service requires a reviewed mapping.
          case "$APP_ID" in
            68b7c4e19f2a6d0e3c8b5174)
              ADD_SCOPES="inference:byok:validate"
              CREDENTIAL_ENVIRONMENT="production"
              EXPECTED_CREDENTIAL_ID=""
              ;;
            6a37b3e61ddfd195b656819b)
              ADD_SCOPES="inference:invoke"
              CREDENTIAL_ENVIRONMENT="production"
              EXPECTED_CREDENTIAL_ID="01a06134-022c-72b6-a876-27da37a39e39"
              ;;
            6a2f851751b784a86fd0e922)
              ADD_SCOPES="reputation:write,inference:invoke"
              CREDENTIAL_ENVIRONMENT="production"
              EXPECTED_CREDENTIAL_ID=""
              ;;
            *)
              echo "::error::app_id is not registered for service credential reconciliation"
              exit 1
              ;;
          esac
          if [ -n "$EXPECTED_CREDENTIAL_ID" ] && [ "$CREDENTIAL_ID" != "$EXPECTED_CREDENTIAL_ID" ]; then
            echo "::error::credential_id is not the registered deployed credential for this exact application"
            exit 1
          fi

          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [ "$(jq -r '.status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::Oxy API service is not active"
            exit 1
          fi
          task_definition=$(jq -r '.taskDefinition' <<<"$service_json")
          network=$(jq -c '.networkConfiguration' <<<"$service_json")
          task_json=$(aws ecs describe-task-definition \
            --task-definition "$task_definition" --query taskDefinition --output json)
          log_group=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-group"]
          ' <<<"$task_json")
          log_prefix=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-stream-prefix"]
          ' <<<"$task_json")

          overrides=$(jq -nc \
            --arg container "$CONTAINER" \
            --arg app_id "$APP_ID" \
            --arg credential_id "$CREDENTIAL_ID" \
            --arg scopes "$ADD_SCOPES" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg dry "$DRY_RUN" '
              {containerOverrides:[{
                name:$container,
                command:["bun","run","packages/api/scripts/reconcile-service-credential-authority.ts"],
                environment:[
                  {name:"APP_ID",value:$app_id},
                  {name:"CREDENTIAL_ID",value:$credential_id},
                  {name:"ADD_SCOPES",value:$scopes},
                  {name:"ENVIRONMENT",value:$environment},
                  {name:"DRY_RUN",value:$dry}
                ]
              }]}
            ')
          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "gh-service-authority-${GITHUB_RUN_ID}")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start reconciliation: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "reconciliation task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_state=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn")
          exit_code=$(jq -r --arg container "$CONTAINER" '
            .tasks[0].containers[] | select(.name == $container) | .exitCode
          ' <<<"$task_state")
          task_id=${task_arn##*/}
          log_json=$(aws logs get-log-events \
            --log-group-name "$log_group" \
            --log-stream-name "$log_prefix/$CONTAINER/$task_id" \
            --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
          jq -r '.events[].message' <<<"$log_json"
          result=$(jq -r '.events[].message' <<<"$log_json" |
            grep '^SERVICE_AUTHORITY_JSON=' | tail -1 || true)
          if [ "$exit_code" != "0" ] || [ -z "$result" ]; then
            echo "::error::Credential authority reconciliation failed (exit=$exit_code)"
            exit 1
          fi
          echo "$result"
