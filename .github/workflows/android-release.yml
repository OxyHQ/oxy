name: Android release

# THE native Android release of every Oxy app, called by each app repository's
# own `.github/workflows/android-release.yml` on every push to its default
# branch. A run builds a new binary only when the app's `version` has none yet:
# the version is the OTA compatibility boundary (`withOxyUpdates`, runtime
# policy `appVersion`), so a JS-only change ships as an OTA update under the
# same version and most pushes end at the "Is this version released?" step. A
# new version is a native change, and gets a signed AAB and one APK per ABI:
# the AAB goes to Google Play's internal testing track, the APKs (arm64-v8a and
# armeabi-v7a, each with its SHA-256) are the public GitHub release
# `<tag-prefix>-v<version>` of the app repository, and all of them stay archived
# on seldon ($OXY_RELEASE_ARCHIVE/<repo>/<tag>/). There is no universal APK:
# @oxy.so/app-preset 6.1.1+ (withOxyAbiSplits) splits the APKs by ABI.
# docs/engineering/build-and-deploy.md#native-android-releases.
#
# It runs on `seldon`, Oxy's self-hosted build machine, whose runner group
# accepts ONLY this workflow at refs/heads/main: no other workflow, and no pull
# request of any (public) repository, can schedule a job there. The machine
# holds the one ecosystem release key; Gradle reads it from the runner's
# environment (ORG_GRADLE_PROJECT_OXY_UPLOAD_*), and `oxyVerifyReleaseSigning`
# (@oxy.so/services' withOxyReleaseSigning) fails any release that does not
# carry its certificate. No signing material is stored on GitHub.
#
# The store build number is derived from `version` by @oxy.so/app-preset
# (withOxyReleaseVersion, 1.2.3 → 1002003), so every released version gets a
# strictly higher versionCode. Rebuilding a released version is refused: a new
# binary is a new version.
#
# The caller grants `contents: write` (to create the release) on its job.

on:
  workflow_call:
    inputs:
      app-dir:
        description: The Expo app's directory, relative to the repository root.
        type: string
        required: true
      eas-profile:
        description: The eas.json build profile whose `env` the build uses.
        type: string
        default: production
      tag-prefix:
        description: Release tag prefix; distinct per app when a repository has several.
        type: string
        default: android

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: [self-hosted, seldon]
    timeout-minutes: 90
    concurrency:
      group: android-release-${{ github.repository }}-${{ inputs.tag-prefix }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: ${{ inputs.app-dir }}
      EAS_PROFILE: ${{ inputs.eas-profile }}
      TAG_PREFIX: ${{ inputs.tag-prefix }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - run: bun install --frozen-lockfile --minimum-release-age=0

      # The build environment is the one EAS would use: the profile's `env`,
      # following `extends`. Values are public build-time config (EXPO_PUBLIC_*).
      - name: Build environment from eas.json
        run: |
          node - <<'EOF' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const eas = JSON.parse(readFileSync(join(process.env.APP_DIR, 'eas.json'), 'utf8'));
          const resolve = (name, seen = new Set()) => {
            const profile = eas.build?.[name];
            if (!profile) throw new Error(`eas.json has no build profile "${name}"`);
            if (seen.has(name)) throw new Error(`eas.json profile "${name}" extends itself`);
            seen.add(name);
            const base = profile.extends ? resolve(profile.extends, seen) : {};
            return { ...base, ...profile.env };
          };
          for (const [key, value] of Object.entries(resolve(process.env.EAS_PROFILE))) {
            if (!/^[A-Z_][A-Z0-9_]*$/.test(key) || /[\r\n]/.test(String(value))) {
              throw new Error(`eas.json env ${key} cannot be exported`);
            }
            console.log(`${key}=${value}`);
          }
          console.log('NODE_ENV=production');
          EOF

      - name: Is this version released?
        id: plan
        working-directory: ${{ inputs.app-dir }}
        run: |
          set -euo pipefail
          config="$(bunx expo config --json --type public)"
          version="$(jq -r '.version' <<<"$config")"
          version_code="$(jq -r '.android.versionCode' <<<"$config")"
          package="$(jq -r '.android.package' <<<"$config")"
          ios_bundle_id="$(jq -r '.ios.bundleIdentifier // empty' <<<"$config")"
          tag="${TAG_PREFIX}-v${version}"
          {
            echo "version=$version"
            echo "version-code=$version_code"
            echo "package=$package"
            echo "ios-bundle-id=$ios_bundle_id"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::$tag is already released. A new binary is a new version: bump \`version\` in the app config."
              exit 1
            fi
            echo "::notice::$package $version is already released ($tag); this change ships as an OTA update."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # A Turbo monorepo (this one: Accounts, Commons) bundles workspace
      # packages that Metro resolves from their built output; build the app's
      # workspace dependencies, not the app itself. Other repositories build
      # theirs on install, or bundle sources.
      - name: Build the app's workspace dependencies
        if: steps.plan.outputs.build == 'true' && hashFiles('turbo.json') != ''
        run: bunx --no-install turbo run build --filter="{./${APP_DIR}}^..."

      # Every native release also checks the app's iOS keychain access groups
      # (ADR 0062 of the oxy repo, docs/identity/ios-keychain-access-groups.md):
      # an iOS prebuild of the same commit, then @oxy.so/app-preset's
      # oxy-check-keychain-entitlements over the entitlements it wrote. The list
      # must be exactly the bundle id's layout (the shared group; Commons and the
      # Peable wallet their restricted groups), optionally followed by the app's
      # own `$(AppIdentifierPrefix)<bundle id>`: another app's bundle id is that
      # app's private group. The preset's plugin already refuses a bad list at
      # prebuild; this reads what was written. Needs @oxy.so/app-preset >= 6.4.0
      # (the exact-layout policy); an app with no ios.bundleIdentifier has no
      # iOS build and nothing to check.
      - name: Check the iOS keychain entitlements
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ inputs.app-dir }}
        env:
          IOS_BUNDLE_ID: ${{ steps.plan.outputs.ios-bundle-id }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_BUNDLE_ID" ]; then
            echo "::notice::No ios.bundleIdentifier in the app config: no iOS build, no keychain entitlements to check."
            exit 0
          fi
          preset="$(node -p 'require("@oxy.so/app-preset/package.json").version' 2>/dev/null || true)"
          if ! node -e '
            const [major, minor] = (process.argv[1] || "0.0").split(".").map(Number);
            process.exit(major > 6 || (major === 6 && minor >= 4) ? 0 : 1);
          ' "$preset"; then
            echo "::error::The iOS keychain entitlement check needs @oxy.so/app-preset >= 6.4.0 (found ${preset:-none}): bump it in the app."
            exit 1
          fi
          checker="$(node -p 'require.resolve("@oxy.so/app-preset/check-entitlements")')"
          bunx expo prebuild --platform ios --no-install --clean
          node "$checker" "$IOS_BUNDLE_ID" ios

      - name: Prebuild the native project
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ inputs.app-dir }}
        run: bunx expo prebuild --platform android --clean --no-install

      # Two invocations: withOxyAbiSplits turns the ABI splits off in one that
      # builds a bundle, because AGP refuses split APKs next to an app bundle
      # while R8 shrinks resources (https://issuetracker.google.com/402800800).
      - name: Build the signed AAB and APKs
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ inputs.app-dir }}/android
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --console=plain
          ./gradlew :app:assembleRelease --console=plain

      # Every build is kept on seldon too, the AAB included: the GitHub release
      # carries only what the public installs (the per-ABI APKs and their
      # checksums). Gradle names a split APK app-<abi>-release.apk; it is
      # archived as <package>-<version>-<abi>.apk.
      - name: Archive the build on seldon
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ inputs.app-dir }}/android/app/build/outputs
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGE: ${{ steps.plan.outputs.package }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          : "${OXY_RELEASE_ARCHIVE:?the seldon runner sets OXY_RELEASE_ARCHIVE}"
          name="${PACKAGE}-${VERSION}"
          dir="$OXY_RELEASE_ARCHIVE/$GITHUB_REPOSITORY/$TAG"
          shopt -s nullglob
          apks=(apk/release/app-*-release.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::The build produced no per-ABI APK (apk/release/app-<abi>-release.apk). Oxy releases ship one APK per ABI and never a universal one: the app needs @oxy.so/app-preset >= 6.1.1, whose withOxyAbiSplits (applied by the preset and by withOxyUpdates) splits the APKs."
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            if [ ! -f "apk/release/app-$abi-release.apk" ]; then
              echo "::error::The build produced no $abi APK. Every Oxy release ships arm64-v8a (phones) and armeabi-v7a (older phones, Android TVs): build both ABIs (reactNativeArchitectures) with @oxy.so/app-preset >= 6.1.1."
              exit 1
            fi
          done
          rm -rf "${dir:?}"
          mkdir -p "$dir"
          for apk in "${apks[@]}"; do
            abi="${apk#apk/release/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "$dir/$name-$abi.apk"
          done
          cp bundle/release/app-release.aab "$dir/$name.aab"
          (cd "$dir" && sha256sum -- *.apk "$name.aab" > SHA256SUMS)
          ls -l "$dir"
          echo "ARCHIVE_DIR=$dir" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          # Keep this app's three newest versions: Play keeps every AAB it was
          # given and GitHub every APK, so older copies here only fill the disk.
          find "$OXY_RELEASE_ARCHIVE/$GITHUB_REPOSITORY" -mindepth 1 -maxdepth 1 -type d -name "${TAG_PREFIX}-v*" -printf '%f\n' \
            | sort -V | head -n -3 \
            | while read -r old; do rm -rf "${OXY_RELEASE_ARCHIVE:?}/$GITHUB_REPOSITORY/$old"; done

      # The AAB goes to Google Play's internal testing track. Google offers no
      # API to create an app, and an app has no package until its first bundle
      # is uploaded in Play Console, so a package Play does not know yet is a
      # warning (upload the archived AAB there once), never a failed release.
      # Re-running after a partial failure is safe: a versionCode Play already
      # holds is not uploaded again.
      - name: Upload the AAB to Google Play (internal testing)
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_CODE: ${{ steps.plan.outputs.version-code }}
          PACKAGE: ${{ steps.plan.outputs.package }}
        run: |
          node - <<'EOF'
          const { createSign } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          const env = process.env;
          const key = JSON.parse(readFileSync(env.GOOGLE_PLAY_SERVICE_ACCOUNT_FILE, 'utf8'));
          const API = 'https://androidpublisher.googleapis.com/androidpublisher/v3/applications';
          const UPLOAD = 'https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications';
          const b64url = (value) => Buffer.from(value).toString('base64url');

          async function accessToken() {
            const now = Math.floor(Date.now() / 1000);
            const claims = {
              iss: key.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            };
            const unsigned = `${b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }))}.${b64url(JSON.stringify(claims))}`;
            const signature = createSign('RSA-SHA256').update(unsigned).sign(key.private_key, 'base64url');
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: `${unsigned}.${signature}`,
              }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(`Google token: ${body.error_description ?? body.error}`);
            return body.access_token;
          }

          async function main() {
            const token = await accessToken();
            const call = async (method, url, body, headers = {}) => {
              const response = await fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, ...headers },
                body,
              });
              const text = await response.text();
              const json = text ? JSON.parse(text) : {};
              return { status: response.status, json };
            };
            const app = `${API}/${env.PACKAGE}`;
            const edit = await call('POST', `${app}/edits`, '', { 'Content-Length': '0' });
            if (edit.status === 404) {
              console.log(
                `::warning::${env.PACKAGE} is not on Google Play yet. Create the app in Play Console and upload ` +
                  `${env.ARCHIVE_DIR}/${env.ARTIFACT_NAME}.aab to Internal testing once; later releases upload here.`,
              );
              return;
            }
            if (edit.status !== 200) throw new Error(`Play edit: ${edit.status} ${JSON.stringify(edit.json.error)}`);
            const editUrl = `${app}/edits/${edit.json.id}`;
            const code = Number(env.VERSION_CODE);

            const bundles = await call('GET', `${editUrl}/bundles`);
            const held = (bundles.json.bundles ?? []).some((bundle) => bundle.versionCode === code);
            if (held) {
              console.log(`Play already holds versionCode ${code}; not uploading it again.`);
            } else {
              const aab = readFileSync(join(env.ARCHIVE_DIR, `${env.ARTIFACT_NAME}.aab`));
              const upload = await call('POST', `${UPLOAD}/${env.PACKAGE}/edits/${edit.json.id}/bundles?uploadType=media`, aab, {
                'Content-Type': 'application/octet-stream',
              });
              if (upload.status !== 200) throw new Error(`Play upload: ${upload.status} ${JSON.stringify(upload.json.error)}`);
            }

            const track = await call(
              'PUT',
              `${editUrl}/tracks/internal`,
              JSON.stringify({
                track: 'internal',
                releases: [{ name: env.VERSION, versionCodes: [String(code)], status: 'completed' }],
              }),
              { 'Content-Type': 'application/json' },
            );
            if (track.status !== 200) throw new Error(`Play track: ${track.status} ${JSON.stringify(track.json.error)}`);
            // While an app has changes Play will not send for review on its own
            // (an app still in setup, or with managed publishing), a commit is
            // refused until it says so. The edit stays open, so it is committed
            // again with the flag and the release waits for "Send for review"
            // in Play Console.
            let commit = await call('POST', `${editUrl}:commit`, '', { 'Content-Length': '0' });
            const heldForReview =
              commit.status === 400 && String(commit.json.error?.message).includes('changesNotSentForReview');
            if (heldForReview) {
              commit = await call('POST', `${editUrl}:commit?changesNotSentForReview=true`, '', { 'Content-Length': '0' });
            }
            if (commit.status !== 200) throw new Error(`Play commit: ${commit.status} ${JSON.stringify(commit.json.error)}`);
            if (heldForReview) {
              console.log(
                `::warning::${env.PACKAGE} ${env.VERSION} (versionCode ${code}) is committed to Google Play internal testing ` +
                  'but Play does not send it for review automatically: send it from Play Console > Publishing overview.',
              );
            } else {
              console.log(`::notice::${env.PACKAGE} ${env.VERSION} (versionCode ${code}) is on Google Play internal testing.`);
            }
          }

          main().catch((error) => {
            console.log(`::error::${error.message}`);
            process.exit(1);
          });
          EOF

      # Last, because the release tag is what marks this version as done.
      - name: Publish the release
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ env.ARCHIVE_DIR }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_CODE: ${{ steps.plan.outputs.version-code }}
          PACKAGE: ${{ steps.plan.outputs.package }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          for apk in "$ARTIFACT_NAME"-*.apk; do
            sha256sum "$apk" > "$RUNNER_TEMP/$apk.sha256"
            assets+=("$apk" "$RUNNER_TEMP/$apk.sha256")
          done
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Android build $VERSION (versionCode $VERSION_CODE) of \`$PACKAGE\` from $GITHUB_SHA.

          **Which APK?** Download one, not both:

          - \`$ARTIFACT_NAME-arm64-v8a.apk\`: almost every phone and tablet, anything from about 2017 on. Start with this one.
          - \`$ARTIFACT_NAME-armeabi-v7a.apk\`: older phones, and Android TVs and TV boxes. If Android says the arm64-v8a app is not compatible with your device, use this one.

          Both are the same version of the same app, signed with the Oxy ecosystem key (certificate SHA-256 b8ab3746466ce4569d7a6a0ffa1eed91bc375174d503613987ca09cb33d6a58d); check a download against its \`.sha256\` file.
          NOTES
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$PACKAGE $VERSION (Android)" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "::notice::Released $TAG"
