# The DNS kaana.ai needs, in its own zone.
#
# WHY THIS LIVES IN A PUBLIC REPOSITORY. The OxyHQ org is on the GitHub Free
# plan, where an organisation Actions secret cannot reach a PRIVATE repository —
# it arrives as an empty string with no error. oxy-infra is private, so the same
# workflow there read CLOUDFLARE_API_TOKEN as "" and exited. This is the same
# reason `cloudflare-dns-relay.yml` sits beside it.
#
# WHAT `check` IS FOR, AND WHY IT RUNS FIRST. The token is shared with the Pages
# deployments and may be scoped to them: whether it can edit the kaana.ai zone
# at all is a MEASUREMENT, not an assumption, and `check` answers it while
# writing nothing. Run it before believing any of the records below are possible.
#
# THE TWO RECORDS ARE NOT THE SAME KIND OF THING:
#
#   - the ACM validation CNAME, which MUST be DNS-only. Cloudflare's proxy
#     answers with its own addresses, so a proxied validation record breaks
#     issuance outright — the certificate sits in PENDING_VALIDATION and the
#     reason is invisible from AWS.
#   - `api.kaana.ai` itself, pointing at the SHARED `oxy-alb`, because the
#     customer-facing API is the Oxy edge — `/v1/chat/completions`, which
#     authenticates the caller and reserves their spend. It is deliberately NOT
#     `oxy-relay`: that load balancer fronts the inference data plane, which
#     accepts only envelopes the edge has signed and has no customer surface.
name: Cloudflare DNS (Kaana)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check reads only. apply creates the missing records.'
        type: choice
        options: [check, apply]
        default: check
        required: true
      validation_name:
        description: 'ACM validation CNAME name (from describe-certificate).'
        type: string
        required: false
      validation_value:
        description: 'ACM validation CNAME value.'
        type: string
        required: false
      alb_dns:
        description: "Shared ALB DNS name. Empty skips the api.kaana.ai record."
        type: string
        required: false

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          VAL_NAME: ${{ inputs.validation_name }}
          VAL_VALUE: ${{ inputs.validation_value }}
          ALB_DNS: ${{ inputs.alb_dns }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          # A secret pasted with a trailing newline produces code 6111, which
          # reads like a scope problem and is not one.
          TOKEN = os.environ["CF_TOKEN"].strip()
          if not TOKEN:
              sys.exit("CLOUDFLARE_API_TOKEN is empty")
          # Length only. This file is in a PUBLIC repository, so its Actions log
          # is world-readable and even a four-character prefix does not belong.
          print(f"token present, {len(TOKEN)} characters")

          ZONE = "kaana.ai"
          API = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              request = urllib.request.Request(
                  API + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  payload = error.read().decode()
                  # The body carries Cloudflare's own error code, which says
                  # WHICH permission is missing. The status alone does not.
                  sys.exit(f"{method} {path} -> HTTP {error.code}: {payload[:400]}")

          zones = call("GET", f"/zones?name={ZONE}")["result"]
          if not zones:
              sys.exit(f"the token cannot see the zone {ZONE}; it is scoped elsewhere "
                       f"or the zone is on another account")
          zone_id = zones[0]["id"]
          print(f"zone {ZONE} is visible: {zone_id}")

          wanted = []
          if os.environ.get("VAL_NAME") and os.environ.get("VAL_VALUE"):
              # DNS-only, deliberately. See the header.
              wanted.append(("CNAME", os.environ["VAL_NAME"].rstrip("."),
                             os.environ["VAL_VALUE"].rstrip("."), False))
          if os.environ.get("ALB_DNS"):
              wanted.append(("CNAME", f"api.{ZONE}", os.environ["ALB_DNS"].rstrip("."), False))

          if not wanted:
              print("no records requested; nothing to reconcile")
              sys.exit(0)

          existing = {r["name"]: r for r in call("GET", f"/zones/{zone_id}/dns_records?per_page=200")["result"]}
          for kind, name, value, proxied in wanted:
              current = existing.get(name)
              if current and current.get("content") == value and current.get("proxied") is proxied:
                  print(f"ok      {name} -> {value}")
                  continue
              verb = "would set" if os.environ["ACTION"] != "apply" else "setting"
              print(f"{verb} {name} -> {value} (proxied={proxied})")
              if os.environ["ACTION"] != "apply":
                  continue
              body = {"type": kind, "name": name, "content": value, "ttl": 1, "proxied": proxied}
              if current:
                  call("PUT", f"/zones/{zone_id}/dns_records/{current['id']}", body)
              else:
                  call("POST", f"/zones/{zone_id}/dns_records", body)
              print(f"set     {name}")
          PY
