# The DNS kaana.ai needs, in its own zone.
#
# WHY THIS LIVES IN A PUBLIC REPOSITORY. The OxyHQ org is on the GitHub Free
# plan, where an organisation Actions secret cannot reach a PRIVATE repository —
# it arrives as an empty string with no error. oxy-infra is private, so the same
# workflow there read CLOUDFLARE_API_TOKEN as "" and exited. This is the same
# reason the legacy data-plane DNS workflow had to live beside it.
#
# WHAT `check` IS FOR, AND WHY IT RUNS FIRST. The token is shared with the Pages
# deployments and may be scoped to them: whether it can edit the kaana.ai zone
# at all is a MEASUREMENT, not an assumption, and `check` answers it while
# writing nothing. Run it before believing any of the records below are possible.
#
# THE TWO RECORDS ARE NOT THE SAME KIND OF THING:
#
#   - the ACM validation CNAME, which MUST be DNS-only. Cloudflare's proxy
#     answers with its own addresses, so a proxied validation record breaks
#     issuance outright — the certificate sits in PENDING_VALIDATION and the
#     reason is invisible from AWS.
#   - the exact apex `kaana.ai`, proxied through Cloudflare to Kaana's DEDICATED
#     load balancer. This is the signed Oxy -> Kaana data-plane hop, not Oxy's
#     customer-facing API and never the shared `oxy-alb`. Proxying is
#     load-bearing: the ALB security group admits Cloudflare and the VPC only,
#     and Cloudflare is the pre-signature request-size/rate-limit boundary. The
#     apex is deliberately left absent until Kaana has a healthy canary target.
name: Cloudflare DNS (Kaana)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check reads only. apply creates the missing records.'
        type: choice
        options: [check, apply]
        default: check
        required: true
      validation_name:
        description: 'ACM validation CNAME name (from describe-certificate).'
        type: string
        required: false
      validation_value:
        description: 'ACM validation CNAME value.'
        type: string
        required: false
      kaana_alb_dns:
        description: "Dedicated Kaana ALB DNS name. Empty skips the kaana.ai apex record."
        type: string
        required: false

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          VAL_NAME: ${{ inputs.validation_name }}
          VAL_VALUE: ${{ inputs.validation_value }}
          KAANA_ALB_DNS: ${{ inputs.kaana_alb_dns }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          # A secret pasted with a trailing newline produces code 6111, which
          # reads like a scope problem and is not one.
          TOKEN = os.environ["CF_TOKEN"].strip()
          if not TOKEN:
              sys.exit("CLOUDFLARE_API_TOKEN is empty")
          # Length only. This file is in a PUBLIC repository, so its Actions log
          # is world-readable and even a four-character prefix does not belong.
          print(f"token present, {len(TOKEN)} characters")

          ZONE = "kaana.ai"
          API = "https://api.cloudflare.com/client/v4"

          def call(method, path, body=None):
              request = urllib.request.Request(
                  API + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  payload = error.read().decode()
                  # The body carries Cloudflare's own error code, which says
                  # WHICH permission is missing. The status alone does not.
                  sys.exit(f"{method} {path} -> HTTP {error.code}: {payload[:400]}")

          zones = call("GET", f"/zones?name={ZONE}")["result"]
          if not zones:
              sys.exit(f"the token cannot see the zone {ZONE}; it is scoped elsewhere "
                       f"or the zone is on another account")
          zone_id = zones[0]["id"]
          print(f"zone {ZONE} is visible: {zone_id}")

          wanted = []
          if os.environ.get("VAL_NAME") and os.environ.get("VAL_VALUE"):
              # DNS-only, deliberately. See the header.
              wanted.append(("CNAME", os.environ["VAL_NAME"].rstrip("."),
                             os.environ["VAL_VALUE"].rstrip("."), False))
          if os.environ.get("KAANA_ALB_DNS"):
              wanted.append(("CNAME", ZONE, os.environ["KAANA_ALB_DNS"].rstrip("."), True))

          if not wanted:
              print("no records requested; nothing to reconcile")
              sys.exit(0)

          existing = call("GET", f"/zones/{zone_id}/dns_records?per_page=200")["result"]
          failed = False
          for kind, name, value, proxied in wanted:
              same_name = [r for r in existing if r["name"].rstrip(".") == name]
              same_kind = [r for r in same_name if r["type"] == kind]
              blockers = [r for r in same_name if r["type"] in {"A", "AAAA", "CNAME"} and r["type"] != kind]
              if blockers:
                  print(f"CONFLICT {name} has address/alias records of type "
                        f"{sorted({r['type'] for r in blockers})}; nothing touched")
                  failed = True
                  continue
              if len(same_kind) > 1:
                  print(f"CONFLICT {name} has {len(same_kind)} {kind} records; nothing touched")
                  failed = True
                  continue
              current = same_kind[0] if same_kind else None
              if (current and current.get("content", "").rstrip(".") == value
                      and current.get("proxied") is proxied):
                  print(f"ok      {name} -> {value}")
                  continue
              if current:
                  print(f"CONFLICT {kind} {name} is {current.get('content')!r} "
                        f"(proxied={current.get('proxied')!r}), wanted {value!r} "
                        f"(proxied={proxied!r}); nothing touched")
                  failed = True
                  continue
              verb = "would create" if os.environ["ACTION"] != "apply" else "creating"
              print(f"{verb} {kind} {name} -> {value} (proxied={proxied})")
              if os.environ["ACTION"] != "apply":
                  continue
              body = {"type": kind, "name": name, "content": value, "ttl": 1, "proxied": proxied}
              created = call("POST", f"/zones/{zone_id}/dns_records", body)
              if not created.get("success"):
                  print(f"FAILED  {kind} {name}: {created.get('errors')}")
                  failed = True
                  continue
              readback = call("GET", f"/zones/{zone_id}/dns_records?type={kind}&name={name}")["result"]
              exact = [r for r in readback if r.get("content", "").rstrip(".") == value
                       and r.get("proxied") is proxied]
              if len(exact) != 1:
                  print(f"FAILED  read-back for {kind} {name}: {readback!r}")
                  failed = True
                  continue
              print(f"set     {kind} {name}")
          sys.exit(1 if failed else 0)
          PY
