name: Provision service credential

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Exact existing Oxy application ID
        required: true
        type: string
      dry_run:
        description: Validate and report the plan without writing
        required: true
        default: true
        type: boolean
      stale_temp_parameter:
        description: Optional failed-run key under /oxy/_ops/service-credential-* to remove first
        required: false
        type: string

concurrency:
  group: provision-service-credential-${{ inputs.app_id }}-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  CONTAINER: oxy-api

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision from the live Oxy API image
        env:
          APP_ID: ${{ inputs.app_id }}
          CREDENTIAL_ENVIRONMENT: production
          DRY_RUN: ${{ inputs.dry_run }}
          STALE_TEMP_PARAMETER: ${{ inputs.stale_temp_parameter }}
          OUTPUT_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_OUTPUT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          # Exact-ID registry. A human label never selects the destination
          # namespace: adding another service requires an explicit reviewed
          # mapping here, so app_id=Kaana cannot overwrite Alia/Noted secrets.
          case "$APP_ID" in
            68b7c4e19f2a6d0e3c8b5174)
              APP_NAMESPACE="kaana"
              SCOPES="inference:byok:validate"
              DESTINATION_KEY_NAME="OXY_APPLICATION_KEY"
              DESTINATION_SECRET_NAME="OXY_APPLICATION_SECRET"
              ;;
            6a2f851751b784a86fd0e922)
              APP_NAMESPACE="homiio"
              SCOPES="reputation:write,inference:invoke"
              DESTINATION_KEY_NAME="OXY_SERVICE_API_KEY"
              DESTINATION_SECRET_NAME="OXY_SERVICE_API_SECRET"
              CREDENTIAL_NAME="Service (production)"
              ISOLATE_CREDENTIAL_NAME="false"
              ;;
            6a2f851751b784a86fd0e916)
              APP_NAMESPACE="mention"
              # One app-owned service principal for the backend and its MCP.
              # It can register/revalidate Mention's own catalog and write its
              # audit events, but it cannot coordinate or issue tickets.
              SCOPES="user:read,files:read,files:write,federation:write,signals:write,catalogs:write,capabilities:read,capability-audit:write"
              DESTINATION_KEY_NAME="OXY_SERVICE_API_KEY"
              DESTINATION_SECRET_NAME="OXY_SERVICE_API_SECRET"
              CREDENTIAL_NAME="Capability plane (production)"
              ISOLATE_CREDENTIAL_NAME="true"
              ;;
            6a2f851751b784a86fd0e934)
              APP_NAMESPACE="alia"
              # Least privilege for the current cutover: Alia hydrates public
              # Oxy user profiles, loads its reviewed capability catalogue and
              # invokes inference. Catalogue mutation, receipt/routing
              # routing administration and agent-session minting are not done
              # with this process credential, even though the application may
              # hold those separately reviewed grants.
              SCOPES="user:read,inference:invoke,capabilities:read"
              DESTINATION_KEY_NAME="OXY_SERVICE_API_KEY"
              DESTINATION_SECRET_NAME="OXY_SERVICE_API_SECRET"
              # The retired inference credential may remain usable through canary.
              # A dedicated exact name makes this lane idempotent without
              # selecting or copying that old credential.
              CREDENTIAL_NAME="Oxy service (production)"
              ISOLATE_CREDENTIAL_NAME="true"
              # This exact named lane predates capabilities:read. Reconcile it
              # by rotation, never by minting an unrelated parallel principal.
              ROTATE_SCOPE_MISMATCH="true"
              ROLLOUT_SERVICE="alia"
              ;;
            *)
              echo "::error::app_id is not registered for service credential delivery"
              exit 1
              ;;
          esac
          CREDENTIAL_NAME="${CREDENTIAL_NAME:-Service (production)}"
          ISOLATE_CREDENTIAL_NAME="${ISOLATE_CREDENTIAL_NAME:-false}"
          ROTATE_SCOPE_MISMATCH="${ROTATE_SCOPE_MISMATCH:-false}"
          ROLLOUT_SERVICE="${ROLLOUT_SERVICE:-}"
          if [[ ! "$SCOPES" =~ ^[a-z0-9:_-]+(,[a-z0-9:_-]+)*$ ]]; then
            echo "::error::scopes must be a comma-separated capability list"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [[ ! "$OUTPUT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::CREDENTIAL_OUTPUT_ENCRYPTION_KEY must be a 32-byte hex GitHub secret"
            exit 1
          fi
          rollout_consumer() {
            [ -z "$ROLLOUT_SERVICE" ] && return
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$ROLLOUT_SERVICE" \
              --force-new-deployment >/dev/null
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "$ROLLOUT_SERVICE"
            rollout_state=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$ROLLOUT_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`].rolloutState | [0]' \
              --output text)
            if [ "$rollout_state" != "COMPLETED" ]; then
              echo "::error::credential consumer rollout did not complete"
              exit 1
            fi
            echo "credential consumer $ROLLOUT_SERVICE reached a completed stable rollout"
          }
          finalize_credential() {
            local credential_id="$1"
            local finalize_service_json finalize_task_definition finalize_network
            local finalize_overrides finalize_run_json finalize_task_arn finalize_task_json
            local finalize_exit_code finalize_task_id finalize_definition_json
            local finalize_log_group finalize_log_prefix finalize_log_json finalize_result_line
            finalize_service_json=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0]' --output json)
            finalize_task_definition=$(jq -er '.taskDefinition' <<<"$finalize_service_json")
            finalize_network=$(jq -ec '.networkConfiguration' <<<"$finalize_service_json")
            finalize_overrides=$(jq -nc \
              --arg container "$CONTAINER" \
              --arg app_id "$APP_ID" \
              --arg credential_id "$credential_id" '
                {containerOverrides:[{
                  name:$container,
                  command:["bun","run","packages/api/scripts/finalize-service-credential.ts"],
                  environment:[
                    {name:"APP_ID",value:$app_id},
                    {name:"FINALIZE_CREDENTIAL_ID",value:$credential_id}
                  ]
                }]}
              ')
            finalize_run_json=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$finalize_task_definition" \
              --launch-type FARGATE \
              --network-configuration "$finalize_network" \
              --overrides "$finalize_overrides" \
              --started-by "gh-svc-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
            finalize_task_arn=$(jq -er '.tasks[0].taskArn' <<<"$finalize_run_json")
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$finalize_task_arn"
            finalize_task_json=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" --tasks "$finalize_task_arn")
            finalize_exit_code=$(jq -er --arg container "$CONTAINER" '
              .tasks[0].containers[] | select(.name == $container) | .exitCode
            ' <<<"$finalize_task_json")
            finalize_definition_json=$(aws ecs describe-task-definition \
              --task-definition "$finalize_task_definition" \
              --query taskDefinition --output json)
            finalize_log_group=$(jq -er --arg container "$CONTAINER" '
              .containerDefinitions[] | select(.name == $container) |
              .logConfiguration.options["awslogs-group"]
            ' <<<"$finalize_definition_json")
            finalize_log_prefix=$(jq -er --arg container "$CONTAINER" '
              .containerDefinitions[] | select(.name == $container) |
              .logConfiguration.options["awslogs-stream-prefix"]
            ' <<<"$finalize_definition_json")
            finalize_task_id=${finalize_task_arn##*/}
            finalize_result_line=""
            for _attempt in $(seq 1 10); do
              finalize_log_json=$(aws logs get-log-events \
                --log-group-name "$finalize_log_group" \
                --log-stream-name "$finalize_log_prefix/$CONTAINER/$finalize_task_id" \
                --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
              finalize_result_line=$(jq -r '.events[].message' <<<"$finalize_log_json" |
                grep '^SERVICE_CRED_FINALIZED_JSON=' | tail -1 || true)
              [ -n "$finalize_result_line" ] && break
              sleep 3
            done
            if [ "$finalize_exit_code" != "0" ] || [ -z "$finalize_result_line" ]; then
              jq -r '.events[].message' <<<"$finalize_log_json"
              echo "::error::pending credential finalization failed closed"
              return 1
            fi
            jq -e --arg credential_id "$credential_id" '
              .credentialId == $credential_id and
              (.status == "finalized" or .status == "already_finalized")
            ' <<<"${finalize_result_line#SERVICE_CRED_FINALIZED_JSON=}" >/dev/null
            echo "pending credential $credential_id finalized after durable handoff state"
          }
          if [ -n "$STALE_TEMP_PARAMETER" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::error::stale_temp_parameter recovery requires dry_run=false"
              exit 1
            fi
            if [[ "$STALE_TEMP_PARAMETER" =~ ^/oxy/_ops/service-credential-${APP_NAMESPACE}-([0-9]+)-([0-9]+)$ ]]; then
              recovery_run_id="${BASH_REMATCH[1]}"
              recovery_run_attempt="${BASH_REMATCH[2]}"
            else
              echo "::error::stale_temp_parameter does not belong to this exact application"
              exit 1
            fi
            recovery_package=$(aws ssm get-parameter \
              --name "$STALE_TEMP_PARAMETER" --with-decryption \
              --query 'Parameter.Value' --output text)
            if [[ "$recovery_package" =~ ^[0-9a-fA-F]{64}$ ]]; then
              recovery_encryption_key="$recovery_package"
              echo "::add-mask::$recovery_encryption_key"
              recovery_binding=$(aws ssm get-parameter \
                --name "$STALE_TEMP_PARAMETER-binding" --with-decryption \
                --query 'Parameter.Value' --output text)
              recovery_task_arn=$(jq -er \
                --arg run_id "$recovery_run_id" \
                --arg run_attempt "$recovery_run_attempt" '
                  select(.schemaVersion == 1 and .runId == $run_id and
                    .runAttempt == $run_attempt) | .taskArn
                ' <<<"$recovery_binding")
              recovery_task_json=$(aws ecs describe-tasks \
                --cluster "$CLUSTER" --tasks "$recovery_task_arn")
              recovery_task_definition=$(jq -er '.tasks[0].taskDefinitionArn' <<<"$recovery_task_json")
              recovery_definition_json=$(aws ecs describe-task-definition \
                --task-definition "$recovery_task_definition" \
                --query taskDefinition --output json)
              recovery_log_group=$(jq -r --arg container "$CONTAINER" '
                .containerDefinitions[] | select(.name == $container) |
                .logConfiguration.options["awslogs-group"]
              ' <<<"$recovery_definition_json")
              recovery_log_prefix=$(jq -r --arg container "$CONTAINER" '
                .containerDefinitions[] | select(.name == $container) |
                .logConfiguration.options["awslogs-stream-prefix"]
              ' <<<"$recovery_definition_json")
              recovery_task_id=${recovery_task_arn##*/}
              recovery_log_json=$(aws logs get-log-events \
                --log-group-name "$recovery_log_group" \
                --log-stream-name "$recovery_log_prefix/$CONTAINER/$recovery_task_id" \
                --start-from-head --output json)
              recovery_result_line=$(jq -r '.events[].message' <<<"$recovery_log_json" |
                grep '^SERVICE_CRED_JSON=' | tail -1)
              recovery_result=${recovery_result_line#SERVICE_CRED_JSON=}
              recovery_public_key=$(jq -er '.publicKey' <<<"$recovery_result")
              recovery_secret=$(RESULT_JSON="$recovery_result" ENCRYPTION_KEY="$recovery_encryption_key" node -e '
                const crypto = require("node:crypto");
                const envelope = JSON.parse(process.env.RESULT_JSON).secretEnc;
                if (!envelope) throw new Error("missing encrypted recovery secret");
                const decipher = crypto.createDecipheriv(
                  "aes-256-gcm",
                  Buffer.from(process.env.ENCRYPTION_KEY, "hex"),
                  Buffer.from(envelope.ivB64, "base64"),
                );
                decipher.setAuthTag(Buffer.from(envelope.tagB64, "base64"));
                process.stdout.write(Buffer.concat([
                  decipher.update(Buffer.from(envelope.ciphertextB64, "base64")),
                  decipher.final(),
                ]).toString("utf8"));
              ')
              echo "::add-mask::$recovery_secret"
              recovery_package=$(jq -nc \
                --arg app_id "$(jq -er '.applicationId' <<<"$recovery_result")" \
                --arg credential_id "$(jq -er '.credentialId' <<<"$recovery_result")" \
                --arg credential_name "$CREDENTIAL_NAME" \
                --arg environment "$(jq -er '.environment' <<<"$recovery_result")" \
                --argjson scopes "$(jq -c '.scopes' <<<"$recovery_result")" \
                --argjson requires_finalization "$(jq '.requiresFinalization // false' <<<"$recovery_result")" \
                --arg public_key "$recovery_public_key" \
                --arg secret "$recovery_secret" '
                  {schemaVersion:1, applicationId:$app_id, credentialId:$credential_id,
                   credentialName:$credential_name, environment:$environment,
                   scopes:$scopes, requiresFinalization:$requires_finalization,
                   publicKey:$public_key, secret:$secret}
                ')
              printf '%s' "$recovery_package" | \
                bash .github/scripts/put-secure-parameter.sh \
                  "$STALE_TEMP_PARAMETER" overwrite \
                  "Recoverable exact credential handoff for application $APP_ID"
              unset recovery_encryption_key recovery_result recovery_result_line \
                recovery_secret recovery_log_json
            fi
            recovery_package=$(jq -c '.requiresFinalization //= false' <<<"$recovery_package")
            if jq -e \
              --arg app_id "$APP_ID" \
              --arg environment "$CREDENTIAL_ENVIRONMENT" \
              --arg scopes "$SCOPES" \
              --arg credential_name "${CREDENTIAL_NAME:-Service (production)}" '
                .schemaVersion == 1 and
                .applicationId == $app_id and
                .environment == $environment and
                .credentialName == $credential_name and
                ((.scopes | sort) == ($scopes | split(",") | sort)) and
                (.credentialId | type == "string") and
                (.requiresFinalization | type == "boolean")
              ' <<<"$recovery_package" >/dev/null 2>&1; then
              recovery_public_key=$(jq -er '.publicKey' <<<"$recovery_package")
              recovery_secret=$(jq -er '.secret' <<<"$recovery_package")
              echo "::add-mask::$recovery_public_key"
              echo "::add-mask::$recovery_secret"
              if [ "$(jq -r '.requiresFinalization' <<<"$recovery_package")" = "true" ]; then
                finalize_credential "$(jq -er '.credentialId' <<<"$recovery_package")"
              fi
              printf '%s' "$recovery_package" | \
                bash .github/scripts/handoff-service-credential-pair.sh \
                  "/oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME" \
                  "/oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME"
              unset recovery_package recovery_public_key recovery_secret OUTPUT_ENCRYPTION_KEY
              aws ssm delete-parameter --name "$STALE_TEMP_PARAMETER" >/dev/null
              aws ssm delete-parameter --name "$STALE_TEMP_PARAMETER-binding" >/dev/null
              rollout_consumer
              echo "recovered exact credential handoff from $STALE_TEMP_PARAMETER"
              exit 0
            fi
            unset recovery_package OUTPUT_ENCRYPTION_KEY
            echo "::error::stale recovery material did not match the exact registered application; it was preserved"
            exit 1
          fi

          temp_parameter="/oxy/_ops/service-credential-${APP_NAMESPACE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          binding_parameter="$temp_parameter-binding"
          temp_task_definition=""
          preserve_temp_parameter="false"
          cleanup_best_effort() {
            if [ -n "$temp_task_definition" ]; then
              aws ecs deregister-task-definition \
                --task-definition "$temp_task_definition" >/dev/null 2>&1 || true
            fi
            if [ "$preserve_temp_parameter" != "true" ]; then
              aws ssm delete-parameter --name "$temp_parameter" >/dev/null 2>&1 || true
              aws ssm delete-parameter --name "$binding_parameter" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_best_effort EXIT

          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [ "$(jq -r '.status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::Oxy API service is not active"
            exit 1
          fi
          live_task_definition=$(jq -r '.taskDefinition' <<<"$service_json")
          network=$(jq -c '.networkConfiguration' <<<"$service_json")
          live_task_json=$(aws ecs describe-task-definition \
            --task-definition "$live_task_definition" \
            --query taskDefinition --output json)
          run_task_definition="$live_task_definition"

          # The operator-held key reaches the task through an ephemeral SSM
          # reference. Its value never appears in run-task overrides or logs.
          if [ "$DRY_RUN" != "true" ]; then
            printf '%s' "$OUTPUT_ENCRYPTION_KEY" | \
              bash .github/scripts/put-secure-parameter.sh \
                "$temp_parameter" create \
                "Ephemeral credential envelope key for application $APP_ID"
            parameter_arn="arn:aws:ssm:$AWS_REGION:237343248947:parameter/${temp_parameter#/}"
            rendered_task_json=$(jq \
              --arg container "$CONTAINER" \
              --arg parameter "$parameter_arn" '
                .containerDefinitions |= map(
                  if .name == $container then
                    .secrets = (
                      ((.secrets // []) | map(select(.name != "OUTPUT_ENCRYPTION_KEY"))) +
                      [{name:"OUTPUT_ENCRYPTION_KEY", valueFrom:$parameter}]
                    )
                  else . end
                )
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy,
                    .deregisteredAt
                  )
              ' <<<"$live_task_json")
            temp_task_definition=$(aws ecs register-task-definition \
              --cli-input-json "$rendered_task_json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            run_task_definition="$temp_task_definition"
          fi

          # Kaana predates the named-isolation lane and keeps its original
          # all-service-credential ambiguity guard.
          overrides=$(jq -nc \
            --arg container "$CONTAINER" \
            --arg app_id "$APP_ID" \
            --arg scopes "$SCOPES" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg credential_name "$CREDENTIAL_NAME" \
            --arg isolate_name "$ISOLATE_CREDENTIAL_NAME" \
            --arg rotate_scope_mismatch "$ROTATE_SCOPE_MISMATCH" \
            --arg dry "$DRY_RUN" '
              {containerOverrides:[{
                name:$container,
                command:["bun","run","packages/api/scripts/create-service-credential.ts"],
                environment:[
                  {name:"APP_ID",value:$app_id},
                  {name:"SCOPES",value:$scopes},
                  {name:"ENVIRONMENT",value:$environment},
                  {name:"CREDENTIAL_NAME",value:$credential_name},
                  {name:"ISOLATE_CREDENTIAL_NAME",value:$isolate_name},
                  {name:"ROTATE_SCOPE_MISMATCH",value:$rotate_scope_mismatch},
                  {name:"DRY_RUN",value:$dry}
                ]
              }]}
            ')
          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$run_task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "gh-svc-cred-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start provisioning: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          if [ "$DRY_RUN" != "true" ]; then
            binding=$(jq -nc \
              --arg task_arn "$task_arn" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" '
                {schemaVersion:1, taskArn:$task_arn, runId:$run_id,
                 runAttempt:$run_attempt}
              ')
            preserve_temp_parameter="true"
            if ! printf '%s' "$binding" | \
              bash .github/scripts/put-secure-parameter.sh \
                "$binding_parameter" create \
                "Exact credential task binding for application $APP_ID"; then
              aws ecs stop-task --cluster "$CLUSTER" --task "$task_arn" \
                --reason "credential recovery binding could not be persisted" >/dev/null
              echo "::error::credential task binding could not be persisted; task was stopped and recovery key preserved at $temp_parameter"
              exit 1
            fi
            unset binding
          fi

          echo "credential task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn")
          exit_code=$(jq -r --arg container "$CONTAINER" '
            .tasks[0].containers[] | select(.name == $container) | .exitCode
          ' <<<"$task_json")

          task_id=${task_arn##*/}
          log_group=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-group"]
          ' <<<"$live_task_json")
          log_prefix=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-stream-prefix"]
          ' <<<"$live_task_json")
          result_line=""
          for _attempt in $(seq 1 10); do
            log_json=$(aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_prefix/$CONTAINER/$task_id" \
              --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
            result_line=$(jq -r '.events[].message' <<<"$log_json" |
              grep '^SERVICE_CRED_JSON=' | tail -1 || true)
            [ -n "$result_line" ] && break
            sleep 3
          done

          if [ "$exit_code" != "0" ]; then
            echo "::group::credential task scoped CloudWatch log"
            jq -r '
              .events[].message |
              select(startswith("SERVICE_CRED_JSON=") | not)
            ' <<<"$log_json"
            echo "::endgroup::"
            if [ -z "$result_line" ]; then
              echo "::error::credential task exited $exit_code before emitting commit evidence"
              exit 1
            fi
            echo "::warning::credential task exited $exit_code after emitting commit evidence; continuing recoverably"
          fi
          if [ -z "$result_line" ]; then
            echo "::group::credential task scoped CloudWatch log"
            jq -r '
              .events[].message |
              select(startswith("SERVICE_CRED_JSON=") | not)
            ' <<<"$log_json"
            echo "::endgroup::"
            echo "::error::credential task emitted no result envelope"
            exit 1
          fi

          result_json=${result_line#SERVICE_CRED_JSON=}
          jq -e \
            --arg app_id "$APP_ID" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg scopes "$SCOPES" '
              .applicationId == $app_id and
              .environment == $environment and
              ((.scopes | sort) == ($scopes | split(",") | sort)) and
              (.requiresFinalization | type == "boolean") and
              (.action == "create" or .action == "reuse" or .action == "rotate")
            ' <<<"$result_json" >/dev/null
          echo "$result_line"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run completed; SSM unchanged"
            exit 0
          fi
          if [ "$(jq -r '.reused' <<<"$result_json")" != "false" ]; then
            public_key=$(jq -er '.publicKey' <<<"$result_json")
            echo "::add-mask::$public_key"
            EXPECTED_PUBLIC_KEY="$public_key" \
            SSM_KEY_PARAMETER="/oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME" \
            SSM_SECRET_PARAMETER="/oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME" \
              bash .github/scripts/verify-reused-service-credential.sh
            unset public_key OUTPUT_ENCRYPTION_KEY result_json result_line
          else
            public_key=$(jq -er '.publicKey' <<<"$result_json")
            secret=$(RESULT_JSON="$result_json" ENCRYPTION_KEY="$OUTPUT_ENCRYPTION_KEY" node -e '
            const crypto = require("node:crypto");
            const row = JSON.parse(process.env.RESULT_JSON);
            const envelope = row.secretEnc;
            if (!envelope) throw new Error("missing encrypted secret");
            const decipher = crypto.createDecipheriv(
              "aes-256-gcm",
              Buffer.from(process.env.ENCRYPTION_KEY, "hex"),
              Buffer.from(envelope.ivB64, "base64"),
            );
            decipher.setAuthTag(Buffer.from(envelope.tagB64, "base64"));
            process.stdout.write(Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertextB64, "base64")),
              decipher.final(),
            ]).toString("utf8"));
            ')
            if [ ${#secret} -ne 64 ]; then
              echo "::error::decrypted service secret has an invalid length"
              exit 1
            fi
            echo "::add-mask::$public_key"
            echo "::add-mask::$secret"

            recovery_package=$(jq -nc \
              --arg app_id "$APP_ID" \
              --arg credential_id "$(jq -er '.credentialId' <<<"$result_json")" \
              --arg credential_name "$CREDENTIAL_NAME" \
              --arg environment "$CREDENTIAL_ENVIRONMENT" \
              --arg scopes "$SCOPES" \
              --argjson requires_finalization "$(jq '.requiresFinalization' <<<"$result_json")" \
              --arg public_key "$public_key" \
              --arg secret "$secret" '
                {
                  schemaVersion:1,
                  applicationId:$app_id,
                  credentialId:$credential_id,
                  credentialName:$credential_name,
                  environment:$environment,
                  scopes:($scopes | split(",")),
                  requiresFinalization:$requires_finalization,
                  publicKey:$public_key,
                  secret:$secret
                }
              ')
            preserve_temp_parameter="true"
            if ! printf '%s' "$recovery_package" | \
              bash .github/scripts/put-secure-parameter.sh \
                "$temp_parameter" overwrite \
                "Recoverable exact credential handoff for application $APP_ID"; then
              unset secret recovery_package public_key OUTPUT_ENCRYPTION_KEY result_json result_line
              echo "::error::recovery package write failed; rerun with stale_temp_parameter=$temp_parameter"
              exit 1
            fi
            if [ "$(jq -r '.requiresFinalization' <<<"$recovery_package")" = "true" ]; then
              finalize_credential "$(jq -er '.credentialId' <<<"$recovery_package")"
            fi
            if ! printf '%s' "$recovery_package" | \
              bash .github/scripts/handoff-service-credential-pair.sh \
                "/oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME" \
                "/oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME"; then
              unset secret recovery_package public_key OUTPUT_ENCRYPTION_KEY result_json result_line
              echo "::error::credential handoff incomplete; rerun with stale_temp_parameter=$temp_parameter"
              exit 1
            fi
            unset secret recovery_package public_key OUTPUT_ENCRYPTION_KEY result_json result_line
          fi

          # A successful run is not complete until both ephemeral resources are
          # gone. The EXIT trap remains as a retry for every earlier failure.
          aws ecs deregister-task-definition \
            --task-definition "$temp_task_definition" >/dev/null
          temp_task_definition=""
          aws ssm delete-parameter --name "$temp_parameter" >/dev/null
          aws ssm delete-parameter --name "$binding_parameter" >/dev/null
          preserve_temp_parameter="false"
          trap - EXIT
          echo "stored production service credential for exact application $APP_ID in /oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME and /oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME"

          rollout_consumer
