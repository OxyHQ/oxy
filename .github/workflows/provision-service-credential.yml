name: Provision service credential

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Existing Oxy application name
        required: true
        type: string
      app_slug:
        description: SSM namespace under /oxy (for example noted)
        required: true
        type: string
      owner_username:
        description: Existing Oxy owner username
        required: true
        default: oxy
        type: string
      scopes:
        description: Exact comma-separated service scopes
        required: true
        type: string
      environment:
        description: Credential environment
        required: true
        default: production
        type: choice
        options:
          - development
          - staging
          - production
      dry_run:
        description: Validate and report the plan without writing
        required: true
        default: true
        type: boolean

concurrency:
  group: provision-service-credential-${{ inputs.app_slug }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  CONTAINER: oxy-api

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision from the live Oxy API image
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_SLUG: ${{ inputs.app_slug }}
          OWNER_USERNAME: ${{ inputs.owner_username }}
          SCOPES: ${{ inputs.scopes }}
          CREDENTIAL_ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUTPUT_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_OUTPUT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::app_slug must be lowercase kebab-case"
            exit 1
          fi
          if [[ ! "$SCOPES" =~ ^[a-z0-9:_-]+(,[a-z0-9:_-]+)*$ ]]; then
            echo "::error::scopes must be a comma-separated capability list"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [[ ! "$OUTPUT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::CREDENTIAL_OUTPUT_ENCRYPTION_KEY must be a 32-byte hex GitHub secret"
            exit 1
          fi

          temp_parameter="/oxy/_ops/service-credential-${APP_SLUG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp_task_definition=""
          cleanup() {
            if [ -n "$temp_task_definition" ]; then
              aws ecs deregister-task-definition \
                --task-definition "$temp_task_definition" >/dev/null 2>&1 || true
            fi
            aws ssm delete-parameter --name "$temp_parameter" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [ "$(jq -r '.status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::Oxy API service is not active"
            exit 1
          fi
          live_task_definition=$(jq -r '.taskDefinition' <<<"$service_json")
          network=$(jq -c '.networkConfiguration' <<<"$service_json")
          live_task_json=$(aws ecs describe-task-definition \
            --task-definition "$live_task_definition" \
            --query taskDefinition --output json)
          run_task_definition="$live_task_definition"

          # The operator-held key reaches the task through an ephemeral SSM
          # reference. Its value never appears in run-task overrides or logs.
          if [ "$DRY_RUN" != "true" ]; then
            aws ssm put-parameter \
              --name "$temp_parameter" \
              --type SecureString \
              --value "$OUTPUT_ENCRYPTION_KEY" \
              --description "Ephemeral credential envelope key for $APP_NAME" >/dev/null
            parameter_arn=$(aws ssm get-parameter \
              --name "$temp_parameter" --query 'Parameter.ARN' --output text)
            rendered_task_json=$(jq \
              --arg container "$CONTAINER" \
              --arg parameter "$parameter_arn" '
                .containerDefinitions |= map(
                  if .name == $container then
                    .secrets = (
                      ((.secrets // []) | map(select(.name != "OUTPUT_ENCRYPTION_KEY"))) +
                      [{name:"OUTPUT_ENCRYPTION_KEY", valueFrom:$parameter}]
                    )
                  else . end
                )
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy,
                    .deregisteredAt
                  )
              ' <<<"$live_task_json")
            temp_task_definition=$(aws ecs register-task-definition \
              --cli-input-json "$rendered_task_json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            run_task_definition="$temp_task_definition"
          fi

          overrides=$(jq -nc \
            --arg container "$CONTAINER" \
            --arg app "$APP_NAME" \
            --arg owner "$OWNER_USERNAME" \
            --arg scopes "$SCOPES" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg dry "$DRY_RUN" '
              {containerOverrides:[{
                name:$container,
                command:["bun","run","packages/api/scripts/create-service-credential.ts"],
                environment:[
                  {name:"APP_NAME",value:$app},
                  {name:"OWNER_USERNAME",value:$owner},
                  {name:"SCOPES",value:$scopes},
                  {name:"ENVIRONMENT",value:$environment},
                  {name:"DRY_RUN",value:$dry}
                ]
              }]}
            ')
          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$run_task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "gh-service-credential-${GITHUB_RUN_ID}")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start provisioning: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "credential task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn")
          exit_code=$(jq -r --arg container "$CONTAINER" '
            .tasks[0].containers[] | select(.name == $container) | .exitCode
          ' <<<"$task_json")

          task_id=${task_arn##*/}
          log_group=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-group"]
          ' <<<"$live_task_json")
          log_prefix=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-stream-prefix"]
          ' <<<"$live_task_json")
          result_line=""
          for _attempt in $(seq 1 10); do
            log_json=$(aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_prefix/$CONTAINER/$task_id" \
              --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
            result_line=$(jq -r '.events[].message' <<<"$log_json" |
              grep '^SERVICE_CRED_JSON=' | tail -1 || true)
            [ -n "$result_line" ] && break
            sleep 3
          done

          if [ "$exit_code" != "0" ]; then
            echo "::error::credential task exited $exit_code"
            exit 1
          fi
          if [ -z "$result_line" ]; then
            echo "::error::credential task emitted no result envelope"
            exit 1
          fi

          result_json=${result_line#SERVICE_CRED_JSON=}
          jq -e \
            --arg app "$APP_NAME" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" '
              .app == $app and .environment == $environment
            ' <<<"$result_json" >/dev/null
          echo "$result_line"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run completed; SSM unchanged"
            exit 0
          fi
          if [ "$(jq -r '.reused' <<<"$result_json")" != "false" ]; then
            echo "::error::existing secrets are not recoverable; rotate explicitly"
            exit 1
          fi

          public_key=$(jq -er '.publicKey' <<<"$result_json")
          secret=$(RESULT_JSON="$result_json" ENCRYPTION_KEY="$OUTPUT_ENCRYPTION_KEY" node -e '
            const crypto = require("node:crypto");
            const row = JSON.parse(process.env.RESULT_JSON);
            const envelope = row.secretEnc;
            if (!envelope) throw new Error("missing encrypted secret");
            const decipher = crypto.createDecipheriv(
              "aes-256-gcm",
              Buffer.from(process.env.ENCRYPTION_KEY, "hex"),
              Buffer.from(envelope.ivB64, "base64"),
            );
            decipher.setAuthTag(Buffer.from(envelope.tagB64, "base64"));
            process.stdout.write(Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertextB64, "base64")),
              decipher.final(),
            ]).toString("utf8"));
          ')
          if [ ${#secret} -ne 64 ]; then
            echo "::error::decrypted service secret has an invalid length"
            exit 1
          fi
          echo "::add-mask::$public_key"
          echo "::add-mask::$secret"

          aws ssm put-parameter \
            --name "/oxy/$APP_SLUG/OXY_APPLICATION_KEY" \
            --type SecureString --value "$public_key" --overwrite >/dev/null
          aws ssm put-parameter \
            --name "/oxy/$APP_SLUG/OXY_APPLICATION_SECRET" \
            --type SecureString --value "$secret" --overwrite >/dev/null
          unset secret OUTPUT_ENCRYPTION_KEY result_json result_line
          echo "stored production service credential in /oxy/$APP_SLUG"
