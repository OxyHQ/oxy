name: Provision service credential

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Exact existing Oxy application ID
        required: true
        type: string
      dry_run:
        description: Validate and report the plan without writing
        required: true
        default: true
        type: boolean
      stale_temp_parameter:
        description: Optional failed-run key under /oxy/_ops/service-credential-* to remove first
        required: false
        type: string

concurrency:
  group: provision-service-credential-${{ inputs.app_id }}-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER: oxy-cluster
  SERVICE: oxy-api
  CONTAINER: oxy-api

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision from the live Oxy API image
        env:
          APP_ID: ${{ inputs.app_id }}
          CREDENTIAL_ENVIRONMENT: production
          DRY_RUN: ${{ inputs.dry_run }}
          STALE_TEMP_PARAMETER: ${{ inputs.stale_temp_parameter }}
          OUTPUT_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_OUTPUT_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          # Exact-ID registry. A human label never selects the destination
          # namespace: adding another service requires an explicit reviewed
          # mapping here, so app_id=Kaana cannot overwrite Alia/Noted secrets.
          case "$APP_ID" in
            68b7c4e19f2a6d0e3c8b5174)
              APP_NAMESPACE="kaana"
              SCOPES="inference:byok:validate"
              DESTINATION_KEY_NAME="OXY_APPLICATION_KEY"
              DESTINATION_SECRET_NAME="OXY_APPLICATION_SECRET"
              ;;
            6a2f851751b784a86fd0e922)
              APP_NAMESPACE="homiio"
              SCOPES="reputation:write,inference:invoke"
              DESTINATION_KEY_NAME="OXY_SERVICE_API_KEY"
              DESTINATION_SECRET_NAME="OXY_SERVICE_API_SECRET"
              CREDENTIAL_NAME="Service (production)"
              ISOLATE_CREDENTIAL_NAME="false"
              ;;
            6a2f851751b784a86fd0e934)
              APP_NAMESPACE="alia"
              # Least privilege for the current cutover: Alia hydrates public
              # Oxy user profiles and invokes inference. Catalogue/receipt/
              # routing administration and agent-session minting are not done
              # with this process credential, even though the application may
              # hold those separately reviewed grants.
              SCOPES="user:read,inference:invoke"
              DESTINATION_KEY_NAME="OXY_SERVICE_API_KEY"
              DESTINATION_SECRET_NAME="OXY_SERVICE_API_SECRET"
              # The retired Relay credential may remain usable through canary.
              # A dedicated exact name makes this lane idempotent without
              # selecting or copying that old credential.
              CREDENTIAL_NAME="Oxy service (production)"
              ISOLATE_CREDENTIAL_NAME="true"
              ;;
            *)
              echo "::error::app_id is not registered for service credential delivery"
              exit 1
              ;;
          esac
          if [[ ! "$SCOPES" =~ ^[a-z0-9:_-]+(,[a-z0-9:_-]+)*$ ]]; then
            echo "::error::scopes must be a comma-separated capability list"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [[ ! "$OUTPUT_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::CREDENTIAL_OUTPUT_ENCRYPTION_KEY must be a 32-byte hex GitHub secret"
            exit 1
          fi
          if [ -n "$STALE_TEMP_PARAMETER" ]; then
            if [[ ! "$STALE_TEMP_PARAMETER" =~ ^/oxy/_ops/service-credential-${APP_NAMESPACE}-[0-9]+-[0-9]+$ ]]; then
              echo "::error::stale_temp_parameter does not belong to this exact application"
              exit 1
            fi
            aws ssm delete-parameter --name "$STALE_TEMP_PARAMETER" >/dev/null
            echo "removed stale credential envelope key"
          fi

          temp_parameter="/oxy/_ops/service-credential-${APP_NAMESPACE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temp_task_definition=""
          cleanup_best_effort() {
            if [ -n "$temp_task_definition" ]; then
              aws ecs deregister-task-definition \
                --task-definition "$temp_task_definition" >/dev/null 2>&1 || true
            fi
            aws ssm delete-parameter --name "$temp_parameter" >/dev/null 2>&1 || true
          }
          trap cleanup_best_effort EXIT

          service_json=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [ "$(jq -r '.status // "NONE"' <<<"$service_json")" != "ACTIVE" ]; then
            echo "::error::Oxy API service is not active"
            exit 1
          fi
          live_task_definition=$(jq -r '.taskDefinition' <<<"$service_json")
          network=$(jq -c '.networkConfiguration' <<<"$service_json")
          live_task_json=$(aws ecs describe-task-definition \
            --task-definition "$live_task_definition" \
            --query taskDefinition --output json)
          run_task_definition="$live_task_definition"

          # The operator-held key reaches the task through an ephemeral SSM
          # reference. Its value never appears in run-task overrides or logs.
          if [ "$DRY_RUN" != "true" ]; then
            printf '%s' "$OUTPUT_ENCRYPTION_KEY" | \
              bash .github/scripts/put-secure-parameter.sh \
                "$temp_parameter" create \
                "Ephemeral credential envelope key for application $APP_ID"
            parameter_arn="arn:aws:ssm:$AWS_REGION:237343248947:parameter/${temp_parameter#/}"
            rendered_task_json=$(jq \
              --arg container "$CONTAINER" \
              --arg parameter "$parameter_arn" '
                .containerDefinitions |= map(
                  if .name == $container then
                    .secrets = (
                      ((.secrets // []) | map(select(.name != "OUTPUT_ENCRYPTION_KEY"))) +
                      [{name:"OUTPUT_ENCRYPTION_KEY", valueFrom:$parameter}]
                    )
                  else . end
                )
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy,
                    .deregisteredAt
                  )
              ' <<<"$live_task_json")
            temp_task_definition=$(aws ecs register-task-definition \
              --cli-input-json "$rendered_task_json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            run_task_definition="$temp_task_definition"
          fi

          # Kaana predates the named-isolation lane and keeps its original
          # all-service-credential ambiguity guard.
          CREDENTIAL_NAME="${CREDENTIAL_NAME:-Service (production)}"
          ISOLATE_CREDENTIAL_NAME="${ISOLATE_CREDENTIAL_NAME:-false}"
          overrides=$(jq -nc \
            --arg container "$CONTAINER" \
            --arg app_id "$APP_ID" \
            --arg scopes "$SCOPES" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" \
            --arg credential_name "$CREDENTIAL_NAME" \
            --arg isolate_name "$ISOLATE_CREDENTIAL_NAME" \
            --arg dry "$DRY_RUN" '
              {containerOverrides:[{
                name:$container,
                command:["bun","run","packages/api/scripts/create-service-credential.ts"],
                environment:[
                  {name:"APP_ID",value:$app_id},
                  {name:"SCOPES",value:$scopes},
                  {name:"ENVIRONMENT",value:$environment},
                  {name:"CREDENTIAL_NAME",value:$credential_name},
                  {name:"ISOLATE_CREDENTIAL_NAME",value:$isolate_name},
                  {name:"DRY_RUN",value:$dry}
                ]
              }]}
            ')
          run_json=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$run_task_definition" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --started-by "gh-service-credential-${GITHUB_RUN_ID}")
          task_arn=$(jq -r '.tasks[0].taskArn // empty' <<<"$run_json")
          if [ -z "$task_arn" ]; then
            echo "::error::ECS did not start provisioning: $(jq -c '.failures' <<<"$run_json")"
            exit 1
          fi

          echo "credential task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          task_json=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn")
          exit_code=$(jq -r --arg container "$CONTAINER" '
            .tasks[0].containers[] | select(.name == $container) | .exitCode
          ' <<<"$task_json")

          task_id=${task_arn##*/}
          log_group=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-group"]
          ' <<<"$live_task_json")
          log_prefix=$(jq -r --arg container "$CONTAINER" '
            .containerDefinitions[] | select(.name == $container) |
            .logConfiguration.options["awslogs-stream-prefix"]
          ' <<<"$live_task_json")
          result_line=""
          for _attempt in $(seq 1 10); do
            log_json=$(aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_prefix/$CONTAINER/$task_id" \
              --start-from-head --output json 2>/dev/null || printf '{"events":[]}')
            result_line=$(jq -r '.events[].message' <<<"$log_json" |
              grep '^SERVICE_CRED_JSON=' | tail -1 || true)
            [ -n "$result_line" ] && break
            sleep 3
          done

          if [ "$exit_code" != "0" ]; then
            echo "::error::credential task exited $exit_code"
            exit 1
          fi
          if [ -z "$result_line" ]; then
            echo "::error::credential task emitted no result envelope"
            exit 1
          fi

          result_json=${result_line#SERVICE_CRED_JSON=}
          jq -e \
            --arg app_id "$APP_ID" \
            --arg environment "$CREDENTIAL_ENVIRONMENT" '
              .applicationId == $app_id and .environment == $environment
            ' <<<"$result_json" >/dev/null
          echo "$result_line"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run completed; SSM unchanged"
            exit 0
          fi
          if [ "$(jq -r '.reused' <<<"$result_json")" != "false" ]; then
            public_key=$(jq -er '.publicKey' <<<"$result_json")
            echo "::add-mask::$public_key"
            EXPECTED_PUBLIC_KEY="$public_key" \
            SSM_KEY_PARAMETER="/oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME" \
            SSM_SECRET_PARAMETER="/oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME" \
              bash .github/scripts/verify-reused-service-credential.sh
            unset public_key OUTPUT_ENCRYPTION_KEY result_json result_line
            exit 0
          fi

          public_key=$(jq -er '.publicKey' <<<"$result_json")
          secret=$(RESULT_JSON="$result_json" ENCRYPTION_KEY="$OUTPUT_ENCRYPTION_KEY" node -e '
            const crypto = require("node:crypto");
            const row = JSON.parse(process.env.RESULT_JSON);
            const envelope = row.secretEnc;
            if (!envelope) throw new Error("missing encrypted secret");
            const decipher = crypto.createDecipheriv(
              "aes-256-gcm",
              Buffer.from(process.env.ENCRYPTION_KEY, "hex"),
              Buffer.from(envelope.ivB64, "base64"),
            );
            decipher.setAuthTag(Buffer.from(envelope.tagB64, "base64"));
            process.stdout.write(Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertextB64, "base64")),
              decipher.final(),
            ]).toString("utf8"));
          ')
          if [ ${#secret} -ne 64 ]; then
            echo "::error::decrypted service secret has an invalid length"
            exit 1
          fi
          echo "::add-mask::$public_key"
          echo "::add-mask::$secret"

          printf '%s' "$public_key" | \
            bash .github/scripts/put-secure-parameter.sh \
              "/oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME" overwrite
          printf '%s' "$secret" | \
            bash .github/scripts/put-secure-parameter.sh \
              "/oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME" overwrite
          unset secret OUTPUT_ENCRYPTION_KEY result_json result_line

          # A successful run is not complete until both ephemeral resources are
          # gone. The EXIT trap remains as a retry for every earlier failure.
          aws ecs deregister-task-definition \
            --task-definition "$temp_task_definition" >/dev/null
          temp_task_definition=""
          aws ssm delete-parameter --name "$temp_parameter" >/dev/null
          trap - EXIT
          echo "stored production service credential for exact application $APP_ID in /oxy/$APP_NAMESPACE/$DESTINATION_KEY_NAME and /oxy/$APP_NAMESPACE/$DESTINATION_SECRET_NAME"
