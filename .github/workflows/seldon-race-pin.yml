name: Seldon race pin

# The race's reusable workflows (seldon-race-start, -finish, -retry) call the
# seldon-race action at a full commit SHA, because a repository that requires
# SHA pins (`sha_pinning_required`, OxyHQ/tnp) refuses `@main` inside a workflow
# it calls (docs/engineering/build-and-deploy.md#ci-on-seldon).
#
# When the action changes on main, this opens (or updates) ONE issue asking for
# the pin bump, with the exact command. It cannot open the pull request
# itself: GitHub refuses any push by GITHUB_TOKEN that changes a file under
# .github/workflows/ ("refusing to allow a GitHub App to create or update
# workflow", run 45925623384), and no token with the `workflows` scope is
# given to Actions here. Until the bump merges, the reusable workflows keep the
# previous action; callers' guard and verdict steps that use `@main` already
# have the new one.

on:
  push:
    branches: [main]
    paths:
      - .github/actions/seldon-race/**

permissions: {}

concurrency:
  group: seldon-race-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ask for the pin bump when the reusable workflows are behind
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(node .github/scripts/pin-seldon-race.mjs "$SHA")"
          if [ -z "$changed" ]; then
            echo "The reusable workflows already pin the action at $SHA."
            exit 0
          fi
          title='ci(seldon-race): bump the action pin in the reusable workflows'
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The seldon-race action changed on main at $SHA, and these reusable workflows still pin an older commit:

          $(printf -- '- `%s`\n' $changed)

          From a checkout of main: \`node .github/scripts/pin-seldon-race.mjs $SHA\`, then commit, open a pull request and merge it through the queue. Close this issue when it lands.
          EOF
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue edit "$open" --body-file "$RUNNER_TEMP/body.md"
          fi
