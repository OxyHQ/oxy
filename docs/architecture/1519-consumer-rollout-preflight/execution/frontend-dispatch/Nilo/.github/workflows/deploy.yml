name: Deploy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      ci_run_id:
        description: Successful push CI run for this exact main SHA
        required: true
        type: string
  push:
    branches: [main]

# Deploys run one at a time and are never cancelled: a rollout interrupted
# half-way is worse than a late one. A newer pending run may replace an older
# pending one, which is safe because main's newer head contains it.
concurrency:
  group: deploy-nilo-frontend
  cancel-in-progress: false

jobs:
  deploy-frontend:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && vars.OXY_1519_ROLLOUT_HOLD != 'true'
    name: Deploy the web app to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manual release source and CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_WORKFLOW: .github/workflows/ci.yml
          OXY_1519_ROLLOUT_HOLD: ${{ vars.OXY_1519_ROLLOUT_HOLD }}
        run: python3 .github/scripts/verify-manual-frontend.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.NILO_API_URL }}
          # Public registered client ID; missing configuration leaves Oxy sign-in unavailable.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
        run: cd apps/app && bun run build:production

      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` with no way to turn it off, which would put a
      # second, CORS-less copy of Nilo on the internet. `workers_dev = false`
      # in apps/app/wrangler.toml leaves `nilo.so` as the only way in.
      #
      # `bunx wrangler` DIRECTLY, never `cloudflare/wrangler-action`. The action
      # installs its own wrangler and picks the package manager by looking for a
      # lockfile beside `workingDirectory` — there is none in `apps/app`, the
      # lockfile is at the repo root — so it falls back to npm and chokes on
      # `workspace:*`. Homiio took a production outage from exactly this on
      # 2026-08-09 (run 31292337344: `Fail extracting tarball for "wrangler"`,
      # published nothing, left a stale bundle against a changed API), Mercaria's
      # AGENTS.md forbids the action for the same reason, and Clarity's frontend
      # deploy hit the identical error this week. Do not "modernise" this back.
      #
      # `wrangler@4` is PINNED: an unpinned `bunx wrangler` re-resolves the
      # latest major on every deploy, changing the deploy path with no diff.
      - name: Verify manual release source and CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_WORKFLOW: .github/workflows/ci.yml
          OXY_1519_ROLLOUT_HOLD: ${{ vars.OXY_1519_ROLLOUT_HOLD }}
        run: python3 .github/scripts/verify-manual-frontend.py

      - name: Deploy the Worker
        run: cd apps/app && bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
