[install]
peer = false

# Supply-chain quarantine. A compromised release is typically caught and
# unpublished within hours to a couple of days, so refusing to RESOLVE anything
# published in the last week removes most of that window at no cost to the
# builds that matter: the gate applies to resolution only, never to a frozen
# install, so `bun install --frozen-lockfile` installs an already-locked fresh
# package with no complaint even on a cold manifest cache. It fires for whoever
# adds or bumps a dependency, which is exactly when the decision is being made.
# Override deliberately with `bun install --minimum-release-age=0`.
#
# A step that RE-RESOLVES rather than installing frozen has to opt out, because
# on a cold cache resolution judges every dependency afresh, already-locked ones
# included; `scripts/check-lockfile-sync.mjs` therefore passes the override.
#
# Only our own packages are excluded: the quarantine guards against a freshly
# compromised THIRD-PARTY release, and publishing an Oxy package and bumping its
# consumer in the same session is the normal workflow here, so a week-old
# quarantine on ourselves would just teach everyone to pass the override flag
# by reflex. The @oxy.so/* packages built IN this repo are workspaces and never
# come from the registry, but the list is the same in every Oxy repo with the
# quarantine, so it names them too. Bun matches `minimumReleaseAgeExcludes` by
# EXACT name (a scope glob such as "@oxy.so/*" is accepted and silently matches
# nothing), so the list names every published first-party package.
# `scripts/check-release-age-excludes.mjs` (run in CI) fails if bun.lock
# resolves a first-party package the list misses, or if the list names a glob
# or anything outside the first-party scopes. A newly published first-party
# package is added here in each of those repos.
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@alia-codea/cli",
  "@alia.onl/sdk",
  "@alia.onl/server",
  "@clarity.surf/sdk",
  "@crowdsource.you/contracts",
